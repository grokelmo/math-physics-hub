<style>

:root{
  --header:#0d7377; --accent:#0d9488; --accent2:#0f766e;
  --bg:#f0faf6; --card:#ffffff; --soft:#e8f5f1;
  --text:#134e4a; --muted:#5f7a76; --danger:#b91c1c; --ok:#047857;
  --shadow:0 8px 24px rgba(13,115,119,.12);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100%}
button{font:inherit;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
  border:none;border-radius:12px;padding:12px 18px;font-weight:700;letter-spacing:.02em;
  background:var(--accent);color:#fff;box-shadow:0 2px 0 var(--accent2);
  transition:transform .08s,filter .15s;min-height:44px;line-height:1.25;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:#fff;color:var(--accent2);border:2px solid var(--accent);box-shadow:none}
.btn-soft{background:var(--soft);color:var(--accent2);box-shadow:none;border:1px solid #c5e8df}
.btn-danger{background:#dc2626;box-shadow:0 2px 0 #991b1b}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
header.app-header{
  background:linear-gradient(135deg,var(--header),var(--accent2));
  color:#fff;padding:18px 20px 16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20;
}
header .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:800}
header .sub{opacity:.9;font-size:.9rem;margin-top:4px}
.lang-toggle{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;
  border-radius:999px;padding:8px 14px;font-weight:700;min-width:88px;text-align:center;
}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  border:1px solid #d7efe8;margin-bottom:16px;
}
.search-label{
  display:block;font-size:1.12rem;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.4;
}
#q{
  width:100%;min-height:70px;height:70px;padding:16px 18px;border-radius:14px;
  border:2px solid #b7ddd4;background:#fff;font-size:1.15rem;color:var(--text);
  outline:none;resize:none;line-height:1.4;
}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.suggest{margin-top:10px;display:none}
.suggest.show{display:block}
.chip{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
  background:var(--soft);border:1px solid #bfe5da;color:var(--accent2);
  border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.98rem;
}
.chip:hover{background:#d7f3eb}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:720px){.parts{grid-template-columns:1fr}}
.part-card h3{margin:0 0 10px;font-size:1.05rem;color:var(--accent2)}
.part-card .name{font-size:1.35rem;font-weight:800;margin:0 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:.98rem;margin:10px 0}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:600}
.topic-tag{
  margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--soft);
  color:var(--accent2);font-weight:700;font-size:.95rem;text-align:center;
}
.math{font-size:1.15rem;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.q-block{border:1px solid #d7efe8;border-radius:14px;padding:16px;margin-bottom:14px;background:#fbfffe}
.q-title{font-weight:800;margin:0 0 10px;font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;
  border:2px solid #d5ebe4;background:#fff;cursor:pointer;text-align:left;
}
.opt:hover{border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:var(--soft)}
.opt.correct{border-color:var(--ok);background:#ecfdf5}
.opt.wrong{border-color:var(--danger);background:#fef2f2}
.opt input{margin-top:3px}
.solution{
  display:none;margin-top:12px;padding:14px;border-radius:12px;background:#fff7ed;
  border:1px solid #fed7aa;color:#9a3412;
}
.solution.show{display:block}
.solution h4{margin:0 0 8px}
.modal-bg{
  position:fixed;inset:0;background:rgba(15,60,55,.45);display:none;align-items:center;justify-content:center;
  z-index:50;padding:16px;
}
.modal-bg.show{display:flex}
.modal{
  background:#fff;border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center;
  box-shadow:var(--shadow);
}
.modal img{width:180px;height:180px;object-fit:cover;border-radius:18px;margin:8px auto 12px;display:block;border:4px solid var(--soft)}
.modal h3{margin:0 0 6px;color:var(--accent2)}
.images-grid{display:grid;grid-template-columns:1fr;gap:16px}
.img-card{background:#fff;border:1px solid #d7efe8;border-radius:14px;padding:14px}
.img-card h4{margin:0 0 8px;text-align:center;color:var(--accent2)}
.img-card svg{width:100%;height:auto;display:block;background:#f8fffc;border-radius:10px}
.hidden{display:none !important}
.footer-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.def-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.def-supp{
  display:none;margin:0;padding:10px 12px;border-radius:10px;
  background:var(--soft);border:1px solid #c5e8df;color:var(--text);
  font-weight:600;font-size:.98rem;line-height:1.55;width:100%;
}
.def-supp.show{display:block}

.frac{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  vertical-align:middle;line-height:1.15;margin:0 .18em;font-weight:600;
}
.frac-num{padding:0 .22em 2px;border-bottom:1.6px solid currentColor;text-align:center}
.frac-den{padding:2px .22em 0;text-align:center}
.vec{position:relative;display:inline-block;padding-top:.35em;font-style:italic}
.vec::before{
  content:"→";position:absolute;top:-0.15em;left:50%;transform:translateX(-50%);
  font-size:.72em;line-height:1;font-style:normal;font-weight:700;
}
.mathrm{font-style:normal}
.thinsp{display:inline-block;width:.2em}
.tex-fallback{font-family:"Times New Roman",Times,"Noto Serif TC",serif;font-size:1.05em}
.toast-msg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;
  max-width:min(92vw,420px);padding:12px 18px;border-radius:12px;background:#0f172a;color:#fff;
  font-weight:700;font-size:.95rem;box-shadow:0 10px 30px rgba(15,23,42,.28);opacity:0;
  pointer-events:none;transition:opacity .25s ease, transform .25s ease}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.glossary-card .name{font-size:1.35rem;font-weight:800;margin:0 0 8px;color:var(--accent2)}
.glossary-card .zh-line{font-size:1.15rem;font-weight:700;margin:0 0 12px;line-height:1.5}
.glossary-card .note{margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--soft);
  color:var(--muted);font-weight:600;font-size:.98rem;line-height:1.55}
.glossary-card .star{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
  background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:.8rem;font-weight:700}

.opt .letter{font-weight:800;color:var(--accent2);min-width:1.4em}
.q-label{display:inline-block;background:var(--soft);color:var(--accent2);
  border-radius:999px;padding:2px 10px;font-size:.85rem;font-weight:800;margin-right:8px}
.no-calc-hint{padding:12px;border-radius:12px;background:var(--soft);color:var(--muted);font-weight:600}

 of the Q−ΔT graph gives the heat capacity of the body. Heat capacity depends on both the substance and the mass of the object.","equation":"Q = C\\,\\Delta T","equation_tex":"Q = C\\,\\Delta T","si_unit":"J °C⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J\\,°C^{-1}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":3,"hasImages":false},{"id":"specific-heat","zh":"比熱容量","en":"specific heat capacity","symbol":"c","aliases":["specific heat capacity","比熱容量","比熱容","c","specific heat","比熱"],"definition_zh":"加熱 1 kg 的物質，使它升温 1 °C 所需的能量，就稱為該物質的比熱容量。","definition_en":"The specific heat capacity of a substance is the energy needed to raise the temperature of 1 kg of the substance by 1 °C.","definition_zh_more":"熱容量描述的是個別物體的熱特性，而比熱容量描述的是某一物質的熱特性。物質的比熱容量愈高，就需要更多能量來使每千克該物質升温 1 °C。","definition_en_more":"Heat capacity describes the thermal property of an object while specific heat capacity describes the thermal property of a substance. A substance with a higher specific heat capacity requires more energy to increase its temperature by 1 °C for each kilogram of the substance.","equation":"E = mc\\,\\Delta T","equation_tex":"E = mc\\,\\Delta T","si_unit":"J kg⁻¹ °C⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J\\,kg^{-1}\\,°C^{-1}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":3,"hasImages":false},{"id":"specific-latent-heat","zh":"比潛熱","en":"specific latent heat","symbol":"l","aliases":["specific latent heat of fusion","specific latent heat of vaporization","比潛熱","l","specific latent heat","潛熱"],"definition_zh":"在温度不變的情況下，1 kg 物質轉變物態時，所吸收或釋放的能量就是該物質的比潛熱。","definition_en":"The specific latent heat of a substance is the energy absorbed or released to change the state of 1 kg of the substance without a change in temperature.","definition_zh_more":null,"definition_en_more":null,"equation":"E = l\\,\\Delta m","equation_tex":"E = l\\,\\Delta m","si_unit":"J kg⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J\\,kg^{-1}}","si_unit_name_zh":"焦耳每千克","si_unit_name_en":"joule per kilogram","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":4,"hasImages":false},{"id":"ideal-gas-law","zh":"理想氣體狀態方程（普適氣體定律）","en":"equation of state for an ideal gas","symbol":null,"aliases":["理想氣體狀態方程（普適氣體定律）","equation of state for an ideal gas","A3","普適氣體定律","理想氣體定律","理想氣體狀態方程","general gas law","ideal gas law","pV=nRT","pV = nRT"],"definition_zh":"壓強、體積、摩爾數與開氏温度的關係稱為普適氣體定律（亦稱理想氣體定律）。遵守普適氣體定律的氣體，稱為理想氣體。","definition_en":"The relationship between pressure, volume, amount of gas and Kelvin temperature is called the general gas law (also called the ideal gas law). A gas that obeys the general gas law is called an ideal gas.","definition_zh_more":null,"definition_en_more":null,"equation":"pV = nRT","equation_tex":"pV = nRT","si_unit":"Pa, m³, mol, K","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Pa,\\,m^{3},\\,mol,\\,K}","si_unit_name_zh":null,"si_unit_name_en":null,"type":null,"type_note_zh":null,"type_note_en":null,"topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":5,"hasImages":false},{"id":"kinetic-theory-equation","zh":"動能理論方程","en":"kinetic theory equation","symbol":null,"aliases":["動能理論方程","kinetic theory equation","pV","A4","方均根速度","方均根速率","root-mean-square speed","rms speed","mean square speed","\\overline{c^{2}}","方均值","mean square value","c_rms"],"definition_zh":"方程左邊包含氣體的宏觀特性，右邊則是從分子運動理論推導出來的微觀變量；有橫線的 c 平方是全部氣體分子速度的方均值。","definition_en":"The left-hand side contains the macroscopic properties of a gas whereas the right-hand side contains the microscopic parameters from the kinetic theory; c-squared with a bar is the mean square value of the velocities of all gas molecules.","definition_zh_more":null,"definition_en_more":null,"equation":"pV = \\dfrac{1}{3}Nm\\overline{c^{2}}","equation_tex":"pV = \\dfrac{1}{3}Nm\\overline{c^{2}}","si_unit":"Pa, m^{3}","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Pa,\\,m^{3}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":null,"type_note_zh":null,"type_note_en":null,"topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":5,"hasImages":false},{"id":"molecular-kinetic-energy","zh":"氣體分子的動能","en":"molecular kinetic energy","symbol":"E_K","aliases":["molecular KE","氣體分子動能","EK","氣體分子的動能","molecular kinetic energy","average molecular KE","E_K","E_{K}"],"definition_zh":"温度是氣體分子平均動能的量度。","definition_en":"Temperature is a measure of the average kinetic energy of the gas molecules.","definition_zh_more":null,"definition_en_more":null,"equation":"E_K = \\dfrac{3}{2}\\dfrac{RT}{N_A}","equation_tex":"E_K = \\dfrac{3}{2}\\dfrac{RT}{N_{A}}","si_unit":"J","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J}","si_unit_name_zh":"焦耳","si_unit_name_en":"joule","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":5,"hasImages":false},{"id":"force","zh":"力","en":"force","symbol":"F","aliases":["force","力","F","newton","作用力","外力"],"definition_zh":"力是能夠改變物體運動狀態或形狀的推或拉。根據牛頓第二定律，淨力等於動量變化率。","definition_en":"Force is a push or a pull that can change the motion or shape of a body. By Newton's second law, the net force equals the rate of change of momentum.","definition_zh_more":"力可以使物體加速或減速、改變運動方向，以及改變形狀。一般而言，力是沿某方向的推或拉。","definition_en_more":"A force can speed up or slow down an object, change its moving direction, and change its shape. In general, a force is a push or pull in a particular direction","equation":"F = \\dfrac{\\Delta p}{\\Delta t} = ma","equation_tex":"F = \\dfrac{\\Delta p}{\\Delta t} = ma","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"矢量","type_note_en":"Vector","topic_zh":"力與運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":3,"hasImages":false},{"id":"moment-of-force","zh":"力矩","en":"moment of a force","symbol":"τ","aliases":["moment","torque","力矩","轉矩"],"definition_zh":"力矩等於力 F 與垂直距離 d⊥ 的乘積；d⊥ 是施力點與支點的距離。方向以順時針或逆時針表示。","definition_en":"The moment of a force is F times the perpendicular distance d⊥ from the pivot; d⊥ is the distance between the point of application of the force and the pivot. Its sense is given as clockwise or anticlockwise.","definition_zh_more":null,"definition_en_more":null,"equation":"\\tau = Fd","equation_tex":"\\tau = Fd","si_unit":"N m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N\\,m}","si_unit_name_zh":"牛頓米","si_unit_name_en":"newton metre","type":"vector","type_note_zh":"方向以順／逆時針表示","type_note_en":"sense given as clockwise / anticlockwise","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":5,"hasImages":false},{"id":"gpe","zh":"重力勢能","en":"gravitational potential energy","symbol":"GPE / PE","aliases":["gravitational potential energy","引力勢能","重力勢能","GPE","PE","potential energy","gravitational PE","勢能","位能","重力位能","E_p"],"definition_zh":"重力勢能是物體因其在重力場中的位置而具有的能量。在地球表面附近，其大小取決於質量、重力場強度，以及相對選定參考水平的高度。","definition_en":"Gravitational potential energy is the energy possessed by a body due to its position in a gravitational field. Near the Earth's surface its value depends on mass, gravitational field strength and height above a chosen reference level.","definition_zh_more":"重力勢能是物體在重力作用下因其位置而具有的能量。升到較高位置時重力勢能增加。參考高度可任意選定；重力勢能。","definition_en_more":"Gravitational potential energy is the energy possessed by an object due to its position under gravity. When raised to a higher position it gains gravitational potential energy.","equation":"PE = mgh","equation_tex":"\\mathrm{PE} = mgh","si_unit":"J","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"力與運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":6,"hasImages":false},{"id":"ke","zh":"動能","en":"kinetic energy","symbol":"KE","aliases":["kinetic energy","動能","KE","Ek","E_k"],"definition_zh":"動能是物體因運動而具有的能量。","definition_en":"Kinetic energy is the energy possessed by a body due to its motion.","definition_zh_more":"動能是物體因其運動而擁有的能量。物體靜止時不具動能，移動得愈快動能愈高。動能與勢能合稱機械能。","definition_en_more":"Kinetic energy is the energy possessed by an object due to its motion. An object does not possess kinetic energy when stationary and possesses more kinetic energy when it moves faster. Kinetic energy and potential energy together are called mechanical energy.","equation":"KE = \\dfrac{1}{2}mv^{2}","equation_tex":"\\mathrm{KE} = \\dfrac{1}{2}mv^{2}","si_unit":"J","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"力與運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":6,"hasImages":false},{"id":"centripetal-acceleration","zh":"向心加速度","en":"centripetal acceleration","symbol":"a","aliases":["centripetal acceleration","向心加速度","centripital acceleration","向心加速"],"definition_zh":"物體作勻速圓周運動時，所受的向心力指向路徑的中心，因此這道力所產生的加速度 a 也會指向路徑的中心，並稱為向心加速度。","definition_en":"As the centripetal force acting on an object in uniform circular motion points towards the centre of the path, the acceleration a due to this force also points towards the centre and is called the centripetal acceleration.","definition_zh_more":"根據牛頓第二定律，作用於物體的淨力所產生的加速度，方向與淨力相同。由於物體作勻速圓周運動時，所受的向心力指向路徑的中心，因此這道力所產生的加速度 a 也會指向路徑的中心，並稱為向心加速度。","definition_en_more":"According to Newton’s second law, a net force acting on an object produces an acceleration in the same direction as the force. As the centripetal force acting on an object in uniform circular motion points towards the centre of the path, the acceleration a due to this force also points towards the centre and is called the centripetal acceleration.","equation":"a = \\dfrac{v^{2}}{r} = \\omega^{2}r","equation_tex":"a = \\dfrac{v^{2}}{r} = \\omega^{2}r","si_unit":"m s⁻²","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m\\,s^{-2}}","si_unit_name_zh":"米每二次方秒","si_unit_name_en":"metre per second squared","type":"vector","type_note_zh":"指向圓心","type_note_en":"points towards the centre","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":9,"hasImages":false},{"id":"gravitational-force","zh":"萬有引力","en":"gravitational force","symbol":"F","aliases":["萬有引力","引力","牛頓萬有引力定律","gravitational force","Newton's law of gravitation","Newton's law of universal gravitation","universal gravitation"],"definition_zh":"宇宙間任何兩個粒子都會互相吸引，吸力的大小與該兩個粒子的質量的乘積成正比，並與粒子之間距離的平方成反比。","definition_en":"Every particle in the universe attracts every other particle with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between them.","definition_zh_more":"導致蘋果下落的引力，以及使月亮一直圍繞地球運行的力，都是同一種力。牛頓進而推斷出引力存在於宇宙中所有物體之間。現在，這種力也稱為萬有引力。牛頓的發現以牛頓萬有引力定律來描述：宇宙間任何兩個粒子都會互相吸引，吸力的大小與該兩個粒子的質量的乘積成正比，並與粒子之間距離的平方成反比。","definition_en_more":"His discovery, now known as universal gravitation, is summarized in Newton’s law of universal gravitation. The law states that every particle in the universe attracts every other particle with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between them.","equation":"F = \\dfrac{G m_1 m_2}{r^{2}}","equation_tex":"F = \\dfrac{G m_1 m_2}{r^{2}}","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":"牛頓","si_unit_name_en":"newton","type":"vector","type_note_zh":"互相吸引／指向對方","type_note_en":"mutually attractive / towards each other","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":10,"hasImages":false},{"id":"fringe-separation","zh":"條紋間距","en":"fringe separation","symbol":"Δy","aliases":["fringe separation","條紋間距","Δy"],"definition_zh":"條紋間距是相鄰干涉條紋之間的距離；雙縫干涉中條紋間距在整個圖形中保持不變。","definition_en":"Fringe separation is the distance between adjacent interference fringes; in double-slit interference the fringe separation is the same across the whole pattern.","definition_zh_more":null,"definition_en_more":null,"equation":"\\Delta y = \\dfrac{\\lambda D}{a}","equation_tex":"\\Delta y = \\dfrac{\\lambda D}{a}","si_unit":"m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m}","si_unit_name_zh":"米","si_unit_name_en":"metre","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"波動","topic_en":"Wave Motion","part":"compulsory","book":"Book 3B","chapter":6,"hasImages":false},{"id":"wavelength","zh":"波長","en":"wavelength","symbol":"λ","aliases":["wavelength","波長","lambda","λ","波張"],"definition_zh":"波長是前進波上兩相鄰同相點（例如相鄰波峰）之間的最短距離。","definition_en":"Wavelength is the shortest distance between two points on a progressive wave that are in phase, for example consecutive crests.","definition_zh_more":"波重複自身的最短距離就是波長。橫波的波長相等於兩個相鄰波峯（或波谷）之間的距離。","definition_en_more":"The shortest distance over which a wave repeats itself is the wavelength. For a transverse wave, the wavelength equals the distance between two successive crests or troughs.","equation":"v = f\\lambda","equation_tex":"v = f\\lambda","si_unit":"m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"波動","topic_en":"Wave Motion","part":"compulsory","book":"Book 3B","chapter":6,"hasImages":false},{"id":"focal-length","zh":"焦距","en":"focal length","symbol":"f","aliases":["focal length","焦距","f"],"definition_zh":"透鏡的焦距是主焦點與光心之間的距離。","definition_en":"The focal length of a lens is the distance between the principal focus and the optical centre.","definition_zh_more":null,"definition_en_more":null,"equation":"\\dfrac{1}{u} + \\dfrac{1}{v} = \\dfrac{1}{f}","equation_tex":"\\dfrac{1}{u} + \\dfrac{1}{v} = \\dfrac{1}{f}","si_unit":"m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m}","si_unit_name_zh":"米","si_unit_name_en":"metre","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"波動","topic_en":"Wave Motion","part":"compulsory","book":"Book 3A","chapter":3,"hasImages":false},{"id":"coulomb-force","zh":"庫倫定律","en":"Coulomb's law","symbol":"F","aliases":["Coulomb's law","Coulomb’s law","庫倫定律","庫倫力","靜電力","電力","electrostatic force","coulomb force","Coulomb force"],"definition_zh":"庫倫發現兩個電荷之間的靜電力 F 的量值，與電量（Q1 和 Q2）的積成正比，與距離平方成反比（庫倫定律）。","definition_en":"In 1785, Charles Coulomb discovered that the magnitude of the electrostatic force F between two charges is directly proportional to the product of the charges and inversely proportional to the square of their separation (Coulomb’s law).","definition_zh_more":null,"definition_en_more":null,"equation":"F = \\dfrac{Q_1 Q_2}{4\\pi\\varepsilon_0 r^{2}}","equation_tex":"F = \\dfrac{Q_1 Q_2}{4\\pi\\varepsilon_0 r^{2}}","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":"牛頓","si_unit_name_en":"newton","type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":1,"hasImages":false},{"id":"bfield-long-wire","zh":"長直導線的磁場","en":"magnetic field due to a long straight wire","symbol":"B","aliases":["長直導線的磁場","magnetic field due to a long straight wire","B","D10"],"definition_zh":"載流長直導線四周的磁場呈圓形，以導線為中心；愈接近導線，磁場愈強。","definition_en":"The magnetic field around a long straight current-carrying wire forms circles centred on the wire; the field is stronger closer to the wire.","definition_zh_more":null,"definition_en_more":null,"equation":"B = \\dfrac{\\mu_0 I}{2\\pi r}","equation_tex":"B = \\dfrac{\\mu_0 I}{2\\pi r}","si_unit":"T","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{T}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量；磁場方向要用右手握拳定則","type_note_en":"vector; direction of the magnetic field is given by the right-hand grip rule","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":5,"hasImages":false},{"id":"bfield-solenoid","zh":"長螺線管內磁場","en":"magnetic field inside a long solenoid","symbol":"B","aliases":["長螺線管內磁場","magnetic field inside a long solenoid","B","D11"],"definition_zh":"螺線管是由多匝導線繞成的長線圈；電流通過時在管內產生近似勻強的磁場。","definition_en":"A solenoid is a long coil of many turns of wire; a current through it produces an approximately uniform magnetic field inside.","definition_zh_more":null,"definition_en_more":null,"equation":"B = \\dfrac{\\mu_0 N I}{\\ell}","equation_tex":"B = \\dfrac{\\mu_0 N I}{\\ell}","si_unit":"T","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{T}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量；磁場方向要用右手握拳定則","type_note_en":"vector; direction of the magnetic field is given by the right-hand grip rule","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":5,"hasImages":false},{"id":"induced-emf","zh":"感生電動勢","en":"induced e.m.f.","symbol":"ε","aliases":["induced emf","induced e.m.f.","感生電動勢","ε"],"definition_zh":"根據法拉第定律，感生電動勢與通過電路的磁通量變化率有關。","definition_en":"By Faraday’s law, the induced e.m.f. is related to the rate of change of magnetic flux through the circuit.","definition_zh_more":null,"definition_en_more":null,"equation":"\\varepsilon = N\\dfrac{\\Delta\\Phi}{\\Delta t}","equation_tex":"\\varepsilon = N\\dfrac{\\Delta\\Phi}{\\Delta t}","si_unit":"V","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{V}","si_unit_name_zh":"伏特","si_unit_name_en":"volt","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":7,"hasImages":false},{"id":"magnetic-flux","zh":"磁通量","en":"magnetic flux","symbol":"Φ","aliases":["magnetic flux","磁通量","Φ"],"definition_zh":"磁通量量度穿過某一面積的磁場「多少」，取決於磁通量密度、面積，以及磁場與面積法線的夾角。","definition_en":"Magnetic flux measures how much magnetic field passes through an area; it depends on the magnetic flux density, the area, and the angle between the field and the area normal.","definition_zh_more":null,"definition_en_more":null,"equation":"\\Phi = BA\\cos\\theta","equation_tex":"\\Phi = BA\\cos\\theta","si_unit":"Wb","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Wb}","si_unit_name_zh":"韋伯","si_unit_name_en":"weber","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":7,"hasImages":false},{"id":"transformer-turns-ratio","zh":"變壓器電壓比與匝數比","en":"ratio of secondary voltage to primary voltage in a transformer","symbol":"Vp/Vs","aliases":["變壓器電壓比與匝數比","ratio of secondary voltage to primary voltage in a transformer","Vs/Vp","D13"],"definition_zh":"理想變壓器中，原電壓與副電壓之比約等於原線圈匝數與副線圈匝數之比。","definition_en":"In an ideal transformer, the ratio of primary to secondary voltage is approximately equal to the ratio of primary to secondary turns.","definition_zh_more":null,"definition_en_more":null,"equation":"\\dfrac{V_p}{V_s} \\approx \\dfrac{N_p}{N_s}","equation_tex":"\\dfrac{V_p}{V_s} \\approx \\dfrac{N_p}{N_s}","si_unit":"電壓比","si_unit_zh":"電壓比","si_unit_en":"voltage ratio","si_unit_tex":"","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":8,"hasImages":false},{"id":"efield-strength","zh":"電場強度","en":"electric field strength","symbol":"E","aliases":["electric field strength","電場強度","場強","E","electric field","電場","E-field","點電荷的電場強度","平行板間電場強度","平行板電場","electric field strength due to a point charge","electric field between parallel plates","electric field intensity"],"definition_zh":"正檢驗電荷 q 置於電場中的某點時，會受電力 F 作用。在該點的電場強度 E 是 q 的每單位電荷所受的電力。","definition_en":"When a positive test charge q is placed in an electric field, an electric force F acts on it. The electric field strength E at that point is defined as the electric force per unit charge on q.","definition_zh_more":"點電荷周圍：E＝Q/(4πε₀r²)。平行板之間勻強電場：E＝V/d（單位亦可為 V m⁻¹）。","definition_en_more":"Around a point charge: E = Q/(4πε₀r²). Between parallel plates the field is uniform: E = V/d (E can also be measured in V m⁻¹).","equation":"\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}","equation_tex":"\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}","si_unit":"N C⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N\\,C^{-1}}","si_unit_name_zh":"牛頓每庫侖","si_unit_name_en":"newton per coulomb","type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":1,"hasImages":true},{"id":"resistivity","zh":"電阻率","en":"resistivity","symbol":"ρ","aliases":["resistivity","電阻率","ρ"],"definition_zh":"電阻率是物質的固有性質，決定單位長度、單位截面積導體的電阻。","definition_en":"Resistivity is an intrinsic property of a material that determines the resistance of a conductor of unit length and unit cross-sectional area.","definition_zh_more":null,"definition_en_more":null,"equation":"\\rho = \\dfrac{RA}{\\ell}","equation_tex":"\\rho = \\dfrac{RA}{\\ell}","si_unit":"Ω m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Ω\\,m}","si_unit_name_zh":"歐姆米","si_unit_name_en":"ohm metre","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":2,"hasImages":false},{"id":"resistance","zh":"電阻","en":"resistance","symbol":"R","aliases":["resistance","電阻","R","ohm","電阻值","歐姆"],"definition_zh":"導體的電阻等於其兩端電勢差與通過電流的比值。","definition_en":"Resistance of a conductor is the ratio of the potential difference across it to the current through it.","definition_zh_more":"導體的電阻等於導體兩端電壓與流過電流的比值。電勢差不變時，電阻愈低，電流愈大。","definition_en_more":"The resistance of a conductor is the ratio of the voltage across it to the current flowing through it. When the potential difference is fixed, a lower resistance allows a larger current.","equation":"R = \\dfrac{\\rho \\ell}{A}","equation_tex":"R = \\dfrac{\\rho \\ell}{A}","si_unit":"Ω","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Ω}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":2,"hasImages":false},{"id":"series-resistance","zh":"串聯電阻","en":"resistors in series","symbol":"R","aliases":["串聯電阻","resistors in series","R","D5"],"definition_zh":"電阻器以串聯方式連接時，等效電阻等於各電阻之和。","definition_en":"When resistors are connected in series, the equivalent resistance equals the sum of the individual resistances.","definition_zh_more":null,"definition_en_more":null,"equation":"R = R_1 + R_2","equation_tex":"R = R_1 + R_2","si_unit":"Ω","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Ω}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":2,"hasImages":false},{"id":"parallel-resistance","zh":"並聯電阻","en":"resistors in parallel","symbol":"R","aliases":["並聯電阻","resistors in parallel","R","D6"],"definition_zh":"電阻器以並聯方式連接時，等效電阻的倒數等於各電阻倒數之和。","definition_en":"When resistors are connected in parallel, the reciprocal of the equivalent resistance equals the sum of the reciprocals of the individual resistances.","definition_zh_more":null,"definition_en_more":null,"equation":"\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}","equation_tex":"\\dfrac{1}{R} = \\dfrac{1}{R_1} + \\dfrac{1}{R_2}","si_unit":"Ω","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Ω}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":2,"hasImages":false},{"id":"power","zh":"功率","en":"power","symbol":"P","aliases":["power","功率","P","watt","電功率","機械功率"],"definition_zh":"功率是能量的轉移率，即每單位時間轉移的能量。","definition_en":"Power is the rate of transfer of energy, that is, the energy transferred per unit time.","definition_zh_more":"加熱時功率是能量的轉移率；力學中若在時間內做了功，功率是單位時間所作的功。電學功率亦沿用同一概念。機械功率：P = Fv。","definition_en_more":"In heating, power is the rate of energy transfer; in mechanics, if work is done in time t, power is work done per unit time. The same idea of power also appears in current electricity.","equation":"P = \\dfrac{E}{t}","equation_tex":"P = \\dfrac{E}{t}","si_unit":"W","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{W}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"力與運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":6,"hasImages":false},{"id":"magnetic-force-on-charge","zh":"磁場對運動電荷的作用力","en":"force on a moving charge in a magnetic field","symbol":"F","aliases":["magnetic force on charge","磁力"],"definition_zh":"磁場對運動電荷的作用力，其大小取決於磁場、電荷量、速率，以及速度與磁場方向的夾角。","definition_en":"The magnetic force on a moving charge depends on the magnetic field, the charge, the speed, and the angle between the velocity and the field.","definition_zh_more":null,"definition_en_more":null,"equation":"F = BQv\\sin\\theta","equation_tex":"F = BQv\\sin\\theta","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":"牛頓","si_unit_name_en":"newton","type":"vector","type_note_zh":"向量；力的方向需用弗林明左手法則","type_note_en":"vector; direction of the force is given by Fleming's left-hand rule","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":6,"hasImages":false},{"id":"magnetic-force-on-conductor","zh":"磁場對載流導體的作用力","en":"force on a current-carrying conductor in a magnetic field","symbol":"F","aliases":["magnetic force on wire","載流導體受力"],"definition_zh":"磁場對載流導體的作用力，其大小取決於磁場、電流、導體長度，以及電流方向與磁場的夾角。","definition_en":"The magnetic force on a current-carrying conductor depends on the magnetic field, the current, the length of the conductor, and the angle between the current and the field.","definition_zh_more":null,"definition_en_more":null,"equation":"F = BIl\\sin\\theta","equation_tex":"F = BIl\\sin\\theta","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":"牛頓","si_unit_name_en":"newton","type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":6,"hasImages":false},{"id":"bfield","zh":"磁場","en":"magnetic field","symbol":"B","aliases":["magnetic field","B field","B-field","b field","magnetic field strength","magnetic field intensity","magnetic flux density","磁場","磁場強度","磁通量密度","磁場强","B","magnetic B"],"definition_zh":"磁場是磁體或電流周圍會對運動電荷或載流導體施磁力的空間區域。磁場 B 亦可解作磁通量密度。","definition_en":"A magnetic field is a region around a magnet or an electric current in which a moving charge or a current-carrying conductor experiences a magnetic force. The magnetic field B is also interpreted as magnetic flux density.","definition_zh_more":"按課程公式表：載流導體受力 F = BIl sinθ；長直導線磁場 B = μ₀I/(2πr)；長螺綫管內部磁場 B = μ₀NI/l。當導線垂直磁場（θ = 90°）時，F = BIl。B 的。","definition_en_more":"From the HKDSE formula list: force on a current-carrying conductor F = BIl sinθ; magnetic field due to a long straight wire B = μ₀I/(2πr); magnetic field inside a long solenoid B = μ₀NI/l. When the wire is perpendicular to B (θ = 90°), F = BIl.","equation":null,"equation_tex":"","si_unit":"T","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{T}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量；方向由北極指向南極","type_note_en":"vector; direction from north pole to south pole","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":5,"hasImages":true},{"id":"radioactive-decay-law","zh":"放射性衰變定律（未衰變核數）","en":"law of radioactive decay","symbol":"N","aliases":["放射性衰變定律（未衰變核數）","law of radioactive decay","N","E1"],"definition_zh":"未衰變原子核的數目隨時間按指數規律減少。","definition_en":"The number of undecayed nuclei decreases exponentially with time.","definition_zh_more":null,"definition_en_more":null,"equation":"N = N_0 e^{-kt}","equation_tex":"N = N_0 e^{-kt}","si_unit":"無","si_unit_zh":"無","si_unit_en":"none","si_unit_tex":"","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"放射","topic_en":"Radioactivity","part":"compulsory","book":"Book 5","chapter":2,"hasImages":false},{"id":"decay-constant","zh":"衰變常數","en":"decay constant","symbol":"k","aliases":["decay constant","衰變常數","λ","k"],"definition_zh":"衰變常數反映放射性核素在每單位時間內衰變的比例，是該核素的特質。","definition_en":"The decay constant characterises the fraction of nuclei of a radionuclide that decay per unit time.","definition_zh_more":null,"definition_en_more":null,"equation":"t_{1/2} = \\dfrac{\\ln 2}{k}","equation_tex":"t_{1/2} = \\dfrac{\\ln 2}{k}","si_unit":"s⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{s^{-1}}","si_unit_name_zh":"每秒","si_unit_name_en":"per second","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"放射現象和核能","topic_en":"Radioactivity and Nuclear Energy","part":"compulsory","book":"Book 5","chapter":2,"hasImages":false},{"id":"half-life","zh":"半衰期","en":"half-life","symbol":"t1/2","aliases":["half-life","半衰期","half life","t1/2","半減期"],"definition_zh":"放射性核素的半衰期是未衰變核數目（或活度）減至初值一半所需的時間。","definition_en":"Half-life of a radioactive nuclide is the time taken for the number of undecayed nuclei (or the activity) to fall to half of its initial value.","definition_zh_more":"半衰期是未衰變原子核數目減少一半所需的時間，也相等於放射強度減少一半所需的時間。每種放射性核素有獨特半衰期，不隨温度、壓力等外在因素改變。可由衰變曲線讀出半衰期。","definition_en_more":"The half-life of a radioactive substance is the time over which the number of radioactive nuclei decreases by half. It is also equal to the time taken for the activity of a radioactive sample to fall by half. Each radionuclide has a unique half-life that does not change with temperature or pressure. Half-life can be read from a decay curve.","equation":"t_{1/2} = \\dfrac{\\ln 2}{k}","equation_tex":"t_{1/2} = \\dfrac{\\ln 2}{k}","si_unit":"s","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{s}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"放射性和核能","topic_en":"Radioactivity and Nuclear Energy","part":"compulsory","book":"Book 5","chapter":2,"hasImages":false},{"id":"activity","zh":"放射強度","en":"activity","symbol":"A","aliases":["activity","放射強度","A","Bq"],"definition_zh":"放射樣本的衰變率稱為放射強度。","definition_en":"The rate of decay of a sample is called its activity.","definition_zh_more":null,"definition_en_more":null,"equation":"A = kN","equation_tex":"A = kN","si_unit":"Bq","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Bq}","si_unit_name_zh":"貝可勒爾","si_unit_name_en":"becquerel","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"放射現象和核能","topic_en":"Radioactivity and Nuclear Energy","part":"compulsory","book":"Book 5","chapter":2,"hasImages":false},{"id":"mass-energy","zh":"質能","en":"mass–energy","symbol":"ΔE","aliases":["mass-energy relationship","質能關係","ΔE"],"definition_zh":"質量可以轉化為能量，能量也可以轉化為質量；兩者以質能關係聯繫。","definition_en":"Mass can be converted into energy and energy into mass; they are related by the mass–energy relationship.","definition_zh_more":null,"definition_en_more":null,"equation":"\\Delta E = \\Delta m c^{2}","equation_tex":"\\Delta E = \\Delta m c^{2}","si_unit":"J","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J}","si_unit_name_zh":"焦耳","si_unit_name_en":"joule","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"放射現象和核能","topic_en":"Radioactivity and Nuclear Energy","part":"compulsory","book":"Book 5","chapter":3,"hasImages":false},{"id":"acceleration","zh":"加速度","en":"acceleration","symbol":"a","aliases":["acceleration","加速度","a","accel","加速率"],"definition_zh":"加速度是速度的變化率。","definition_en":"Acceleration is the rate of change of velocity.","definition_zh_more":"加速度是速度的變化率，用來量度物體速度改變得有多快。物體加速、減速或改變方向時都在加速。直線運動的平均加速度可由初速、末速與時間間隔求得。","definition_en_more":"Acceleration is the rate of change of velocity and a measure of how fast an object changes its velocity. An object accelerates whenever it speeds up, slows down, or changes direction. Along a straight line, average acceleration follows from initial to final velocity over a time interval.","equation":"a = \\dfrac{v - u}{t}","equation_tex":"a = \\dfrac{v - u}{t}","si_unit":"m s⁻²","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m\\,s^{-2}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":1,"hasImages":false},{"id":"displacement","zh":"位移","en":"displacement","symbol":"s","aliases":["displacement","位移","排量","Δs"],"definition_zh":"位移是物體位置的改變，由初位置指向末位置。","definition_en":"Displacement is the change in position of a body, from the initial position to the final position.","definition_zh_more":"位移只取決於起點與終點，與路徑無關。沿閉合路徑走完一圈時位移為零，但路程可以不為零。平均速度等於位移除以時間間隔。","definition_en_more":"Displacement depends only on the start and end points, not on the path taken. On a closed path the displacement is zero even if the distance travelled is not. Average velocity equals displacement divided by the time interval.","equation":"s = r_f - r_i","equation_tex":"s = r_f - r_i","si_unit":"m","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":1,"hasImages":false},{"id":"speed","zh":"速率","en":"speed","symbol":"v","aliases":["speed","速率","速率大小","平均速率","v"],"definition_zh":"速率是路程的變化率，等於速度的大小。","definition_en":"Speed is the rate of change of distance travelled (path length), equal to the magnitude of velocity.","definition_zh_more":"平均速率等於總路程除以總時間。與速度不同，速率沒有方向。沿直線且不折返時，平均速度的大小等於平均速率；沿閉合路徑時位移可為零而平均速率不為零。公式中常用同一字母 v，須按語境分辨是速率還是速度。","definition_en_more":"Average speed equals total distance travelled divided by total time. Unlike velocity, speed has no direction. Along a straight line with no turning back, the magnitude of average velocity equals average speed; on a closed path, displacement can be zero while average speed is not. In equations the same letter v is often used, so check whether the context means speed or velocity.","equation":"v = \\dfrac{s}{t}","equation_tex":"v = \\dfrac{s}{t}","si_unit":"m s⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m\\,s^{-1}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":1,"hasImages":false},{"id":"velocity","zh":"速度","en":"velocity","symbol":"v","aliases":["velocity","速度","vel","平均速度","瞬时速度","瞬時速度","v"],"definition_zh":"速度是位移的變化率，方向與位移變化相同。","definition_en":"Velocity is the rate of change of displacement, in the direction of the change in displacement.","definition_zh_more":"平均速度等於位移除以時間間隔。速度與速率不同：速率。物體可以速率不變但因方向改變而速度改變，例如圓周運動。瞬時速度是時間間隔趨近零時平均速度的極限值。","definition_en_more":"Average velocity equals displacement divided by the time interval. Velocity differs from speed: speed tells how fast, while velocity also has direction. An object can keep the same speed but change velocity when its direction changes, for example in circular motion. Instantaneous velocity is the limiting value of average velocity as the time interval approaches zero.","equation":"v_{av} = \\dfrac{\\Delta s}{\\Delta t}","equation_tex":"v_{av} = \\dfrac{\\Delta s}{\\Delta t}","si_unit":"m s⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{m\\,s^{-1}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":1,"hasImages":false},{"id":"intensity-level","zh":"聲強級","en":"intensity level","symbol":"L","aliases":["sound intensity level","聲強級","intensity level","L"],"definition_zh":"聲強級是用對數標度表示的聲強度，用來描述聲音的響度。","definition_en":"Sound intensity level is a logarithmic measure of sound intensity used to describe loudness.","definition_zh_more":null,"definition_en_more":null,"equation":"L = 10\\log\\dfrac{I}{I_0}","equation_tex":"L = 10\\log\\dfrac{I}{I_0}","si_unit":"dB","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{dB}","si_unit_name_zh":"分貝","si_unit_name_en":"decibel","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"醫學物理","topic_en":"Medical Physics","part":"compulsory","book":"Book E4","chapter":2,"hasImages":false},{"id":"current","zh":"電流","en":"electric current","symbol":"I","aliases":["electric current","current","電流","I","ampere","電劉","電琉","電流通量"],"definition_zh":"電流是電荷流動的速率。按慣例，電流方向取正電荷流動的方向。","definition_en":"Electric current is the rate of flow of electric charge. Conventionally, the direction of current is the direction of flow of positive charge.","definition_zh_more":"電流是電荷的流動率。數學上，電流等於每單位時間內經過導線截面的總電量。1 A 代表截面每秒有 1 C 的電荷經過。","definition_en_more":"An electric current is the rate of flow of electric charges. Current I is the total charge flowing through a cross-section of a conducting wire per unit time. One ampere means one coulomb of charge passes every second. Typical appliance currents give a sense of scale.","equation":"I = \\dfrac{Q}{t}","equation_tex":"I = \\dfrac{Q}{t}","si_unit":"A","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{A}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"方向由正極流向負極","type_note_en":"Direction is from the positive terminal to the negative terminal","topic_zh":"電和磁","topic_en":"Electricity and Magnetism","part":"compulsory","book":"Book 4","chapter":2,"hasImages":false},{"id":"density","zh":"密度","en":"density","symbol":"ρ","aliases":["density","密度","rho","ρ"],"definition_zh":"密度等於質量除以體積。","definition_en":"Density equals mass divided by volume.","definition_zh_more":null,"definition_en_more":null,"equation":"\\rho = \\dfrac{m}{V}","equation_tex":"\\rho = \\dfrac{m}{V}","si_unit":"kg m⁻³","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{kg\\,m^{-3}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book E3","chapter":4,"hasImages":false},{"id":"frequency","zh":"頻率","en":"frequency","symbol":"f","aliases":["frequency","頻率","f","Hz","振動數","振盪頻率"],"definition_zh":"頻率是單位時間內完成的振動（或波週期）次數。","definition_en":"Frequency is the number of complete oscillations (or wave cycles) per unit time.","definition_zh_more":"頻率是一秒內產生的完整波數目。波與振動源頻率相同。頻率與週期互為倒數。","definition_en_more":"The frequency of a wave is the number of complete cycles of the wave produced in one second. The frequency of a wave is the same as the frequency of the vibrating source. Period and frequency are reciprocals.","equation":"f = \\dfrac{1}{T}","equation_tex":"f = \\dfrac{1}{T}","si_unit":"Hz","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Hz}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"波動","topic_en":"Wave Motion","part":"compulsory","book":null,"chapter":null,"hasImages":false},{"id":"mass","zh":"質量","en":"mass","symbol":"m","aliases":["mass","質量"],"definition_zh":"質量量度物體所含物質的多少，亦反映其慣性（抗拒運動狀態改變的程度）。","definition_en":"Mass is a measure of the amount of matter in a body and of its inertia (resistance to change in motion).","definition_zh_more":"在 $F=ma$ 中，同一淨力下質量愈大加速度愈小。","definition_en_more":"In $F=ma$, a larger mass means a smaller acceleration for the same net force.","equation":"m = \\dfrac{F}{a}","equation_tex":"m = \\dfrac{F}{a}","si_unit":"kg","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{kg}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":3,"hasImages":false},{"id":"period","zh":"週期","en":"period","symbol":"T","aliases":["period","週期","周期","oscillation period","振動週期"],"definition_zh":"週期是完成一次振動（或一個波週期）所需的時間。","definition_en":"Period is the time taken for one complete oscillation (or one wave cycle).","definition_zh_more":"週期與頻率互為倒數：頻率愈高，週期愈短。對波而言，週期是相鄰波峰經過同一點的時間間隔。","definition_en_more":"Period and frequency are reciprocals: a higher frequency means a shorter period. For a wave, the period is the time between consecutive crests passing a fixed point.","equation":"T = \\dfrac{1}{f}","equation_tex":"T = \\dfrac{1}{f}","si_unit":"s","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{s}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"波動","topic_en":"Wave Motion","part":"compulsory","book":null,"chapter":null,"hasImages":false},{"id":"pressure","zh":"壓強","en":"pressure","symbol":"p","aliases":["pressure","壓強","壓强","p"],"definition_zh":"壓強是作用於表面每單位面積的法向（垂直）力。","definition_en":"Pressure is the normal (perpendicular) force exerted on a surface per unit area.","definition_zh_more":null,"definition_en_more":null,"equation":"p = \\dfrac{F}{A}","equation_tex":"p = \\dfrac{F}{A}","si_unit":"Pa (N m⁻²)","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{Pa}\\ (\\mathrm{N\\,m^{-2}})","si_unit_name_zh":"帕斯卡","si_unit_name_en":"pascal","type":"scalar","type_note_zh":"標量","type_note_en":"Scalar","topic_zh":"熱和氣體","topic_en":"Heat and Gases","part":"compulsory","book":"Book 1","chapter":5,"hasImages":false},{"id":"weight","zh":"重量","en":"weight","symbol":"W","aliases":["weight","重量","砝碼","權重","重力"],"definition_zh":"物體的重量是作用在其上的重力。在地球表面附近，重量等於質量乘以重力場強度。","definition_en":"Weight of a body is the gravitational force acting on it. Near the Earth's surface, weight equals mass times gravitational field strength.","definition_zh_more":"質量是物質的量，不隨位置改變；重量取決於當地重力場。同一質量在月球上的重量較小。","definition_en_more":"Mass is the amount of matter and does not change with location; weight depends on the local gravitational field. On the Moon the same mass has a smaller weight.","equation":"W = mg","equation_tex":"W = mg","si_unit":"N","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":3,"hasImages":false},{"id":"work","zh":"功","en":"work","symbol":"W","aliases":["work","功","mechanical work","機械功","做功"],"definition_zh":"恆力所做的機械功等於力、作用點位移，以及兩者夾角餘弦的乘積。","definition_en":"Mechanical work done by a constant force is the product of the force, the displacement of the point of application, and the cosine of the angle between them.","definition_zh_more":"功是能量轉移的過程。若力與位移垂直，該力不做功。正功表示能量傳入系統；負功表示能量傳出系統。","definition_en_more":"Work is a process of energy transfer. If the force is perpendicular to the displacement, no work is done by that force. Positive work transfers energy to the system; negative work transfers energy out.","equation":"W = Fs\\cos\\theta","equation_tex":"W = Fs\\cos\\theta","si_unit":"J","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{J}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":6,"hasImages":false},{"id":"impulse","zh":"衝量","en":"impulse","symbol":"J","aliases":["impulse","衝量","impulse of force","力的衝量"],"definition_zh":"力的衝量等於力與作用時間的乘積（力恆定時），並等於物體動量的改變。","definition_en":"Impulse of a force is the product of the force and the time interval for which it acts (for a constant force). It equals the change in momentum of the body.","definition_zh_more":"短時間的大力與長時間的小力可以產生相同衝量。","definition_en_more":"A large force acting for a short time can produce the same impulse as a smaller force acting for a longer time.","equation":"J = F\\Delta t = \\Delta p","equation_tex":"J = F\\Delta t = \\Delta p","si_unit":"N s","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{N\\,s}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":7,"hasImages":false},{"id":"momentum","zh":"動量","en":"momentum","symbol":"p","aliases":["momentum","linear momentum","動量","綫動量","p","mv","lin momentum","動量守恒","動量守恆"],"definition_zh":"物體的動量等於其質量與速度的乘積。方向與速度相同。","definition_en":"Momentum of a body is the product of its mass and velocity. It has the same direction as the velocity.","definition_zh_more":"動量對研究碰撞十分有用。同一物體速度愈高，動量愈大；以相同速率移動時，質量較大的物體動量較大。","definition_en_more":"It is especially useful for studying collisions. An object has greater momentum when it moves faster; for the same speed, a more massive object has greater momentum.","equation":"p = mv","equation_tex":"p = mv","si_unit":"kg m s⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{kg\\,m\\,s^{-1}}","si_unit_name_zh":null,"si_unit_name_en":null,"type":"vector","type_note_zh":"向量","type_note_en":"vector","topic_zh":"力和運動","topic_en":"Force and Motion","part":"compulsory","book":"Book 2","chapter":7,"hasImages":false},{"id":"illuminance","zh":"照明度","en":"illuminance","symbol":"E","aliases":["illuminance","照明度","光照度","E"],"definition_zh":"照明度（光照度）是每單位面積所接收的光通量。","definition_en":"Illuminance is the luminous flux falling on unit area of a surface.","definition_zh_more":null,"definition_en_more":null,"equation":"E = \\dfrac{\\Phi}{A}","equation_tex":"E = \\dfrac{\\Phi}{A}","si_unit":"lx","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{lx}","si_unit_name_zh":"勒克斯","si_unit_name_en":"lux","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"能量和能源的使用","topic_en":"Energy and Use of Energy","part":"elective","book":"Book E3","chapter":2,"hasImages":false},{"id":"acoustic-impedance","zh":"聲阻抗","en":"acoustic impedance","symbol":"Z","aliases":["acoustic impedance","聲阻抗","Z"],"definition_zh":"介質的聲阻抗等於其密度與超聲波在該介質中傳播速率的乘積。","definition_en":"The acoustic impedance of a medium equals the product of its density and the speed of ultrasound in that medium.","definition_zh_more":null,"definition_en_more":null,"equation":"Z = \\rho c","equation_tex":"Z = \\rho c","si_unit":"kg m⁻² s⁻¹","si_unit_zh":null,"si_unit_en":null,"si_unit_tex":"\\mathrm{kg\\,m^{-2}\\,s^{-1}}","si_unit_name_zh":"千克每平方米秒","si_unit_name_en":"kilogram per square metre second","type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"醫學物理","topic_en":"Medical Physics","part":"elective","book":"Book E4","chapter":2,"hasImages":false},{"id":"intensity-reflection-coefficient","zh":"反射聲強係數","en":"intensity reflection coefficient","symbol":"α","aliases":["intensity reflection coefficient","反射聲強係數","α"],"definition_zh":"反射聲強係數描述超聲波在兩種介質界面上反射能量所佔的比重。","definition_en":"The intensity reflection coefficient describes the fraction of ultrasound intensity reflected at the interface between two media.","definition_zh_more":null,"definition_en_more":null,"equation":"\\alpha = \\dfrac{I_r}{I_0} = \\left(\\dfrac{Z_2 - Z_1}{Z_2 + Z_1}\\right)^{2}","equation_tex":"\\alpha = \\dfrac{I_r}{I_0} = \\left(\\dfrac{Z_2 - Z_1}{Z_2 + Z_1}\\right)^{2}","si_unit":"無","si_unit_zh":"無","si_unit_en":"none","si_unit_tex":"","si_unit_name_zh":null,"si_unit_name_en":null,"type":"scalar","type_note_zh":null,"type_note_en":null,"topic_zh":"醫學物理","topic_en":"Medical Physics","part":"elective","book":"Book E4","chapter":2,"hasImages":false}];

re of that body by 1 °C.","The number of molecules in one mole is called the Avogadro constant (Avogadro’s number).","The relationship between pressure, volume, amount of gas and Kelvin temperature is called the general gas law (also called the ideal gas law). A gas that obeys the general gas law is called an ideal gas."],"ans":3,"sol_zh":"正確定義／重點：壓強、體積、摩爾數與開氏温度的關係稱為普適氣體定律（亦稱理想氣體定律）。遵守普適氣體定律的氣體，稱為理想氣體。","sol_en":"Correct definition / key idea: The relationship between pressure, volume, amount of gas and Kelvin temperature is called the general gas law (also called the ideal gas law). A gas that obeys the general gas law is called an ideal gas."},{"kind":"unit","q_zh":"「理想氣體狀態方程（普適氣體定律）」的 SI 單位是？","q_en":"The SI unit of “equation of state for an ideal gas” is?","opts_zh":["C","J","Pa, m³, mol, K","V"],"opts_en":["C","J","Pa, m³, mol, K","V"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{Pa,\\,m^{3},\\,mol,\\,K}$","sol_en":"SI unit: $\\mathrm{Pa,\\,m^{3},\\,mol,\\,K}$"},{"kind":"eq","q_zh":"與「理想氣體狀態方程（普適氣體定律）」相關的公式是？","q_en":"Which equation is associated with “equation of state for an ideal gas”?","opts_zh":["$E = mc\\,\\Delta T$","$G = 6.67 \\times 10^{-11}\\,\\mathrm{N\\,m^{2}\\,kg^{-2}}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$pV = nRT$"],"opts_en":["$E = mc\\,\\Delta T$","$G = 6.67 \\times 10^{-11}\\,\\mathrm{N\\,m^{2}\\,kg^{-2}}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$pV = nRT$"],"ans":3,"sol_zh":"公式：$pV = nRT$","sol_en":"Equation: $pV = nRT$"}],"kinetic-theory-equation":[{"kind":"def","q_zh":"下列哪一項最接近「動能理論方程」的定義／重點？","q_en":"Which best matches the definition / key idea of “kinetic theory equation”?","opts_zh":["方程左邊包含氣體的宏觀特性，右邊則是從分子運動理論推導出來的微觀變量；有橫線的 c 平方是全部氣體分子速度的方均值。","物體升温 1 °C 所需的能量，稱為該物體的熱容量。","加熱 1 kg 的物質，使它升温 1 °C 所需的能量，就稱為該物質的比熱容量。","每摩爾所含分子數目稱為阿佛加德羅常數（阿佛加德羅數）。"],"opts_en":["The left-hand side contains the macroscopic properties of a gas whereas the right-hand side contains the microscopic parameters from the kinetic theory; c-squared with a bar is the mean square value of the velocities of all gas molecules.","The heat capacity of a body is the energy needed to raise the temperature of that body by 1 °C.","The specific heat capacity of a substance is the energy needed to raise the temperature of 1 kg of the substance by 1 °C.","The number of molecules in one mole is called the Avogadro constant (Avogadro’s number)."],"ans":0,"sol_zh":"正確定義／重點：方程左邊包含氣體的宏觀特性，右邊則是從分子運動理論推導出來的微觀變量；有橫線的 c 平方是全部氣體分子速度的方均值。","sol_en":"Correct definition / key idea: The left-hand side contains the macroscopic properties of a gas whereas the right-hand side contains the microscopic parameters from the kinetic theory; c-squared with a bar is the mean square value of the velocities of all gas molecules."},{"kind":"unit","q_zh":"「動能理論方程」的 SI 單位是？","q_en":"The SI unit of “kinetic theory equation” is?","opts_zh":["Pa, m^{3}","Wb","kg","W"],"opts_en":["Pa, m^{3}","Wb","kg","W"],"ans":0,"sol_zh":"SI 單位：$\\mathrm{Pa,\\,m^{3}}$","sol_en":"SI unit: $\\mathrm{Pa,\\,m^{3}}$"},{"kind":"eq","q_zh":"與「動能理論方程」相關的公式是？","q_en":"Which equation is associated with “kinetic theory equation”?","opts_zh":["$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$Q = C\\,\\Delta T$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$pV = \\dfrac{1}{3}Nm\\overline{c^{2}}$"],"opts_en":["$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$Q = C\\,\\Delta T$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$pV = \\dfrac{1}{3}Nm\\overline{c^{2}}$"],"ans":3,"sol_zh":"公式：$pV = \\dfrac{1}{3}Nm\\overline{c^{2}}$","sol_en":"Equation: $pV = \\dfrac{1}{3}Nm\\overline{c^{2}}$"}],"molecular-kinetic-energy":[{"kind":"def","q_zh":"下列哪一項最接近「氣體分子的動能」的定義／重點？","q_en":"Which best matches the definition / key idea of “molecular kinetic energy”?","opts_zh":["在温度不變的情況下，1 kg 物質轉變物態時，所吸收或釋放的能量就是該物質的比潛熱。","壓強、體積、摩爾數與開氏温度的關係稱為普適氣體定律（亦稱理想氣體定律）。遵守普適氣體定律的氣體，稱為理想氣體。","温度是氣體分子平均動能的量度。","R 是普適氣體常數（亦稱摩爾氣體常數）。"],"opts_en":["The specific latent heat of a substance is the energy absorbed or released to change the state of 1 kg of the substance without a change in temperature.","The relationship between pressure, volume, amount of gas and Kelvin temperature is called the general gas law (also called the ideal gas law). A gas that obeys the general gas law is called an ideal gas.","Temperature is a measure of the average kinetic energy of the gas molecules.","R is the universal gas constant (also called the molar gas constant)."],"ans":2,"sol_zh":"正確定義／重點：温度是氣體分子平均動能的量度。","sol_en":"Correct definition / key idea: Temperature is a measure of the average kinetic energy of the gas molecules."},{"kind":"unit","q_zh":"「氣體分子的動能」的 SI 單位是？","q_en":"The SI unit of “molecular kinetic energy” is?","opts_zh":["Ω","m s⁻¹","Pa","J"],"opts_en":["Ω","m s⁻¹","Pa","J"],"ans":3,"sol_zh":"SI 單位：$\\mathrm{J}$（焦耳）","sol_en":"SI unit: $\\mathrm{J}$ (joule)"},{"kind":"type","q_zh":"「氣體分子的動能」是標量還是矢量？","q_en":"Is “molecular kinetic energy” a scalar or a vector?","opts_zh":["標量","兩者皆可","不是物理量","矢量"],"opts_en":["scalar","either","not a physical quantity","vector"],"ans":0,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「氣體分子的動能」相關的公式是？","q_en":"Which equation is associated with “molecular kinetic energy”?","opts_zh":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$R = 8.31\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$E_K = \\dfrac{3}{2}\\dfrac{RT}{N_{A}}$"],"opts_en":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$R = 8.31\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$E_K = \\dfrac{3}{2}\\dfrac{RT}{N_{A}}$"],"ans":3,"sol_zh":"公式：$E_K = \\dfrac{3}{2}\\dfrac{RT}{N_{A}}$","sol_en":"Equation: $E_K = \\dfrac{3}{2}\\dfrac{RT}{N_{A}}$"}],"force":[{"kind":"def","q_zh":"下列哪一項最接近「力」的定義／重點？","q_en":"Which best matches the definition / key idea of “force”?","opts_zh":["動能是物體因運動而具有的能量。","功率是能量的轉移率，即每單位時間轉移的能量。","力是能夠改變物體運動狀態或形狀的推或拉。根據牛頓第二定律，淨力等於動量變化率。","重力勢能是物體因其在重力場中的位置而具有的能量。在地球表面附近，其大小取決於質量、重力場強度，以及相對選定參考水平的高度。"],"opts_en":["Kinetic energy is the energy possessed by a body due to its motion.","Power is the rate of transfer of energy, that is, the energy transferred per unit time.","Force is a push or a pull that can change the motion or shape of a body. By Newton's second law, the net force equals the rate of change of momentum.","Gravitational potential energy is the energy possessed by a body due to its position in a gravitational field. Near the Earth's surface its value depends on mass, gravitational field strength and height above a chosen reference level."],"ans":2,"sol_zh":"正確定義／重點：力是能夠改變物體運動狀態或形狀的推或拉。根據牛頓第二定律，淨力等於動量變化率。","sol_en":"Correct definition / key idea: Force is a push or a pull that can change the motion or shape of a body. By Newton's second law, the net force equals the rate of change of momentum."},{"kind":"unit","q_zh":"「力」的 SI 單位是？","q_en":"The SI unit of “force” is?","opts_zh":["m s⁻¹","W","N","m s⁻²"],"opts_en":["m s⁻¹","W","N","m s⁻²"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{N}$","sol_en":"SI unit: $\\mathrm{N}$"},{"kind":"type","q_zh":"「力」是標量還是矢量？","q_en":"Is “force” a scalar or a vector?","opts_zh":["不是物理量","兩者皆可","矢量","標量"],"opts_en":["not a physical quantity","either","vector","scalar"],"ans":2,"sol_zh":"知識庫標示為：矢量。","sol_en":"Knowledge base marks it as: vector."},{"kind":"eq","q_zh":"與「力」相關的公式是？","q_en":"Which equation is associated with “force”?","opts_zh":["$\\varepsilon_0 = 8.85 \\times 10^{-12}\\,\\mathrm{C^{2}\\,N^{-1}\\,m^{-2}}$","$F = \\dfrac{\\Delta p}{\\Delta t} = ma$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$"],"opts_en":["$\\varepsilon_0 = 8.85 \\times 10^{-12}\\,\\mathrm{C^{2}\\,N^{-1}\\,m^{-2}}$","$F = \\dfrac{\\Delta p}{\\Delta t} = ma$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$"],"ans":1,"sol_zh":"公式：$F = \\dfrac{\\Delta p}{\\Delta t} = 於原線圈匝數與副線圈匝數之比。","載流長直導線四周的磁場呈圓形，以導線為中心；愈接近導線，磁場愈強。"],"opts_en":["Electric current is the rate of flow of electric charge. Conventionally, the direction of current is the direction of flow of positive charge.","When a positive test charge q is placed in an electric field, an electric force F acts on it. The electric field strength E at that point is defined as the electric force per unit charge on q.","In an ideal transformer, the ratio of primary to secondary voltage is approximately equal to the ratio of primary to secondary turns.","The magnetic field around a long straight current-carrying wire forms circles centred on the wire; the field is stronger closer to the wire."],"ans":1,"sol_zh":"正確定義／重點：正檢驗電荷 q 置於電場中的某點時，會受電力 F 作用。在該點的電場強度 E 是 q 的每單位電荷所受的電力。","sol_en":"Correct definition / key idea: When a positive test charge q is placed in an electric field, an electric force F acts on it. The electric field strength E at that point is defined as the electric force per unit charge on q."},{"kind":"unit","q_zh":"「電場強度」的 SI 單位是？","q_en":"The SI unit of “electric field strength” is?","opts_zh":["C","N","N C⁻¹","m s⁻¹"],"opts_en":["C","N","N C⁻¹","m s⁻¹"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{N\\,C^{-1}}$（牛頓每庫侖）","sol_en":"SI unit: $\\mathrm{N\\,C^{-1}}$ (newton per coulomb)"},{"kind":"type","q_zh":"「電場強度」是標量還是矢量？","q_en":"Is “electric field strength” a scalar or a vector?","opts_zh":["矢量","不是物理量","標量","兩者皆可"],"opts_en":["vector","not a physical quantity","scalar","either"],"ans":0,"sol_zh":"知識庫標示為：矢量。","sol_en":"Knowledge base marks it as: vector."},{"kind":"eq","q_zh":"與「電場強度」相關的公式是？","q_en":"Which equation is associated with “electric field strength”?","opts_zh":["$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$"],"opts_en":["$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$"],"ans":1,"sol_zh":"公式：$\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}$","sol_en":"Equation: $\\begin{gathered} E = \\dfrac{F}{q} \\\\ E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^{2}} \\\\ E = \\dfrac{V}{d} \\end{gathered}$"}],"resistivity":[{"kind":"def","q_zh":"下列哪一項最接近「電阻率」的定義／重點？","q_en":"Which best matches the definition / key idea of “resistivity”?","opts_zh":["螺線管是由多匝導線繞成的長線圈；電流通過時在管內產生近似勻強的磁場。","μ₀ 是真空磁導率。","電阻率是物質的固有性質，決定單位長度、單位截面積導體的電阻。","載流長直導線四周的磁場呈圓形，以導線為中心；愈接近導線，磁場愈強。"],"opts_en":["A solenoid is a long coil of many turns of wire; a current through it produces an approximately uniform magnetic field inside.","μ₀ is the permeability of free space.","Resistivity is an intrinsic property of a material that determines the resistance of a conductor of unit length and unit cross-sectional area.","The magnetic field around a long straight current-carrying wire forms circles centred on the wire; the field is stronger closer to the wire."],"ans":2,"sol_zh":"正確定義／重點：電阻率是物質的固有性質，決定單位長度、單位截面積導體的電阻。","sol_en":"Correct definition / key idea: Resistivity is an intrinsic property of a material that determines the resistance of a conductor of unit length and unit cross-sectional area."},{"kind":"unit","q_zh":"「電阻率」的 SI 單位是？","q_en":"The SI unit of “resistivity” is?","opts_zh":["m s⁻²","m s⁻¹","Ω m","Ω"],"opts_en":["m s⁻²","m s⁻¹","Ω m","Ω"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{Ω\\,m}$（歐姆米）","sol_en":"SI unit: $\\mathrm{Ω\\,m}$ (ohm metre)"},{"kind":"type","q_zh":"「電阻率」是標量還是矢量？","q_en":"Is “resistivity” a scalar or a vector?","opts_zh":["兩者皆可","標量","不是物理量","矢量"],"opts_en":["either","scalar","not a physical quantity","vector"],"ans":1,"sol_zh":"知識庫標示為

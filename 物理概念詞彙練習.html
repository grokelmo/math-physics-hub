acement":[{"kind":"def","q_zh":"下列哪一項最接近「位移」的定義／重點？","q_en":"Which best matches the definition / key idea of “displacement”?","opts_zh":["物體作勻速圓周運動時，所受的向心力指向路徑的中心，因此這道力所產生的加速度 a 也會指向路徑的中心，並稱為向心加速度。","位移是物體位置的改變，由初位置指向末位置。","速率是路程的變化率，等於速度的大小。","力的衝量等於力與作用時間的乘積（力恆定時），並等於物體動量的改變。"],"opts_en":["As the centripetal force acting on an object in uniform circular motion points towards the centre of the path, the acceleration a due to this force also points towards the centre and is called the centripetal acceleration.","Displacement is the change in position of a body, from the initial position to the final position.","Speed is the rate of change of distance travelled (path length), equal to the magnitude of velocity.","Impulse of a force is the product of the force and the time interval for which it acts (for a constant force). It equals the change in momentum of the body."],"ans":1,"sol_zh":"正確定義／重點：位移是物體位置的改變，由初位置指向末位置。","sol_en":"Correct definition / key idea: Displacement is the change in position of a body, from the initial position to the final position."},{"kind":"unit","q_zh":"「位移」的 SI 單位是？","q_en":"The SI unit of “displacement” is?","opts_zh":["m","m s⁻¹","Pa","kg"],"opts_en":["m","m s⁻¹","Pa","kg"],"ans":0,"sol_zh":"SI 單位：$\\mathrm{m}$","sol_en":"SI unit: $\\mathrm{m}$"},{"kind":"type","q_zh":"「位移」是標量還是矢量？","q_en":"Is “displacement” a scalar or a vector?","opts_zh":["兩者皆可","標量","不是物理量","矢量"],"opts_en":["either","scalar","not a physical quantity","vector"],"ans":3,"sol_zh":"知識庫標示為：矢量。","sol_en":"Knowledge base marks it as: vector."},{"kind":"eq","q_zh":"與「位移」相關的公式是？","q_en":"Which equation is associated with “displacement”?","opts_zh":["$\\varepsilon_0 = 8.85 \\times 10^{-12}\\,\\mathrm{C^{2}\\,N^{-1}\\,m^{-2}}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$","$Q = C\\,\\Delta T$","$s = r_f - r_i$"],"opts_en":["$\\varepsilon_0 = 8.85 \\times 10^{-12}\\,\\mathrm{C^{2}\\,N^{-1}\\,m^{-2}}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$","$Q = C\\,\\Delta T$","$s = r_f - r_i$"],"ans":3,"sol_zh":"公式：$s = r_f - r_i$","sol_en":"Equation: $s = r_f - r_i$"}],"speed":[{"kind":"def","q_zh":"下列哪一項最接近「速率」的定義／重點？","q_en":"Which best matches the definition / key idea of “speed”?","opts_zh":["速度是位移的變化率，方向與位移變化相同。","G 是萬有引力常數。","速率是路程的變化率，等於速度的大小。","宇宙間任何兩個粒子都會互相吸引，吸力的大小與該兩個粒子的質量的乘積成正比，並與粒子之間距離的平方成反比。"],"opts_en":["Velocity is the rate of change of displacement, in the direction of the change in displacement.","G is the universal gravitational constant.","Speed is the rate of change of distance travelled (path length), equal to the magnitude of velocity.","Every particle in the universe attracts every other particle with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between them."],"ans":2,"sol_zh":"正確定義／重點：速率是路程的變化率，等於速度的大小。","sol_en":"Correct definition / key idea: Speed is the rate of change of distance travelled (path length), equal to the magnitude of velocity."},{"kind":"unit","q_zh":"「速率」的 SI 單位是？","q_en":"The SI unit of “speed” is?","opts_zh":["m s⁻¹","m s⁻²","Pa","V"],"opts_en":["m s⁻¹","m s⁻²","Pa","V"],"ans":0,"sol_zh":"SI 單位：$\\mathrm{m\\,s^{-1}}$","sol_en":"SI unit: $\\mathrm{m\\,s^{-1}}$"},{"kind":"type","q_zh":"「速率」是標量還是矢量？","q_en":"Is “speed” a scalar or a vector?","opts_zh":["不是物理量","矢量","兩者皆可","標量"],"opts_en":["not a physical quantity","vector","either","scalar"],"ans":3,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「速率」相關的公式是？","q_en":"Which equation is associated with “speed”?","opts_zh":["$v = \\dfrac{s}{t}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$Q = C\\,\\Delta T$","$E = mc\\,\\Delta T$"],"opts_en":["$v = \\dfrac{s}{t}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$Q = C\\,\\Delta T$","$E = mc\\,\\Delta T$"],"ans":0,"sol_zh":"公式：$v = \\dfrac{s}{t}$","sol_en":"Equation: $v = \\dfrac{s}{t}$"}],"velocity":[{"kind":"def","q_zh":"下列哪一項最接近「速度」的定義／重點？","q_en":"Which best matches the definition / key idea of “velocity”?","opts_zh":["G 是萬有引力常數。","力的衝量等於力與作用時間的乘積（力恆定時），並等於物體動量的改變。","力矩等於力 F 與垂直距離 d⊥ 的乘積；d⊥ 是施力點與支點的距離。方向以順時針或逆時針表示。","速度是位移的變化率，方向與位移變化相同。"],"opts_en":["G is the universal gravitational constant.","Impulse of a force is the product of the force and the time interval for which it acts (for a constant force). It equals the change in momentum of the body.","The moment of a force is F times the perpendicular distance d⊥ from the pivot; d⊥ is the distance between the point of application of the force and the pivot. Its sense is given as clockwise or anticlockwise.","Velocity is the rate of change of displacement, in the direction of the change in displacement."],"ans":3,"sol_zh":"正確定義／重點：速度是位移的變化率，方向與位移變化相同。","sol_en":"Correct definition / key idea: Velocity is the rate of change of displacement, in the direction of the change in displacement."},{"kind":"unit","q_zh":"「速度」的 SI 單位是？","q_en":"The SI unit of “velocity” is?","opts_zh":["N","T","m s⁻¹","kg"],"opts_en":["N","T","m s⁻¹","kg"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{m\\,s^{-1}}$","sol_en":"SI unit: $\\mathrm{m\\,s^{-1}}$"},{"kind":"type","q_zh":"「速度」是標量還是矢量？","q_en":"Is “velocity” a scalar or a vector?","opts_zh":["兩者皆可","標量","不是物理量","矢量"],"opts_en":["either","scalar","not a physical quantity","vector"],"ans":3,"sol_zh":"知識庫標示為：矢量。","sol_en":"Knowledge base marks it as: vector."},{"kind":"eq","q_zh":"與「速度」相關的公式是？","q_en":"Which equation is associated with “velocity”?","opts_zh":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$v_{av} = \\dfrac{\\Delta s}{\\Delta t}$"],"opts_en":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$v_{av} = \\dfrac{\\Delta s}{\\Delta t}$"],"ans":3,"sol_zh":"公式：$v_{av} = \\dfrac{\\Delta s}{\\Delta t}$","sol_en":"Equation: $v_{av} = \\dfrac{\\Delta s}{\\Delta t}$"}],"intensity-level":[{"kind":"def","q_zh":"下列哪一項最接近「聲強級」的定義／重點？","q_en":"Which best matches the definition / key idea of “intensity level”?","opts_zh":["反射聲強係數描述超聲波在兩種介質界面上反射能量所佔的比重。","在接近地球表面的位置，所有自由落體都以相同的加速度下落，這個加速度稱為重力加速度，簡寫為 g。方向向下。","介質的聲阻抗等於其密度與超聲波在該介質中傳播速率的乘積。","聲強級是用對數標度表示的聲強度，用來描述聲音的響度。"],"opts_en":["The intensity reflection coefficient describes the fraction of ultrasound intensity reflected at the interface between two media.","All objects have the same acceleration when they fall freely near the Earth’s surface. This acceleration is called acceleration due to gravity and is denoted by g. Its direction is downwards.","The acoustic impedance of a medium equals the product of its density and the speed of ultrasound in that medium.","Sound intensity level is a logarithmic measure of sound intensity used to describe loudness."],"ans":3,"sol_zh":"正確定義／重點：聲強級是用對數標度表示的聲強度，用來描述聲音的響度。","sol_en":"Correct definition / key idea: Sound intensity level is a logarithmic measure of sound intensity used to describe loudness."},{"kind":"unit","q_zh":"「聲強級」的 SI 單位是？","q_en":"The SI unit of “intensity level” is?","opts_zh":["dB","Hz","V","m s⁻¹"],"opts_en":["dB","Hz","V","m s⁻¹"],"ans":0,"sol_zh":"SI 單位：$\\mathrm{dB}$（分貝）","sol_en":"SI unit: $\\mathrm{dB}$ (decibel)"},{"kind":"type","q_zh":"「聲強級」是標量還是矢量？","q_en":"Is “intensity level” a scalar or a vector?","opts_zh":["矢量","標量","兩者皆可","不是物理量"],"opts_en":["vector","scalar","either","not a physical quantity"],"ans":1,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「聲強級」相關的公式是？","q_en":"Which equation is associated with “intensity level”?","opts_zh":["$L = 10\\log\\dfrac{I}{I_0}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$"],"opts_en":["$L = 10\\log\\dfrac{I}{I_0}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$"],"ans":0,"sol_zh":"公式：$L = 10\\log\\dfrac{I}{I_0}$","sol_en":"Equation: $L = 10\\log\\dfrac{I}{I_0}$"}],"current":[{"kind":"def","q_zh":"下列哪一項最接近「電流」的定義／重點？","q_en":"Which best matches the definition / key idea of “electric current”?","opts_zh":["導體的電阻等於其兩端電勢差與通過電流的比值。","電流是電荷流動的速率。按慣例，電流方向取正電荷流動的方向。","理想變壓器中，原電壓與副電壓之比約等於原線圈匝數與副線圈匝數之比。","載流長直導線四周的磁場呈圓形，以導線為中心；愈接近導線，磁場愈強。"],"opts_en":["Resistance of a conductor is the ratio of the potential difference across it to the current through it.","Electric current is the rate of flow of electric charge. Conventionally, the direction of current is the direction of flow of positive charge.","In an ideal transformer, the ratio of primary to secondary voltage is approximately equal to the ratio of primary to secondary turns.","The magnetic field around a long straight current-carrying wire forms circles centred on the wire; the field is stronger closer to the wire."],"ans":1,"sol_zh":"正確定義／重點：電流是電荷流動的速率。按慣例，電流方向取正電荷流動的方向。","sol_en":"Correct definition / key idea: Electric current is the rate of flow of electric charge. Conventionally, the direction of current is the direction of flow of positive charge."},{"kind":"unit","q_zh":"「電流」的 SI 單位是？","q_en":"The SI unit of “electric current” is?","opts_zh":["V","A","N","m s⁻²"],"opts_en":["V","A","N","m s⁻²"],"ans":1,"sol_zh":"SI 單位：$\\mathrm{A}$","sol_en":"SI unit: $\\mathrm{A}$"},{"kind":"type","q_zh":"「電流」是標量還是矢量？","q_en":"Is “electric current” a scalar or a vector?","opts_zh":["不是物理量","標量","兩者皆可","矢量"],"opts_en":["not a physical quantity","scalar","either","vector"],"ans":1,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「電流」相關的公式是？","q_en":"Which equation is associated with “electric current”?","opts_zh":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$G = 6.67 \\times 10^{-11}\\,\\mathrm{N\\,m^{2}\\,kg^{-2}}$","$u = 1.661 \\times 10^{-27}\\,\\mathrm{kg}$","$I = \\dfrac{Q}{t}$"],"opts_en":["$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$G = 6.67 \\times 10^{-11}\\,\\mathrm{N\\,m^{2}\\,kg^{-2}}$","$u = 1.661 \\times 10^{-27}\\,\\mathrm{kg}$","$I = \\dfrac{Q}{t}$"],"ans":3,"sol_zh":"公式：$I = \\dfrac{Q}{t}$","sol_en":"Equation: $I = \\dfrac{Q}{t}$"}],"density":[{"kind":"def","q_zh":"下列哪一項最接近「密度」的定義／重點？","q_en":"Which best matches the definition / key idea of “density”?","opts_zh":["物體升温 1 °C 所需的能量，稱為該物體的熱容量。","R 是普適氣體常數（亦稱摩爾氣體常數）。","密度等於質量除以體積。","方程左邊包含氣體的宏觀特性，右邊則是從分子運動理論推導出來的微觀變量；有橫線的 c 平方是全部氣體分子速度的方均值。"],"opts_en":["The heat capacity of a body is the energy needed to raise the temperature of that body by 1 °C.","R is the universal gas constant (also called the molar gas constant).","Density equals mass divided by volume.","The left-hand side contains the macroscopic properties of a gas whereas the right-hand side contains the microscopic parameters from the kinetic theory; c-squared with a bar is the mean square value of the velocities of all gas molecules."],"ans":2,"sol_zh":"正確定義／重點：密度等於質量除以體積。","sol_en":"Correct definition / key idea: Density equals mass divided by volume."},{"kind":"unit","q_zh":"「密度」的 SI 單位是？","q_en":"The SI unit of “density” is?","opts_zh":["N","m s⁻²","kg m⁻³","T"],"opts_en":["N","m s⁻²","kg m⁻³","T"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{kg\\,m^{-3}}$","sol_en":"SI unit: $\\mathrm{kg\\,m^{-3}}$"},{"kind":"type","q_zh":"「密度」是標量還是矢量？","q_en":"Is “density” a scalar or a vector?","opts_zh":["不是物理量","標量","兩者皆可","矢量"],"opts_en":["not a physical quantity","scalar","either","vector"],"ans":1,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「密度」相關的公式是？","q_en":"Which equation is associated with “density”?","opts_zh":["$Q = C\\,\\Delta T$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$\\rho = \\dfrac{m}{V}$"],"opts_en":["$Q = C\\,\\Delta T$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$N_{A} = 6.02 \\times 10^{23}\\,\\mathrm{mol^{-1}}$","$\\rho = \\dfrac{m}{V}$"],"ans":3,"sol_zh":"公式：$\\rho = \\dfrac{m}{V}$","sol_en":"Equation: $\\rho = \\dfrac{m}{V}$"}],"frequency":[{"kind":"def","q_zh":"下列哪一項最接近「頻率」的定義／重點？","q_en":"Which best matches the definition / key idea of “frequency”?","opts_zh":["透鏡的焦距是主焦點與光心之間的距離。","頻率是單位時間內完成的振動（或波週期）次數。","條紋間距是相鄰干涉條紋之間的距離；雙縫干涉中條紋間距在整個圖形中保持不變。","週期是完成一次振動（或一個波週期）所需的時間。"],"opts_en":["The focal length of a lens is the distance between the principal focus and the optical centre.","Frequency is the number of complete oscillations (or wave cycles) per unit time.","Fringe separation is the distance between adjacent interference fringes; in double-slit interference the fringe separation is the same across the whole pattern.","Period is the time taken for one complete oscillation (or one wave cycle)."],"ans":1,"sol_zh":"正確定義／重點：頻率是單位時間內完成的振動（或波週期）次數。","sol_en":"Correct definition / key idea: Frequency is the number of complete oscillations (or wave cycles) per unit time."},{"kind":"unit","q_zh":"「頻率」的 SI 單位是？","q_en":"The SI unit of “frequency” is?","opts_zh":["m s⁻²","C","Hz","kg"],"opts_en":["m s⁻²","C","Hz","kg"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{Hz}$","sol_en":"SI unit: $\\mathrm{Hz}$"},{"kind":"type","q_zh":"「頻率」是標量還是矢量？","q_en":"Is “frequency” a scalar or a vector?","opts_zh":["不是物理量","矢量","標量","兩者皆可"],"opts_en":["not a physical quantity","vector","scalar","either"],"ans":2,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「頻率」相關的公式是？","q_en":"Which equation is associated with “frequency”?","opts_zh":["$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$f = \\dfrac{1}{T}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$"],"opts_en":["$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$f = \\dfrac{1}{T}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$"],"ans":2,"sol_zh":"公式：$f = \\dfrac{1}{T}$","sol_en":"Equation: $f = \\dfrac{1}{T}$"}],"mass":[{"kind":"def","q_zh":"下列哪一項最接近「質量」的定義／重點？","q_en":"Which best matches the definition / key idea of “mass”?","opts_zh":["宇宙間任何兩個粒子都會互相吸引，吸力的大小與該兩個粒子的質量的乘積成正比，並與粒子之間距離的平方成反比。","質量量度物體所含物質的多少，亦反映其慣性（抗拒運動狀態改變的程度）。","在接近地球表面的位置，所有自由落體都以相同的加速度下落，這個加速度稱為重力加速度，簡寫為 g。方向向下。","物體的動量等於其質量與速度的乘積。方向與速度相同。"],"opts_en":["Every particle in the universe attracts every other particle with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between them.","Mass is a measure of the amount of matter in a body and of its inertia (resistance to change in motion).","All objects have the same acceleration when they fall freely near the Earth’s surface. This acceleration is called acceleration due to gravity and is denoted by g. Its direction is downwards.","Momentum of a body is the product of its mass and velocity. It has the same direction as the velocity."],"ans":1,"sol_zh":"正確定義／重點：質量量度物體所含物質的多少，亦反映其慣性（抗拒運動狀態改變的程度）。","sol_en":"Correct definition / key idea: Mass is a measure of the amount of matter in a body and of its inertia (resistance to change in motion)."},{"kind":"unit","q_zh":"「質量」的 SI 單位是？","q_en":"The SI unit of “mass” is?","opts_zh":["kg","V","m s⁻¹","W"],"opts_en":["kg","V","m s⁻¹","W"],"ans":0,"sol_zh":"SI 單位：$\\mathrm{kg}$","sol_en":"SI unit: $\\mathrm{kg}$"},{"kind":"type","q_zh":"「質量」是標量還是矢量？","q_en":"Is “mass” a scalar or a vector?","opts_zh":["矢量","標量","不是物理量","兩者皆可"],"opts_en":["vector","scalar","not a physical quantity","either"],"ans":1,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「質量」相關的公式是？","q_en":"Which equation is associated with “mass”?","opts_zh":["$m = \\dfrac{F}{a}$","$u = 1.661 \\times 10^{-27}\\,\\mathrm{kg}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$"],"opts_en":["$m = \\dfrac{F}{a}$","$u = 1.661 \\times 10^{-27}\\,\\mathrm{kg}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$","$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$"],"ans":0,"sol_zh":"公式：$m = \\dfrac{F}{a}$","sol_en":"Equation: $m = \\dfrac{F}{a}$"}],"period":[{"kind":"def","q_zh":"下列哪一項最接近「週期」的定義／重點？","q_en":"Which best matches the definition / key idea of “period”?","opts_zh":["條紋間距是相鄰干涉條紋之間的距離；雙縫干涉中條紋間距在整個圖形中保持不變。","透鏡的焦距是主焦點與光心之間的距離。","波長是前進波上兩相鄰同相點（例如相鄰波峰）之間的最短距離。","週期是完成一次振動（或一個波週期）所需的時間。"],"opts_en":["Fringe separation is the distance between adjacent interference fringes; in double-slit interference the fringe separation is the same across the whole pattern.","The focal length of a lens is the distance between the principal focus and the optical centre.","Wavelength is the shortest distance between two points on a progressive wave that are in phase, for example consecutive crests.","Period is the time taken for one complete oscillation (or one wave cycle)."],"ans":3,"sol_zh":"正確定義／重點：週期是完成一次振動（或一個波週期）所需的時間。","sol_en":"Correct definition / key idea: Period is the time taken for one complete oscillation (or one wave cycle)."},{"kind":"unit","q_zh":"「週期」的 SI 單位是？","q_en":"The SI unit of “period” is?","opts_zh":["J","Wb","W","s"],"opts_en":["J","Wb","W","s"],"ans":3,"sol_zh":"SI 單位：$\\mathrm{s}$","sol_en":"SI unit: $\\mathrm{s}$"},{"kind":"type","q_zh":"「週期」是標量還是矢量？","q_en":"Is “period” a scalar or a vector?","opts_zh":["矢量","不是物理量","兩者皆可","標量"],"opts_en":["vector","not a physical quantity","either","scalar"],"ans":3,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「週期」相關的公式是？","q_en":"Which equation is associated with “period”?","opts_zh":["$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$T = \\dfrac{1}{f}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$E = mc\\,\\Delta T$"],"opts_en":["$m_e = 9.11 \\times 10^{-31}\\,\\mathrm{kg}$","$T = \\dfrac{1}{f}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$E = mc\\,\\Delta T$"],"ans":1,"sol_zh":"公式：$T = \\dfrac{1}{f}$","sol_en":"Equation: $T = \\dfrac{1}{f}$"}],"pressure":[{"kind":"def","q_zh":"下列哪一項最接近「壓強」的定義／重點？","q_en":"Which best matches the definition / key idea of “pressure”?","opts_zh":["加熱 1 kg 的物質，使它升温 1 °C 所需的能量，就稱為該物質的比熱容量。","物體升温 1 °C 所需的能量，稱為該物體的熱容量。","在温度不變的情況下，1 kg 物質轉變物態時，所吸收或釋放的能量就是該物質的比潛熱。","壓強是作用於表面每單位面積的法向（垂直）力。"],"opts_en":["The specific heat capacity of a substance is the energy needed to raise the temperature of 1 kg of the substance by 1 °C.","The heat capacity of a body is the energy needed to raise the temperature of that body by 1 °C.","The specific latent heat of a substance is the energy absorbed or released to change the state of 1 kg of the substance without a change in temperature.","Pressure is the normal (perpendicular) force exerted on a surface per unit area."],"ans":3,"sol_zh":"正確定義／重點：壓強是作用於表面每單位面積的法向（垂直）力。","sol_en":"Correct definition / key idea: Pressure is the normal (perpendicular) force exerted on a surface per unit area."},{"kind":"unit","q_zh":"「壓強」的 SI 單位是？","q_en":"The SI unit of “pressure” is?","opts_zh":["kg","m s⁻²","C","Pa (N m⁻²)"],"opts_en":["kg","m s⁻²","C","Pa (N m⁻²)"],"ans":3,"sol_zh":"SI 單位：$\\mathrm{Pa}\\ (\\mathrm{N\\,m^{-2}})$（帕斯卡）","sol_en":"SI unit: $\\mathrm{Pa}\\ (\\mathrm{N\\,m^{-2}})$ (pascal)"},{"kind":"type","q_zh":"「壓強」是標量還是矢量？","q_en":"Is “pressure” a scalar or a vector?","opts_zh":["矢量","兩者皆可","不是物理量","標量"],"opts_en":["vector","either","not a physical quantity","scalar"],"ans":3,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「壓強」相關的公式是？","q_en":"Which equation is associated with “pressure”?","opts_zh":["$E = mc\\,\\Delta T$","$p = \\dfrac{F}{A}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$"],"opts_en":["$E = mc\\,\\Delta T$","$p = \\dfrac{F}{A}$","$c = 3.00 \\times 10^{8}\\,\\mathrm{m\\,s^{-1}}$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$"],"ans":1,"sol_zh":"公式：$p = \\dfrac{F}{A}$","sol_en":"Equation: $p = \\dfrac{F}{A}$"}],"weight":[{"kind":"def","q_zh":"下列哪一項最接近「重量」的定義／重點？","q_en":"Which best matches the definition / key idea of “weight”?","opts_zh":["加速度是速度的變化率。","宇宙間任何兩個粒子都會互相吸引，吸力的大小與該兩個粒子的質量的乘積成正比，並與粒子之間距離的平方成反比。","在接近地球表面的位置，所有自由落體都以相同的加速度下落，這個加速度稱為重力加速度，簡寫為 g。方向向下。","物體的重量是作用在其上的重力。在地球表面附近，重量等於質量乘以重力場強度。"],"opts_en":["Acceleration is the rate of change of velocity.","Every particle in the universe attracts every other particle with a force directly proportional to the product of their masses and inversely proportional to the square of the distance between them.","All objects have the same acceleration when they fall freely near the Earth’s surface. This acceleration is called acceleration due to gravity and is denoted by g. Its direction is downwards.","Weight of a body is the gravitational force acting on it. Near the Earth's surface, weight equals mass times gravitational field strength."],"ans":3,"sol_zh":"正確定義／重點：物體的重量是作用在其上的重力。在地球表面附近，重量等於質量乘以重力場強度。","sol_en":"Correct definition / key idea: Weight of a body is the gravitational force acting on it. Near the Earth's surface, weight equals mass times gravitational field strength."},{"kind":"unit","q_zh":"「重量」的 SI 單位是？","q_en":"The SI unit of “weight” is?","opts_zh":["m s⁻²","T","Hz","N"],"opts_en":["m s⁻²","T","Hz","N"],"ans":3,"sol_zh":"SI 單位：$\\mathrm{N}$","sol_en":"SI unit: $\\mathrm{N}$"},{"kind":"type","q_zh":"「重量」是標量還是矢量？","q_en":"Is “weight” a scalar or a vector?","opts_zh":["標量","矢量","兩者皆可","不是物理量"],"opts_en":["scalar","vector","either","not a physical quantity"],"ans":1,"sol_zh":"知識庫標示為：矢量。","sol_en":"Knowledge base marks it as: vector."},{"kind":"eq","q_zh":"與「重量」相關的公式是？","q_en":"Which equation is associated with “weight”?","opts_zh":["$R = 8.31\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}$","$W = mg$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$"],"opts_en":["$R = 8.31\\,\\mathrm{J\\,mol^{-1}\\,K^{-1}}$","$W = mg$","$e = 1.60 \\times 10^{-19}\\,\\mathrm{C}$","$g = 9.81\\,\\mathrm{m\\,s^{-2}}$"],"ans":1,"sol_zh":"公式：$W = mg$","sol_en":"Equation: $W = mg$"}],"work":[{"kind":"def","q_zh":"下列哪一項最接近「功」的定義／重點？","q_en":"Which best matches the definition / key idea of “work”?","opts_zh":["力矩等於力 F 與垂直距離 d⊥ 的乘積；d⊥ 是施力點與支點的距離。方向以順時針或逆時針表示。","在接近地球表面的位置，所有自由落體都以相同的加速度下落，這個加速度稱為重力加速度，簡寫為 g。方向向下。","恆力所做的機械功等於力、作用點位移，以及兩者夾角餘弦的乘積。","物體的動量等於其質量與速度的乘積。方向與速度相同。"],"opts_en":["The moment of a force is F times the perpendicular distance d⊥ from the pivot; d⊥ is the distance between the point of application of the force and the pivot. Its sense is given as clockwise or anticlockwise.","All objects have the same acceleration when they fall freely near the Earth’s surface. This acceleration is called acceleration due to gravity and is denoted by g. Its direction is downwards.","Mechanical work done by a constant force is the product of the force, the displacement of the point of application, and the cosine of the angle between them.","Momentum of a body is the product of its mass and velocity. It has the same direction as the velocity."],"ans":2,"sol_zh":"正確定義／重點：恆力所做的機械功等於力、作用點位移，以及兩者夾角餘弦的乘積。","sol_en":"Correct definition / key idea: Mechanical work done by a constant force is the product of the force, the displacement of the point of application, and the cosine of the angle between them."},{"kind":"unit","q_zh":"「功」的 SI 單位是？","q_en":"The SI unit of “work” is?","opts_zh":["Hz","C","J","N"],"opts_en":["Hz","C","J","N"],"ans":2,"sol_zh":"SI 單位：$\\mathrm{J}$","sol_en":"SI unit: $\\mathrm{J}$"},{"kind":"type","q_zh":"「功」是標量還是矢量？","q_en":"Is “work” a scalar or a vector?","opts_zh":["標量","不是物理量","兩者皆可","矢量"],"opts_en":["scalar","not a physical quantity","either","vector"],"ans":0,"sol_zh":"知識庫標示為：標量。","sol_en":"Knowledge base marks it as: scalar."},{"kind":"eq","q_zh":"與「功」相關的公式是？","q_en":"Which equation is associated with “work”?","opts_zh":["$W = Fs\\cos\\theta$","$G = 6.67 \\times 10^{-11}\\,\\mathrm{N\\,m^{2}\\,kg^{-2}}$","$u = 1.661 \\times 10^{-27}\\,\\mathrm{kg}$","$\\mu_0 = 4\\pi \\times 10^{-7}\\,\\mathrm{H\\,m^{-1}}$"],"opts_en":["$W = Fs\\cos\\theta$","$G = 6.67 \\ function norm(s){
  return String(s||"").toLowerCase().replace(/\s+/g,"").replace(/[·・．.]/g,"").trim();
}
function toast(msg){
  const el = document.getElementById("toastMsg");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

function mathHTML(raw){
  let s = String(raw == null ? "" : raw).trim();
  if (!s || s === "—" || s === "-") return "—";
  if (s.startsWith("$$") && s.endsWith("$$")) s = s.slice(2, -2).trim();
  else if (s.startsWith("$") && s.endsWith("$")) s = s.slice(1, -1).trim();
  if (window.katex && typeof window.katex.renderToString === "function") {
    try { return window.katex.renderToString(s, { throwOnError: false, displayMode: false }); } catch (e) {}
  }
  return '<span class="tex-fallback">' + simpleTex(s) + '</span>';
}

function typesetAll(root){
  window.typesetAll = typesetAll;
  const el = root || document.body;
  let usedKatex = false;
  if (window.renderMathInElement && window.katex) {
    try {
      renderMathInElement(el, {
        delimiters: [
          {left:"$$", right:"$$", display:true},
          {left:"$", right:"$", display:false},
          {left:"\\\\(", right:"\\\\)", display:false},
          {left:"\\\\[", right:"\\\\]", display:true}
        ],
        throwOnError: false,
        ignoredClasses: ["katex","katex-display","tex-fallback"]
      });
      usedKatex = true;
    } catch(e) {}
  }
  const still = (el.textContent || "").indexOf("$") >= 0;
  if (!usedKatex || still) fallbackTypeset(el);
}
window.typesetAll = typesetAll;

function fallbackTypeset(root){
  const walk = (node) => {
    if (!node) return;
    if (node.nodeType === 3) {
      let t = node.nodeValue;
      if (!t || t.indexOf("$") < 0) return;
      const parts = t.split(/(\$[^$]+\$)/g);
      if (parts.length === 1) return;
      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        if (p.startsWith("$") && p.endsWith("$") && p.length >= 2) {
          const span = document.createElement("span");
          span.className = "tex-fallback";
          span.innerHTML = simpleTex(p.slice(1,-1));
          frag.appendChild(span);
        } else if (p) {
          frag.appendChild(document.createTextNode(p));
        }
      });
      if (node.parentNode) node.parentNode.replaceChild(frag, node);
      return;
    }
    if (node.classList && (node.classList.contains("tex-fallback") || node.classList.contains("katex"))) return;
    if (node.childNodes) Array.from(node.childNodes).forEach(walk);
  };
  walk(root);
}

function simpleTex(s){

    .replace(/\\lambda/g, 'λ')
    .replace(/\\theta/g, 'θ')
    .replace(/\\Omega/g, 'Ω')
    .replace(/\\omega/g, 'ω')
    .replace(/\\rho/g, 'ρ')

    .replace(/\\beta/g, 'β')
    .replace(/\\gamma/g, 'γ')
    .replace(/\\mu_0/g, 'μ₀')
    .replace(/\\varepsilon_0/g, 'ε₀')
    .replace(/\\epsilon_0/g, 'ε₀')
    .replace(/\\mu/g, 'μ')
    .replace(/\\nu/g, 'ν')
    .replace(/\\sigma/g, 'σ')
    .replace(/\\tau/g, 'τ')
    .replace(/\\varepsilon/g, 'ε')
    .replace(/\\epsilon/g, 'ε')
    .replace(/\\infty/g, '∞')
    .replace(/\\circ/g, '°')
    .replace(/\\mathcal\{E\}/g, 'ℰ')
    .replace(/\\ln/g, 'ln')
    .replace(/\\log/g, 'log')
    .replace(/\\sin/g, 'sin')
    .replace(/\\cos/g, 'cos')
    .replace(/\\tan/g, 'tan')
    .replace(/\\ /g, ' ')
    .replace(/[{}]/g, '')
    .replace(/\\/g, '');
  
  t = t.split(/(<[^>]+>)/).map(function(part){
    if (part.charAt(0) === "<") return part;
    return part.replace(/(\d+(?:\.\d+)?|[+=\-−×·≈∝±/()\[\]|Ω°%])+/g, function(m){
      return '<span class="tex-up">' + m + '</span>';
    });
  }).join("");

  return t;
}

function dash(){ return lang==="zh" ? "—" : "—"; }
function natLabel(t, L){
  L = L || lang;
  if (!t) return dash();
  // Prefer explicit nature notes (e.g. current direction)
  if (L==="zh" && t.type_note_zh) return t.type_note_zh;
  if (L!=="zh" && t.type_note_en) return t.type_note_en;
  if (t.type === "constant") return L==="zh" ? "常數" : "constant";
  // 曾sir: 唔顯示標量／矢量
  return dash();
}

function byId(id){ return TERMS.find(t => t.id === id) || null; }
/** 曾sir：動能／KE → Book2 力學；含「氣體分子」／molecular → Book1 */
function preferKinetic(q, n){
  const raw = String(q || "");
  const low = raw.toLowerCase();
  if (/氣體分子|分子的動能|分子動能/.test(raw) || /molecular/.test(low)) {
    return byId("molecular-kinetic-energy");
  }
  // bare / primary mechanics kinetic queries
  if (n === "動能" || n === "kineticenergy" || n === "ke" || n === "kinetic-energy") {
    return byId("ke") || null;
  }
  if ((/動能/.test(raw) || /kinetics*energy/.test(low) || /(^|)ke(|$)/i.test(raw))
      && !/氣體分子|molecular/.test(low + raw)) {
    return byId("ke") || null;
  }
  return null;
}
function findExact(q){
  const n = norm(q);
  if (!n) return null;
  const pref = preferKinetic(q, n);
  if (pref) {
    // only short-circuit when query clearly targets KE family
    if (n === "動能" || n === "kineticenergy" || n === "ke" || n === "kinetic-energy"
        || /氣體分子|分子的動能|分子動能|molecular/.test(String(q))
        || norm(pref.zh) === n || norm(pref.en) === n) {
      return pref;
    }
  }
  for (const t of TERMS) {
    if (norm(t.zh) === n || norm(t.en) === n || norm(t.id) === n) return t;
    if (t.symbol && norm(t.symbol) === n) {
      // bare KE / PE: prefer mechanics KE / GPE
      if (n === "ke") return byId("ke") || t;
      if (n === "pe" || n === "gpe") return byId("gpe") || t;
      if (n === "epe") return byId("elastic-potential-energy") || t;
      return t;
    }
    for (const a of (t.aliases||[])) if (norm(a) === n) return t;
  }
  return null;
}
function findFuzzy(q){
  const n = norm(q);
  if (!n || n.length < 1) return null;
  const pref = preferKinetic(q, n);
  if (pref && (/動能|kinetic|氣體分子|molecular|ke/i.test(String(q)))) {
    return pref;
  }
  let best = null, score = 0;
  for (const t of TERMS) {
    const keys = [t.zh, t.en, t.id, ...(t.aliases||[])].map(norm).filter(Boolean);
    for (const k of keys) {
      let s = 0;
      if (k === n) s = 100;
      else if (k.startsWith(n) || n.startsWith(k)) s = 80;
      else if (k.includes(n) || n.includes(k)) s = 60;
      // boost Book2 mechanics KE over molecular when scores tie-ish
      if (t.id === "ke" && (n.includes("動能") || n.includes("kinetic"))) s += 5;
      if (t.id === "molecular-kinetic-energy" && !( /氣體分子|molecular/.test(String(q)) )) s -= 10;
      if (s > score) { score = s; best = t; }
    }
  }
  return score >= 60 ? best : null;
}

function formatEq(tex){
  if (!tex) return dash();
  const s = String(tex).trim();
  if (s.indexOf("begin{gathered}") >= 0 || s.indexOf("begin{aligned}") >= 0 || s.indexOf("begin{align}") >= 0) {
    return "$$" + s + "$$";
  }
  return "$" + s + "$";
}

function renderTerm(t){
  current = t;
  document.getElementById("resultArea").classList.remove("hidden");
  document.getElementById("emptyHint").classList.add("hidden");
  document.getElementById("p1-name").textContent = t.en || t.zh;
  document.getElementById("p2-name").textContent = t.zh || t.en;
  document.getElementById("p1-def").textContent = t.definition_en || (lang==="en" ? "(Definition from source not available in English)" : "（來源暫無英文定義）");
  document.getElementById("p2-def").textContent = t.definition_zh || (lang==="zh" ? "（來源暫無中文定義）" : "(Definition from source not available in Chinese)");

  const symRaw = t.symbol ? String(t.symbol).replace(/\bKE\b/g,"\mathrm{KE}").replace(/\bPE\b/g,"\mathrm{PE}").replace(/\bGPE\b/g,"\mathrm{GPE}").replace(/\bEPE\b/g,"\mathrm{EPE}") : "";
  document.getElementById("p1-sym").innerHTML = symRaw ? mathHTML(symRaw) : dash();
  document.getElementById("p2-sym").innerHTML = symRaw ? mathHTML(symRaw) : dash();
  const eq = formatEq(t.equation_tex);
  document.getElementById("p1-eq").innerHTML = (eq && eq !== "—") ? mathHTML(eq) : dash();
  document.getElementById("p2-eq").innerHTML = (eq && eq !== "—") ? mathHTML(eq) : dash();
  // 曾sir: 英文邊唔出中文；單位可分中英
  function unitText(side){
    // 曾sir：永遠唔顯示「無因次／dimensionless／無量綱」→ 中「無」／英「none」
    function sanitizeUnit(raw, en){
      if (raw == null) return "";
      let u = String(raw);
      if (/無因次|無量綱|dimensionless/i.test(u)) return en ? "none" : "無";
      return u;
    }
    if (side === "en") {
      const u = sanitizeUnit(t.si_unit_en || t.si_unit || "", true);
      if (/[一-鿿]/.test(u) && !t.si_unit_en) return dash();
      if (t.si_unit_tex_en && !/無因次|無量綱|dimensionless/i.test(t.si_unit_tex_en)) return "$" + t.si_unit_tex_en + "$";
      if (t.si_unit_en) return sanitizeUnit(t.si_unit_en, true);
      if (t.si_unit_tex && !/[一-鿿]/.test(t.si_unit || "") && !/無因次|無量綱|dimensionless/i.test(t.si_unit_tex)) return "$" + t.si_unit_tex + "$";
      return u || dash();
    }
    const u = sanitizeUnit(t.si_unit_zh || t.si_unit || "", false);
    if (t.si_unit_tex_zh && !/無因次|無量綱|dimensionless/i.test(t.si_unit_tex_zh)) return "$" + t.si_unit_tex_zh + "$";
    if (t.si_unit_zh) return sanitizeUnit(t.si_unit_zh, false);
    if (t.si_unit_tex && !/[一-鿿]/.test(t.si_unit || "") && !/無因次|無量綱|dimensionless/i.test(t.si_unit_tex)) return "$" + t.si_unit_tex + "$";
    return u || dash();
  }
  document.getElementById("p1-unit").innerHTML = mathHTML(unitText("en"));
  document.getElementById("p2-unit").innerHTML = mathHTML(unitText("zh"));
  document.getElementById("p1-nat").textContent = natLabel(t, "en");
  document.getElementById("p2-nat").textContent = natLabel(t, "zh");
  // Hide nature row when empty dash
  ["p1","p2"].forEach(side => {
    const v = document.getElementById(side+"-nat");
    const k = document.getElementById(side+"k-nat");
    const empty = !v || !v.textContent || v.textContent === "—";
    if (k) k.style.display = empty ? "none" : "";
    if (v) v.style.display = empty ? "none" : "";
  });
  // 曾sir: Part1 淨英文課題；Part2 淨中文課題
  document.getElementById("p1-topic").textContent = (t.topic_en || "") + (t.book ? " · " + t.book + " Ch" + t.chapter : "");
  document.getElementById("p2-topic").textContent = (t.topic_zh || "") + (t.book ? " · " + t.book + " 第" + t.chapter + "章" : "");

  document.getElementById("btnImages").classList.toggle("hidden", !t.hasImages);
  typesetAll(document.getElementById("resultArea"));
}

function onSearch(){
  const q = document.getElementById("q").value.trim();
  const box = document.getElementById("suggestBox");
  if (!q) {
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("emptyHint").classList.remove("hidden");
    box.classList.remove("show");
    return;
  }
  let t = findExact(q);
  if (t) {
    box.classList.remove("show");
    renderTerm(t);
    return;
  }
  const fuzzy = findFuzzy(q);
  if (fuzzy) {
    box.classList.add("show");
    const chip = document.getElementById("suggestChip");
    chip.textContent = (lang==="zh" ? "你是否要找：" : "Did you mean: ") + fuzzy.zh + " / " + fuzzy.en;
    chip.onclick = () => { document.getElementById("q").value = fuzzy.zh; box.classList.remove("show"); renderTerm(fuzzy); };
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("emptyHint").classList.remove("hidden");
    document.getElementById("emptyHint").textContent = lang==="zh"
      ? "未有完全相同的詞條；可點下方建議，或再輸入。"
      : "No exact match; tap the suggestion below, or try another query.";
  } else {
    box.classList.remove("show");
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("emptyHint").classList.remove("hidden");
    document.getElementById("emptyHint").textContent = lang==="zh"
      ? "找不到此詞條（草稿只含齊定義＋公式＋單位嘅物理量）。"
      : "Term not found (draft includes complete formulae quantities only).";
  }
}

function showPage(id){
  document.getElementById("page-main").classList.toggle("hidden", id !== "main");
  document.getElementById("page-mcq").classList.toggle("hidden", id !== "mcq");
  document.getElementById("encourageModal").classList.remove("show");
}

function pickRandom(arr){
  if (!arr || !arr.length) return null;
  return arr[Math.floor(Math.random() * arr.length)];
}

/** 學習卡：隨機一詞，唔使輸入 */
function drawStudyCard(){
  if (!TERMS || !TERMS.length) {
    toast(lang==="zh" ? "暫無詞彙" : "No terms available");
    return;
  }
  showPage("main");
  let pool = TERMS;
  if (current && TERMS.length > 1) {
    pool = TERMS.filter(t => t.id !== current.id);
    if (!pool.length) pool = TERMS;
  }
  const t = pickRandom(pool);
  document.getElementById("q").value = "";
  document.getElementById("suggestBox").classList.remove("show");
  renderTerm(t);
  toast(lang==="zh" ? ("學習卡：" + t.zh) : ("Study card: " + t.en));
}

function pickConceptQ(term){
  const pool = (CONCEPT_BY_ID[term.id] || []).slice();
  if (!pool.length) {
    // minimal fallback from definition text presence
    return {
      q_zh: "本概念暫只有文字定義，請返回搜尋其他有單位／公式的概念練習。",
      q_en: "This concept has text definition only; search another concept with unit/equation for more practice.",
      opts_zh: ["明白", "返回", "換概念", "繼續"],
      opts_en: ["OK", "Back", "Change", "Continue"],
      ans: 0,
      sol_zh: "知識庫定義：" + (term.definition_zh || term.definition_en || "—"),
      sol_en: "KB definition: " + (term.definition_en || term.definition_zh || "—"),
      _placeholder: true
    };
  }
  return JSON.parse(JSON.stringify(pickRandom(pool)));
}

function pickCalcQ(term){
  let pool = (CALC.calcByTermId[term.id] || []).slice();
  if (!pool.length) {
    pool = (CALC.calcByTopic[term.topic_zh] || []).slice();
  }
  if (!pool.length) {
    // any calc
    const all = Object.values(CALC.calcByTermId).flat();
    pool = all;
  }
  if (!pool.length) return null;
  return JSON.parse(JSON.stringify(pickRandom(pool)));
}

function renderOpt(letter, text, name, idx){
  const id = name + "_" + idx;
  return '<label class="opt" data-idx="'+idx+'">'
    + '<input type="radio" name="'+name+'" value="'+idx+'" id="'+id+'" />'
    + '<span class="letter">'+letter+'.</span>'
    + '<span class="opt-text">'+text+'</span>'
    + '</label>';
}

function renderQuestion(el, q, label, name){
  if (!q) {
    el.innerHTML = '<div class="no-calc-hint">'+(lang==="zh"
      ? "本概念暫未有計數題；已嘗試同課題有公式詞條。可按「換 2 題」或搜尋動能／力／電功率等。"
      : "No calculation item for this concept yet; tried same-topic formulae. Tap “2 new Qs” or search KE / force / power.")+'</div>';
    return;
  }
  const letters = ["A","B","C","D"];
  const opts = (lang==="zh" ? q.opts_zh : q.opts_en) || q.opts_zh || [];
  const stem = lang==="zh" ? q.q_zh : q.q_en;
  function withMath(str){
    return String(str||"").replace(/$([^$]+)$/g, function(_, tex){ return mathHTML(tex); });
  }
  let html = '<div class="q-title"><span class="q-label">'+label+'</span></div>';
  html += '<div class="q-stem" style="margin-bottom:10px;font-weight:700;line-height:1.55">'+withMath(stem)+'</div>';
  html += '<div class="opts">';
  opts.forEach((o,i) => { html += renderOpt(letters[i], withMath(o), name, i); });
  html += '</div>';
  html += '<div class="solution" id="sol_'+name+'"><h4>'+(lang==="zh"?"完整解題":"Full solution")+'</h4><div class="sol-body"></div></div>';
  el.innerHTML = html;
  el.querySelectorAll(".opt").forEach(lab => {
    lab.addEventListener("click", () => {
      if (answered) return;
      el.querySelectorAll(".opt").forEach(x => x.classList.remove("selected"));
      lab.classList.add("selected");
      const inp = lab.querySelector("input");
      if (inp) inp.checked = true;
    });
  });
}

function loadMCQ(){
  if (!current) return;
  answered = false;
  document.getElementById("mcqFeedback").textContent = "";
  document.getElementById("mcqConcept").textContent =
    (lang==="zh" ? "練習概念：" : "Concept: ") + current.zh + " / " + current.en;
  currentQ1 = pickConceptQ(current);
  currentQ2 = pickCalcQ(current);
  // avoid identical if possible
  renderQuestion(document.getElementById("q1"), currentQ1, "Q1", "q1");
  renderQuestion(document.getElementById("q2"), currentQ2, "Q2", "q2");
  typesetAll(document.getElementById("page-mcq"));
}

function selectedIndex(name){
  const inp = document.querySelector('input[name="'+name+'"]:checked');
  return inp ? Number(inp.value) : -1;
}

function checkAnswers(){
  if (!currentQ1) return;
  const a1 = selectedIndex("q1");
  const a2 = currentQ2 ? selectedIndex("q2") : -1;
  if (a1 < 0 || (currentQ2 && a2 < 0)) {
    toast(lang==="zh" ? "請先選齊兩題答案" : "Please answer both questions");
    return;
  }
  answered = true;
  const ok1 = a1 === currentQ1.ans;
  const ok2 = currentQ2 ? (a2 === currentQ2.ans) : true;

  function mark(blockId, q, chosen){
    const block = document.getElementById(blockId);
    block.querySelectorAll(".opt").forEach((lab,i) => {
      lab.classList.remove("selected","correct","wrong");
      if (i === q.ans) lab.classList.add("correct");
      if (i === chosen && chosen !== q.ans) lab.classList.add("wrong");
      const inp = lab.querySelector("input");
      if (inp) inp.disabled = true;
    });
    const sol = document.getElementById("sol_"+blockId.replace("q","q").replace("1","q1").replace("2","q2"));
  }
  // mark q1
  document.querySelectorAll("#q1 .opt").forEach((lab) => {
    const i = Number(lab.getAttribute("data-idx"));
    lab.classList.remove("selected","correct","wrong");
    if (i === currentQ1.ans) lab.classList.add("correct");
    if (i === a1 && a1 !== currentQ1.ans) lab.classList.add("wrong");
    const inp = lab.querySelector("input"); if (inp) inp.disabled = true;
  });
  if (currentQ2) {
    document.querySelectorAll("#q2 .opt").forEach((lab) => {
      const i = Number(lab.getAttribute("data-idx"));
      lab.classList.remove("selected","correct","wrong");
      if (i === currentQ2.ans) lab.classList.add("correct");
      if (i === a2 && a2 !== currentQ2.ans) lab.classList.add("wrong");
      const inp = lab.querySelector("input"); if (inp) inp.disabled = true;
    });
  }

  // solutions for wrong
  const sol1 = document.querySelector("#sol_q1");
  const sol2 = document.querySelector("#sol_q2");
  if (!ok1 && sol1) {
    sol1.classList.add("show");
    sol1.querySelector(".sol-body").innerHTML = (lang==="zh"?currentQ1.sol_zh:currentQ1.sol_en).replace(/\n/g,"<br/>");
  } else if (sol1) {
    sol1.classList.remove("show");
  }
  if (currentQ2 && !ok2 && sol2) {
    sol2.classList.add("show");
    sol2.querySelector(".sol-body").innerHTML = (lang==="zh"?currentQ2.sol_zh:currentQ2.sol_en).replace(/\n/g,"<br/>");
  } else if (sol2) {
    sol2.classList.remove("show");
  }

  typesetAll(document.getElementById("page-mcq"));

  const both = ok1 && ok2;
  const fb = document.getElementById("mcqFeedback");
  if (both) {
    fb.textContent = lang==="zh" ? "兩題皆對！太棒了！" : "Both correct — awesome!";
    document.getElementById("encourageTitle").textContent = lang==="zh" ? "答對喇！" : "Well done!";
    document.getElementById("encourageText").textContent = lang==="zh" ? "做得好！繼續加油～" : "Great job! Keep it up!";
    document.getElementById("encourageModal").classList.add("show");
  } else if (ok1 || ok2) {
    fb.textContent = lang==="zh"
      ? "對了一題。請睇吓解題，再換 2 題繼續練習！"
      : "1 correct. Check the solution, then try 2 new questions!";
  } else {
    fb.textContent = lang==="zh"
      ? "今次未中。睇吓完整解題（含單位轉換），再換題練習！"
      : "Not this time. Review the full solutions (incl. unit conversion), then try again!";
  }
}

  document.getElementById("btnRefresh").textContent = zh ? "換 2 題" : "2 new Qs";
  document.getElementById("btnRefresh2").textContent = zh ? "換 2 題" : "2 new Qs";
  document.getElementById("btnCheck").textContent = zh ? "核對答案" : "Check answers";
  document.getElementById("langBtn").textContent = zh ? "中 / EN" : "EN / 中";
  document.getElementById("p1k-def").textContent = "Definition";
  document.getElementById("p2k-def").textContent = zh ? "定義" : "Definition";
  document.getElementById("p1k-sym").textContent = "Symbol";
  document.getElementById("p2k-sym").textContent = zh ? "符號" : "Symbol";
  document.getElementById("p1k-eq").textContent = "Equation";
  document.getElementById("p2k-eq").textContent = zh ? "公式" : "Equation";
  document.getElementById("p1k-unit").textContent = "SI unit";
  document.getElementById("p2k-unit").textContent = zh ? "單位" : "SI unit";
  const p1kn=document.getElementById("p1k-nat"); if(p1kn) p1kn.textContent = "Nature";
  const p2kn=document.getElementById("p2k-nat"); if(p2kn) p2kn.textContent = zh ? "性質" : "Nature";
  
  
  document.getElementById("encourageClose").textContent = zh ? "繼續" : "Continue";
  if (current && !document.getElementById("page-main").classList.contains("hidden")) renderTerm(current);
  if (!document.getElementById("page-mcq").classList.contains("hidden")) loadMCQ();
}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>物理概念詞彙練習 · 曾sir</title>
<!-- Offline-first single file. KaTeX loaded from CDN when online for stacked fractions & superscripts. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(function(){
  function loadFallback(src, isCss){
    if (isCss) {
      if (document.querySelector('link[data-katex-fb]')) return;
      var l=document.createElement('link'); l.rel='stylesheet'; l.href=src; l.setAttribute('data-katex-fb','1'); document.head.appendChild(l);
    } else {
      var s=document.createElement('script'); s.src=src; s.defer=true; document.head.appendChild(s);
    }
  }
  setTimeout(function(){
    if (window.katex && window.renderMathInElement) return;
    loadFallback('https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css', true);
    loadFallback('https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js', false);
    loadFallback('https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js', false);
  }, 1200);
})();
</script>
<style>
:root{
  --header:#0d7377; --accent:#0d9488; --accent2:#0f766e;
  --bg:#f0faf6; --card:#ffffff; --soft:#e8f5f1;
  --text:#134e4a; --muted:#5f7a76; --danger:#b91c1c; --ok:#047857;
  --shadow:0 8px 24px rgba(13,115,119,.12);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100%}
button{font:inherit;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
  border:none;border-radius:12px;padding:12px 18px;font-weight:700;letter-spacing:.02em;
  background:var(--accent);color:#fff;box-shadow:0 2px 0 var(--accent2);
  transition:transform .08s,filter .15s;min-height:44px;line-height:1.25;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(1px)}
.btn-ghost{background:#fff;color:var(--accent2);border:2px solid var(--accent);box-shadow:none}
.btn-soft{background:var(--soft);color:var(--accent2);box-shadow:none;border:1px solid #c5e8df}
.btn-danger{background:#dc2626;box-shadow:0 2px 0 #991b1b}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
header.app-header{
  background:linear-gradient(135deg,var(--header),var(--accent2));
  color:#fff;padding:18px 20px 16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:20;
}
header .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.25rem;font-weight:800}
header .sub{opacity:.9;font-size:.9rem;margin-top:4px}
.lang-toggle{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;
  border-radius:999px;padding:8px 14px;font-weight:700;min-width:88px;text-align:center;
}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.card{
  background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);
  border:1px solid #d7efe8;margin-bottom:16px;
}
.search-label{
  display:block;font-size:1.12rem;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.4;
}
#q{
  width:100%;min-height:70px;height:70px;padding:16px 18px;border-radius:14px;
  border:2px solid #b7ddd4;background:#fff;font-size:1.15rem;color:var(--text);
  outline:none;resize:none;line-height:1.4;
}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(13,148,136,.15)}
.suggest{margin-top:10px;display:none}
.suggest.show{display:block}
.chip{
  display:inline-flex;align-items:center;justify-content:center;text-align:center;
  background:var(--soft);border:1px solid #bfe5da;color:var(--accent2);
  border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.98rem;
}
.chip:hover{background:#d7f3eb}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:720px){.parts{grid-template-columns:1fr}}
.part-card h3{margin:0 0 10px;font-size:1.05rem;color:var(--accent2)}
.part-card .name{font-size:1.35rem;font-weight:800;margin:0 0 8px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:.98rem;margin:10px 0}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:600}
.topic-tag{
  margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--soft);
  color:var(--accent2);font-weight:700;font-size:.95rem;text-align:center;
}
.math{font-size:1.15rem;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.q-block{border:1px solid #d7efe8;border-radius:14px;padding:16px;margin-bottom:14px;background:#fbfffe}
.q-title{font-weight:800;margin:0 0 10px;font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;
  border:2px solid #d5ebe4;background:#fff;cursor:pointer;text-align:left;
}
.opt:hover{border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:var(--soft)}
.opt.correct{border-color:var(--ok);background:#ecfdf5}
.opt.wrong{border-color:var(--danger);background:#fef2f2}
.opt input{margin-top:3px}
.solution{
  display:none;margin-top:12px;padding:14px;border-radius:12px;background:#fff7ed;
  border:1px solid #fed7aa;color:#9a3412;
}
.solution.show{display:block}
.solution h4{margin:0 0 8px}
.modal-bg{
  position:fixed;inset:0;background:rgba(15,60,55,.45);display:none;align-items:center;justify-content:center;
  z-index:50;padding:16px;
}
.modal-bg.show{display:flex}
.modal{
  background:#fff;border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center;
  box-shadow:var(--shadow);
}
.modal img{width:180px;height:180px;object-fit:cover;border-radius:18px;margin:8px auto 12px;display:block;border:4px solid var(--soft)}
.modal h3{margin:0 0 6px;color:var(--accent2)}
.images-grid{display:grid;grid-template-columns:1fr;gap:16px}
.img-card{background:#fff;border:1px solid #d7efe8;border-radius:14px;padding:14px}
.img-card h4{margin:0 0 8px;text-align:center;color:var(--accent2)}
.img-card svg{width:100%;height:auto;display:block;background:#f8fffc;border-radius:10px}
.hidden{display:none !important}
.footer-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px}
.hard-on{outline:3px solid #f59e0b;outline-offset:2px}

.def-wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.def-more-btn{
  background:none;border:none;padding:0;margin:0;color:var(--accent);
  font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;box-shadow:none;min-height:auto;
}
.def-more-btn:hover{color:var(--accent2);filter:none}
.def-supp{
  display:none;margin:0;padding:10px 12px;border-radius:10px;
  background:var(--soft);border:1px solid #c5e8df;color:var(--text);
  font-weight:600;font-size:.98rem;line-height:1.55;width:100%;
}
.def-supp.show{display:block}

.frac{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  vertical-align:middle;line-height:1.15;margin:0 .18em;font-weight:600;
}
.frac-num{padding:0 .22em 2px;border-bottom:1.6px solid currentColor;text-align:center}
.frac-den{padding:2px .22em 0;text-align:center}
.vec{position:relative;display:inline-block;padding-top:.35em;font-style:italic}
.vec::before{
  content:"→";position:absolute;top:-0.15em;left:50%;transform:translateX(-50%);
  font-size:.72em;line-height:1;font-style:normal;font-weight:700;
}
.mathrm{font-style:normal}
.thinsp{display:inline-block;width:.2em}
.tex-fallback{font-family:"Times New Roman",Times,"Noto Serif TC",serif;font-size:1.05em}
.toast-msg{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:80;
  max-width:min(92vw,420px);padding:12px 18px;border-radius:12px;background:#0f172a;color:#fff;
  font-weight:700;font-size:.95rem;box-shadow:0 10px 30px rgba(15,23,42,.28);opacity:0;
  pointer-events:none;transition:opacity .25s ease, transform .25s ease}
.toast-msg.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.glossary-card .name{font-size:1.35rem;font-weight:800;margin:0 0 8px;color:var(--accent2)}
.glossary-card .zh-line{font-size:1.15rem;font-weight:700;margin:0 0 12px;line-height:1.5}
.glossary-card .note{margin-top:8px;padding:12px 14px;border-radius:10px;background:var(--soft);
  color:var(--muted);font-weight:600;font-size:.98rem;line-height:1.55}
.glossary-card .star{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;
  background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:.8rem;font-weight:700}
</style>
</head>
<body>
<header class="app-header">
  <div class="top">
    <div>
      <h1 id="title">物理概念詞彙練習</h1>
      <div class="sub" id="subtitle">HKDSE Physics · 曾sir</div>
    </div>
    <button type="button" class="lang-toggle" id="langBtn" aria-label="Language">中 / EN</button>
  </div>
</header>
<div class="toast-msg" id="toastMsg" role="status" aria-live="polite"></div>

<main>
  <!-- MAIN PAGE -->
  <section id="page-main">
    <div class="card">
      <label class="search-label" id="searchLabel" for="q">輸入物理概念／詞彙（中或英）</label>
      <textarea id="q" rows="2" placeholder="例如：動量、電流、electric field…"></textarea>
      <div class="suggest" id="suggestBox">
        <button type="button" class="chip" id="suggestChip"></button>
      </div>
    </div>

    <div id="resultArea" class="hidden">
      <div class="parts">
        <div class="card part-card" id="part1">
          <h3>Part 1 · English</h3>
          <div class="name" id="p1-name"></div>
          <div class="kv">
            <div class="k" id="p1k-def">Definition</div><div class="v">
              <div class="def-wrap">
                <div id="p1-def"></div>
                <div class="def-supp" id="p1-supp" hidden></div>
                <button type="button" class="def-more-btn hidden" id="p1-moreBtn" aria-expanded="false">More</button>
              </div>
            </div>
            <div class="k" id="p1k-eq">Equation</div><div class="v math" id="p1-eq"></div>
            <div class="k" id="p1k-unit">SI unit</div><div class="v math" id="p1-unit"></div>
            <div class="k" id="p1k-nat">Nature</div><div class="v" id="p1-nat"></div>
          </div>
          <div class="topic-tag" id="p1-topic"></div>
        </div>
        <div class="card part-card" id="part2">
          <h3>Part 2 · 中文</h3>
          <div class="name" id="p2-name"></div>
          <div class="kv">
            <div class="k" id="p2k-def">定義</div><div class="v">
              <div class="def-wrap">
                <div id="p2-def"></div>
                <div class="def-supp" id="p2-supp" hidden></div>
                <button type="button" class="def-more-btn hidden" id="p2-moreBtn" aria-expanded="false">更多</button>
              </div>
            </div>
            <div class="k" id="p2k-eq">公式</div><div class="v math" id="p2-eq"></div>
            <div class="k" id="p2k-unit">單位</div><div class="v math" id="p2-unit"></div>
            <div class="k" id="p2k-nat">性質</div><div class="v" id="p2-nat"></div>
          </div>
          <div class="topic-tag" id="p2-topic"></div>
        </div>
      </div>
      <div class="card">
        <div class="btn-row">
          <button type="button" class="btn" id="btnMCQ">開始選擇題練習</button>
          <button type="button" class="btn btn-ghost hidden" id="btnImages">圖片</button>
        </div>
      </div>
    </div>


    <div id="glossaryArea" class="hidden">
      <div class="card glossary-card">
        <div class="name" id="gloss-en"></div>
        <div class="zh-line" id="gloss-zh"></div>
        <div class="note" id="gloss-note"></div>
        <div class="topic-tag" id="gloss-tag"></div>
      </div>
    </div>

    <div class="card empty" id="emptyHint">輸入概念名稱後會顯示解釋；若只有辭彙譯名則顯示辭彙卡。</div>
  </section>

  <!-- MCQ PAGE -->
  <section id="page-mcq" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button type="button" class="btn btn-ghost" id="btnBackExplain">← 返回解釋</button>
        <div class="spacer"></div>
        <button type="button" class="btn btn-soft" id="btnRefresh">換兩題新題</button>
        <button type="button" class="btn btn-soft" id="btnHard">高難度（HKDSE）</button>
      </div>
      <div id="mcqConcept" style="text-align:center;font-weight:800;color:var(--accent2);margin-bottom:10px"></div>
      <div id="q1" class="q-block"></div>
      <div id="q2" class="q-block"></div>
      <div class="btn-row" style="margin-top:8px">
        <button type="button" class="btn" id="btnCheck">核對答案</button>
        <button type="button" class="btn btn-soft" id="btnRefresh2">換兩題新題</button>
      </div>
      <div id="mcqFeedback" class="footer-note" style="margin-top:12px"></div>
    </div>
  </section>

  <!-- IMAGES PAGE -->
  <section id="page-images" class="hidden">
    <div class="card">
      <div class="toolbar">
        <button type="button" class="btn btn-ghost" id="btnBackFromImg">← 返回解釋</button>
      </div>
      <h2 id="imgTitle" style="text-align:center;margin:4px 0 14px;color:var(--accent2)">電場示意圖</h2>
      <div class="images-grid" id="imgGrid"></div>
      <p class="footer-note" id="imgNote">電場線：由正電荷指出、進入負電荷；平行板由正板指向負板（fact-checked）。</p>
    </div>
  </section>
</main>

<div class="modal-bg" id="encourageModal" role="dialog" aria-modal="true">
  <div class="modal">

function lev(a, b) {
  a = String(a); b = String(b);
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
}
function norm(s){ return String(s).trim().toLowerCase().replace(/\s+/g,' '); }

function expandGlossary() {
  // EDB_GLOSSARY items: [en, zh_list, starred?, abbr?]
  if (expandGlossary._done) return expandGlossary._list;
  const list = [];
  for (const row of EDB_GLOSSARY) {
    const en = row[0];
    const zh_list = row[1] || [];
    const starred = row[2] === 1;
    const abbr = Array.isArray(row[3]) ? row[3] : (Array.isArray(row[2]) ? row[2] : []);
    const names = [en, ...zh_list, ...abbr].filter(Boolean);
    list.push({ en, zh_list, starred, abbr, names });
  }
  expandGlossary._list = list;
  expandGlossary._done = true;
  return list;
}

function scoreNameMatch(q, n) {
  if (!n || n.length < 2) return -1;
  if (q === n) return 10000;
  if (q.length >= 2 && n.includes(q)) {
    const ratio = q.length / n.length;
    if (ratio >= 0.75) return ratio * 1000 + (100 - Math.min(n.length, 100));
  }
  const isCjk = /[\u4e00-\u9fff]/.test(n);
  const minN = isCjk ? 2 : 3;
  if (n.length >= minN && q.includes(n)) {
    const ratio = n.length / q.length;
    if (ratio >= 0.75) return ratio * 1000 + (100 - Math.min(n.length, 100));
  }
  return -1;
}

function findConcept(raw) {
  const q = norm(raw);
  if (!q) return { hit: null, suggestion: null };

  // 1) Exact only → hit（contains 唔再當 hit，避免搶 glossary exact）
  for (const c of CONCEPTS) {
    const names = [c.en, c.zh, c.symbol, ...(c.aliases||[])].map(norm);
    if (names.includes(q)) return { hit: c, suggestion: null };
  }

  // 2) Contains → suggestion only
  let bestHit = null, bestScore = -1;
  for (const c of CONCEPTS) {
    const names = [c.en, c.zh, c.symbol, ...(c.aliases||[])].map(norm);
    for (const n of names) {
      const sc = scoreNameMatch(q, n);
      if (sc > bestScore) { bestScore = sc; bestHit = c; }
    }
  }
  if (bestHit) return { hit: null, suggestion: bestHit };

  // 3) Fuzzy → suggestion
  let best = null, bestDist = Infinity;
  for (const c of CONCEPTS) {
    const names = [c.en, c.zh, ...(c.aliases||[])].map(norm);
    for (const n of names) {
      if (!n || n.length < 2) continue;
      const d = lev(q, n);
      const thr = Math.max(1, Math.floor(Math.max(q.length, n.length) * 0.34));
      if (d <= thr && d < bestDist) { bestDist = d; best = c; }
    }
  }
  if (best) return { hit: null, suggestion: best };
  return { hit: null, suggestion: null };
}

function findGlossary(raw) {
  const q = norm(raw);
  if (!q) return { hit: null, suggestion: null };
  const list = expandGlossary();

  // Exact
  for (const g of list) {
    const names = g.names.map(norm);
    if (names.includes(q)) return { hit: g, suggestion: null };
  }

  // Contains scoring
  let bestHit = null, bestScore = -1;
  for (const g of list) {
    for (const n of g.names.map(norm)) {
      const sc = scoreNameMatch(q, n);
      if (sc > bestScore) { bestScore = sc; bestHit = g; }
    }
  }
  if (bestHit) return { hit: bestHit, suggestion: null };

  // Fuzzy
  let best = null, bestDist = Infinity;
  for (const g of list) {
    for (const n of g.names.map(norm)) {
      if (!n || n.length < 2) continue;
      const d = lev(q, n);
      const thr = Math.max(1, Math.floor(Math.max(q.length, n.length) * 0.34));
      if (d <= thr && d < bestDist) { bestDist = d; best = g; }
    }
  }
  if (best && bestDist > 0) return { hit: null, suggestion: best };
  if (best) return { hit: best, suggestion: null };
  return { hit: null, suggestion: null };
}

function takeBrace(str, i) {
  if (str[i] !== '{') return [null, i];
  let depth = 0, start = i + 1;
  for (let j = i; j < str.length; j++) {
    if (str[j] === '{') depth++;
    else if (str[j] === '}') {
      depth--;
      if (depth === 0) return [str.slice(start, j), j + 1];
    }
  }
  return [null, i];
}
function latexToHtml(tex) {
  function convert(str) {
    let out = "", i = 0;
    str = String(str == null ? "" : str);
    while (i < str.length) {
      if (str.startsWith("\\dfrac", i) || str.startsWith("\\frac", i)) {
        const cmdLen = str.startsWith("\\dfrac", i) ? 6 : 5;
        i += cmdLen;
        const numPair = takeBrace(str, i);
        if (numPair[0] == null) { out += str.slice(i - cmdLen, i); continue; }
        i = numPair[1];
        const denPair = takeBrace(str, i);
        if (denPair[0] == null) { out += "\\frac{" + numPair[0] + "}"; continue; }
        i = denPair[1];
        out += '<span class="frac"><span class="frac-num">' + convert(numPair[0]) + '</span><span class="frac-den">' + convert(denPair[0]) + '</span></span>';
        continue;
      }
      if (str.startsWith("\\mathrm", i)) {
        i += 7;
        const p = takeBrace(str, i);
        if (p[0] == null) { out += "\\mathrm"; continue; }
        i = p[1];
        out += '<span class="mathrm">' + convert(p[0]) + '</span>';
        continue;
      }
      if (str.startsWith("\\vec", i)) {
        i += 4;
        const p = takeBrace(str, i);
        if (p[0] == null) { out += "\\vec"; continue; }
        i = p[1];
        out += '<span class="vec">' + convert(p[0]) + '</span>';
        continue;
      }
      if (str.startsWith("\\left", i)) { i += 5; continue; }
      if (str.startsWith("\\right", i)) { i += 6; continue; }
      if (str.startsWith("\\,", i)) { out += '<span class="thinsp"></span>'; i += 2; continue; }
      if (str.startsWith("\\times", i)) { out += "×"; i += 6; continue; }
      if (str.startsWith("\\Delta", i)) { out += "Δ"; i += 6; continue; }
      if (str.startsWith("\\delta", i)) { out += "δ"; i += 6; continue; }
      if (str.startsWith("\\lambda", i)) { out += "λ"; i += 7; continue; }
      if (str.startsWith("\\Omega", i)) { out += "Ω"; i += 6; continue; }
      if (str.startsWith("\\ln", i)) { out += "ln"; i += 3; continue; }
      if (str.startsWith("\\;", i) || str.startsWith("\\:", i) || str.startsWith("\\ ", i)) { out += " "; i += 2; continue; }
      if (str[i] === '^') {
        i++;
        if (str[i] === '{') {
          const p = takeBrace(str, i); i = p[1];
          out += '<sup>' + convert(p[0]) + '</sup>';
        } else { out += '<sup>' + escapeHtml(str[i] || '') + '</sup>'; i++; }
        continue;
      }
      if (str[i] === '_') {
        i++;
        if (str[i] === '{') {
          const p = takeBrace(str, i); i = p[1];
          out += '<sub>' + convert(p[0]) + '</sub>';
        } else { out += '<sub>' + escapeHtml(str[i] || '') + '</sub>'; i++; }
        continue;
      }
      if (str[i] === '\\') {
        const m = str.slice(i).match(/^\\([a-zA-Z]+)/);
        if (m) { out += m[1]; i += m[0].length; continue; }
        i++; continue;
      }
      if (str[i] === '<') { out += '&lt;'; i++; continue; }
      if (str[i] === '>') { out += '&gt;'; i++; continue; }
      if (str[i] === '&') { out += '&amp;'; i++; continue; }
      out += str[i];
      i++;
    }
    return out;
  }
  return convert(tex);
}
function renderMathFallback(root) {

  if (!katexAvailable()) renderMathFallback(el);
  else {
    const node = el && el.querySelector && el.querySelector(".tex[data-tex]");
    if (node && !el.querySelector(".katex") && node.getAttribute("data-fallback") !== "1") {
      renderMathFallback(el);
    }
  }
}
function texSpan(tex) {
  return `<span class="tex" data-tex="${tex.replace(/"/g,'&quot;')}">\\(${tex}\\)</span>`;
}
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
/** Wrap bare LaTeX-ish unit/exponent chunks in $...$ so KaTeX can render; leave existing math alone. */
function mathifyPlain(t) {
  t = escapeHtml(t);
  // coeff × 10^{exp} [optional compound unit], e.g. 2.0×10^{3} N C^{-1}
  t = t.replace(
    /(\d+(?:\.\d+)?)\s*[×x]\s*10\^(\{[^}]+\})(?:\s+((?:[A-Za-zμΩ]+\s+)*[A-Za-zμΩ]+\^\{[^}]+\}(?:\s+[A-Za-zμΩ]+(?:\^\{[^}]+\})?)*))?/g,
    function (_m, coef, exp, unit) {
      if (unit) {
        var u = unit.trim().replace(/\s+/g, "\\,");
        return "$" + coef + "\\times 10^" + exp + "\\,\\mathrm{" + u + "}$";
      }
      return "$" + coef + "\\times 10^" + exp + "$";
    }
  );
  // bare 10^{...}
  t = t.replace(/(^|[^$\d.\\A-Za-z])10\^(\{[^}]+\})/g, function (_m, pre, exp) {
    return pre + "$10^" + exp + "$";
  });
  // number? + compound unit containing ^{}, e.g. kg m s^{-1}, 6 kg m s^{-1}, J kg^{-1} K^{-1}
  t = t.replace(
    /(\d+(?:\.\d+)?\s+)?((?:[A-Za-zμΩ]+\s+)*[A-Za-zμΩ]+\^\{[^}]+\}(?:\s+[A-Za-zμΩ]+(?:\^\{[^}]+\})?)*)/g,
    function (full, num, unit) {
      if (full.indexOf("$") !== -1) return full;
      var u = unit.trim().replace(/\s+/g, "\\,");
      if (num) return "$" + num.trim() + "\\,\\mathrm{" + u + "}$";
      return "$\\mathrm{" + u + "}$";
    }
  );
  return t;
}
/** Direct HTML for leftover bare ^{...} (no KaTeX / no $ wrap). */
function htmlifyBareExponents(html) {
  return String(html == null ? "" : html).replace(/\^\{([^}]+)\}/g, function (_m, exp) {
    return "<sup>" + exp + "</sup>";
  });
}
function mathifyText(s) {
  s = String(s == null ? "" : s);
  var re = /\$\$[\s\S]*?\$\$|\$[^$]*\$/g;
  var out = "", last = 0, m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) out += mathifyPlain(s.slice(last, m.index));
    out += m[0];
    last = m.index + m[0].length;
  }
  if (last < s.length) out += mathifyPlain(s.slice(last));
  return out;
}

function setDefExpand(side, expanded) {
  const btn = document.getElementById(side + "-moreBtn");
  const supp = document.getElementById(side + "-supp");
  if (!btn || !supp) return;
  // Part1 永遠英文 More/Less；Part2 永遠中文 更多／收起（唔跟 UI 語言）
  const zhPart = side === "p2";
  if (expanded) {
    supp.classList.add("show");
    supp.hidden = false;
    btn.setAttribute("aria-expanded", "true");
    btn.textContent = zhPart ? "收起" : "Less";
  } else {
    supp.classList.remove("show");
    supp.hidden = true;
    btn.setAttribute("aria-expanded", "false");
    btn.textContent = zhPart ? "更多" : "More";
  }
}

function fillDefSide(side, shortDef, longSupp, keepExpand) {
  const defEl = document.getElementById(side + "-def");
  const btn = document.getElementById(side + "-moreBtn");
  const supp = document.getElementById(side + "-supp");
  const wasExpanded = !!(keepExpand && btn && btn.getAttribute("aria-expanded") === "true");
  defEl.innerHTML = mathifyText(shortDef || "");
  const has = !!(longSupp && String(longSupp).trim());
  if (has) {
    supp.innerHTML = mathifyText(longSupp);
    btn.classList.remove("hidden");
    setDefExpand(side, wasExpanded);
  } else {
    supp.innerHTML = "";
    btn.classList.add("hidden");
    setDefExpand(side, false);
  }
}

function onSearch() {
  const raw = document.getElementById("q").value;
  const concept = findConcept(raw);
  // 完整概念 exact 優先
  if (concept.hit) {
    hideGlossary();
    showConcept(concept.hit);
    return;
  }
  // glossary exact／contains 優先於 concept contains suggestion（修 moment／gravitational potential 等搶結果）
  const gloss = findGlossary(raw);
  if (gloss.hit) {
    showGlossaryCard(gloss.hit);
    return;
  }
  if (concept.suggestion) {
    current = null;
    hideGlossary();
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("emptyHint").classList.add("hidden");
    const box = document.getElementById("suggestBox");
    const chip = document.getElementById("suggestChip");
    const suggestion = concept.suggestion;
    const label = lang === "zh"
      ? `你係唔係搵：${suggestion.zh}（${suggestion.en}）？`
      : `Did you mean: ${suggestion.en} (${suggestion.zh})?`;
    chip.textContent = label;
    chip.onclick = () => {
      document.getElementById("q").value = lang === "zh" ? suggestion.zh : suggestion.en;
      hideGlossary();
      showConcept(suggestion);
      box.classList.remove("show");
    };
    box.classList.add("show");
    return;
  }
  if (gloss.suggestion) {
    current = null;
    hideGlossary();
    document.getElementById("resultArea").classList.add("hidden");
    document.getElementById("emptyHint").classList.add("hidden");
    const box = document.getElementById("suggestBox");
    const chip = document.getElementById("suggestChip");
    const suggestion = gloss.suggestion;
    const zh = (suggestion.zh_list || [])[0] || "";
    const label = lang === "zh"
      ? `你係唔係搵：${zh}（${suggestion.en}）？`
      : `Did you mean: ${suggestion.en} (${zh})?`;
    chip.textContent = label;
    chip.onclick = () => {
      document.getElementById("q").value = lang === "zh" ? zh : suggestion.en;
      showGlossaryCard(suggestion);
      box.classList.remove("show");
    };
    box.classList.add("show");
    return;
  }
  document.getElementById("suggestBox").classList.remove("show");
  document.getElementById("resultArea").classList.add("hidden");
  hideGlossary();
  document.getElementById("emptyHint").classList.remove("hidden");
  current = null;
}


/* ===== MCQ ===== */
function pickTwo(conceptId) {
  const bank = MCQ[conceptId];
  if (!bank) return [];
  const keyOf = (item) => (item.q_zh || item.q_en) + "|" + item.ans;
  const shuffle = (arr) => arr.map((x)=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
  const out = [];
  const seen = new Set();
  const pushUnique = (item) => {
    const key = keyOf(item);
    if (seen.has(key)) return false;
    seen.add(key);
    out.push(item);
    return true;
  };
  if (hardMode && bank.hard && bank.hard.length) {
    // Guarantee at least one hard question
    const hardShuf = shuffle([...(bank.hard)]);
    pushUnique(hardShuf[0]);
    // Second: prefer another hard, else normal
    for (const item of hardShuf.slice(1)) {
      if (out.length >= 2) break;
      pushUnique(item);
    }
    if (out.length < 2) {
      for (const item of shuffle([...(bank.normal||[])])) {
        if (out.length >= 2) break;
        pushUnique(item);
      }
    }
    return out;
  }
  const pool = hardMode
    ? [...(bank.hard||[]), ...(bank.normal||[])]
    : [...(bank.normal||[])];
  for (const item of shuffle(pool)) {
    pushUnique(item);
    if (out.length === 2) break;
  }
  return out;
}

function renderMCQ() {
  if (!current) return;
  document.getElementById("mcqConcept").textContent =
    lang === "zh" ? `${current.zh} · ${current.en}` : `${current.en} · ${current.zh}`;
  document.getElementById("btnHard").classList.toggle("hard-on", hardMode);
  document.getElementById("mcqFeedback").textContent = "";
  ["q1","q2"].forEach((id, idx) => {
    const wrap = document.getElementById(id);
    const item = qPair[idx];
    if (!item) { wrap.innerHTML = ""; return; }
    const qText = mathifyText(lang === "zh" ? item.q_zh : item.q_en);
    const opts = lang === "zh" ? item.opts_zh : item.opts_en;
    const letters = ["A","B","C","D"];
    let optsHtml = opts.map((o,i) => `
      <label class="opt" data-i="${i}">
        <input type="radio" name="${id}" value="${i}" />
        <span><strong>${letters[i]}.</strong> <span class="opt-text">${mathifyText(o)}</span></span>
      </label>`).join("");
    wrap.innerHTML = `
      <div class="q-title">Q${idx+1}　${qText}</div>
      <div class="opts">${optsHtml}</div>
      <div class="solution" id="sol-${id}"></div>`;
    wrap.querySelectorAll(".opt").forEach(lab => {
      lab.addEventListener("click", () => {
        wrap.querySelectorAll(".opt").forEach(x => x.classList.remove("selected"));
        lab.classList.add("selected");
        lab.querySelector("input").checked = true;
      });
    });
  });
  renderAllMath(document.getElementById("page-mcq"));
}

function loadQuestions() {
  if (!current) return;
  qPair = pickTwo(current.id);
  renderMCQ();
}

function checkAnswers() {
  if (!qPair.length) return;
  let correct = 0;
  let anyWrong = false;
  ["q1","q2"].forEach((id, idx) => {
    const item = qPair[idx];
    const wrap = document.getElementById(id);
    const chosen = wrap.querySelector(`input[name="${id}"]:checked`);
    const pick = chosen ? Number(chosen.value) : -1;
    wrap.querySelectorAll(".opt").forEach((lab,i) => {
      lab.classList.remove("correct","wrong");
      if (i === item.ans) lab.classList.add("correct");
      if (pick === i && pick !== item.ans) lab.classList.add("wrong");
    });
    const sol = document.getElementById("sol-"+id);
    if (pick === item.ans) {
      correct++;
      sol.classList.remove("show");
      sol.innerHTML = "";
    } else {
      anyWrong = true;
      const solText = mathifyText(lang === "zh" ? item.sol_zh : item.sol_en);
      const letters = ["A","B","C","D"];
      sol.innerHTML = `<h4>${lang==="zh"?"完整解題":"Full solution"}</h4>
        <div>${lang==="zh"?"正確答案":"Correct answer"}：<strong>${letters[item.ans]}</strong></div>
        <div style="margin-top:8px">${solText}</div>`;
      sol.classList.add("show");
    }
  });
  renderAllMath(document.getElementById("page-mcq"));
  const fb = document.getElementById("mcqFeedback");
  if (correct === 2) {
    fb.textContent = lang === "zh" ? "兩題全對！太棒了！" : "Both correct! Awesome!";
    document.getElementById("encourageModal").classList.add("show");
  } else if (correct === 1) {
    fb.textContent = lang === "zh" ? "答對 1 題。睇吓解題，再換兩題繼續練習！" : "1 correct. Check the solution, then try 2 new questions!";
  } else {
    fb.textContent = lang === "zh" ? "今次未中。細心睇完整解題，然後再試新題！" : "Not this time. Read the full solutions, then try new questions!";
  }
}

    <defs><marker id="barr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker></defs>
    <text x="180" y="248" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="700">條形磁鐵：磁力線由 N 出、入 S</text>
  </svg>`;
  const sol = `
  <svg viewBox="0 0 360 260" xmlns="http://www.w3.org/2000/svg" aria-label="Solenoid field like textbook Fig 5.2f">
    <rect width="360" height="260" fill="#f8fffc"/>
    <ellipse cx="80" cy="130" rx="18" ry="55" fill="none" stroke="#0f766e" stroke-width="3"/>
    <ellipse cx="280" cy="130" rx="18" ry="55" fill="none" stroke="#0f766e" stroke-width="3"/>
    <line x1="80" y1="75" x2="280" y2="75" stroke="#0f766e" stroke-width="3"/>
    <line x1="80" y1="185" x2="280" y2="185" stroke="#0f766e" stroke-width="3"/>
    ${loops}
    <line x1="95" y1="105" x2="265" y2="105" stroke="#0d9488" stroke-width="2" marker-end="url(#solr)"/>
    <line x1="95" y1="130" x2="265" y2="130" stroke="#0d9488" stroke-width="2" marker-end="url(#solr)"/>
    <line x1="95" y1="155" x2="265" y2="155" stroke="#0d9488" stroke-width="2" marker-end="url(#solr)"/>
    <path d="M270,80 C300,40 60,40 90,80" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#solr)"/>
    <path d="M270,180 C300,220 60,220 90,180" fill="none" stroke="#0d9488" stroke-width="1.8" marker-end="url(#solr)"/>
    <text x="70" y="130" text-anchor="middle" fill="#1e3a8a" font-size="14" font-weight="700">S</text>
    <text x="290" y="130" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="700">N</text>
    <defs><marker id="solr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0d9488"/></marker></defs>
    <text x="180" y="248" text-anchor="middle" fill="#0f766e" font-size="14" font-weight="700">長螺綫管：內部勻強；外似條形磁鐵</text>
  </svg>`;
  return [
    {title_zh:"條形磁鐵磁場", title_en:"Bar magnet", svg: bar},
    {title_zh:"螺綫管磁場", title_en:"Long solenoid", svg: sol}
  ];
}

function showToast(msg) {
  const el = document.getElementById("toastMsg");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function showImages() {
  if (!current) return;
  if (!current.hasImages) {
    showToast(lang === "zh" ? "呢個概念暫未有圖片" : "No diagrams for this concept yet");
    return;
  }
  document.getElementById("page-main").classList.add("hidden");
  document.getElementById("page-mcq").classList.add("hidden");
  document.getElementById("page-images").classList.remove("hidden");
  document.getElementById("imgTitle").textContent = lang === "zh"
    ? `${current.zh}示意圖` : `${current.en} diagrams`;
  const grid = document.getElementById("imgGrid");
  const figs = current.id === "efield" ? eFieldSVGs() : current.id === "bfield" ? bFieldSVGs() : [];
  const note = document.getElementById("imgNote");
  if (note) {
    if (current.id === "bfield") {
      note.textContent = lang === "zh"
        ? "磁力線：由 N 極指出、進入 S 極；螺綫管內部由 S 指向 N（已對照基本磁場事實）。"
        : "Field lines: leave N, enter S; inside a solenoid from S toward N (fact-checked).";
    } else if (current.id === "efield") {
      note.textContent = lang === "zh"
        ? "電場線：由正電荷指出、進入負電荷；平行板由正板指向負板（已對照基本電場事實）。"
        : "Field lines: leave +, enter −; between plates from + to − (fact-checked).";
    }
  }
  grid.innerHTML = figs.map(f => `
    <div class="img-card">
      <h4>${lang==="zh"?f.title_zh:f.title_en}</h4>
      ${f.svg}
    </div>`).join("");
}

function showMain() {
  document.getElementById("page-mcq").classList.add("hidden");
  document.getElementById("page-images").classList.add("hidden");
  document.getElementById("page-main").classList.remove("hidden");
}
function showMCQ() {
  if (!current) return;
  document.getElementById("page-main").classList.add("hidden");
  document.getElementById("page-images").classList.add("hidden");
  document.getElementById("page-mcq").classList.remove("hidden");
  hardMode = false;
  loadQuestions();
}

/* ===== Wire up ===== */
document.getElementById("q").addEventListener("input", onSearch);
document.getElementById("langBtn").addEventListener("click", () => {
  lang = lang === "zh" ? "en" : "zh";
  applyUILang();
});
document.getElementById("btnMCQ").addEventListener("click", showMCQ);
document.getElementById("btnImages").addEventListener("click", showImages);
document.getElementById("btnBackExplain").addEventListener("click", showMain);
document.getElementById("btnBackFromImg").addEventListener("click", showMain);
document.getElementById("btnRefresh").addEventListener("click", loadQuestions);
document.getElementById("btnRefresh2").addEventListener("click", loadQuestions);
document.getElementById("btnHard").addEventListener("click", () => {
  hardMode = !hardMode;
  loadQuestions();
});
document.getElementById("btnCheck").addEventListener("click", checkAnswers);
document.getElementById("btnCloseEncourage").addEventListener("click", () => {
  document.getElementById("encourageModal").classList.remove("show");
});
document.getElementById("btnNewAfterWin").addEventListener("click", () => {
  document.getElementById("encourageModal").classList.remove("show");
  loadQuestions();
});

// KaTeX ready
function whenKatex(fn, tries) {
  tries = tries == null ? 0 : tries;
  if (window.renderMathInElement || window.katex) { fn(); return; }
  if (tries >= 40) { fn(); return; } // ~2s then HTML fallback
  setTimeout(() => whenKatex(fn, tries + 1), 50);
}
whenKatex(() => {
  applyUILang();
  if (current) ensureMath(document.getElementById("resultArea"));
});

// Default demo: show 電流 empty until search — keep empty hint

document.getElementById("p1-moreBtn").addEventListener("click", () => {
  const expanded = document.getElementById("p1-moreBtn").getAttribute("aria-expanded") === "true";
  setDefExpand("p1", !expanded);
});
document.getElementById("p2-moreBtn").addEventListener("click", () => {
  const expanded = document.getElementById("p2-moreBtn").getAttribute("aria-expanded") === "true";
  setDefExpand("p2", !expanded);
});

applyUILang();

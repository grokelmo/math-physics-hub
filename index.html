<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HKDSE虛擬教室 | HKDSE Virtual Classroom</title>
<meta name="description" content="HKDSE 數學科與物理科互動練習工具 — HKDSE Virtual Classroom for maths and physics practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Noto+Sans+HK:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="topnav" aria-label="主導覽">
  <div class="inner">
    <span class="brand zh">HKDSE虛擬教室</span>
    <a href="index.html" aria-current="page">首頁</a>
    <a href="數學科.html">數學科</a>
    <a href="物理科.html">物理科</a>
  </div>
</nav>

<header class="hero">
  <!-- subtle classroom / book motif -->
  <svg class="deco" viewBox="0 0 520 200" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="160" x2="520" y2="160" stroke="var(--line)" stroke-width="1.5"/>
      <!-- open book -->
      <path d="M180 55 Q240 40 260 55 L260 145 Q240 132 180 145 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" opacity=".85"/>
      <path d="M340 55 Q280 40 260 55 L260 145 Q280 132 340 145 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" opacity=".85"/>
      <line x1="260" y1="55" x2="260" y2="145" stroke="var(--accent)" stroke-width="2"/>
      <!-- soft rays from book -->
      <g stroke="var(--ray)" stroke-width="2" opacity=".4">
        <polyline class="beam" points="260,48 240,18"/>
        <polyline class="beam" points="260,48 260,12"/>
        <polyline class="beam" points="260,48 280,18"/>
      </g>
      <circle cx="260" cy="48" r="3.5" fill="var(--ray)" stroke="none" opacity=".55"/>
    </g>
  </svg>
  <div class="inner">
    <p class="eyebrow">HKDSE · Maths &amp; Physics</p>
    <h1>HKDSE虛擬教室<span class="en">HKDSE Virtual Classroom</span></h1>
    <p class="lead">
      <span class="zh">揀一科開始，或直接打開下面嘅練習工具。手機、平板、電腦都啱用。</span>
      Choose a subject or open a practice tool below. Works on phone, tablet and computer.
    </p>
  </div>
</header>

<main>
  <div class="inner">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="按科目篩選"></div>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input id="q" type="search" placeholder="搜尋工具 Search" aria-label="搜尋練習工具" autocomplete="off">
      </label>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <div class="inner">
    <span class="zh">提示：可將本頁加入主畫面，方便下次開啟。</span>
    <span>HKDSE虛擬教室 · local redesign preview</span>
  </div>
</footer>

<script>
const ITEMS = [
  {
    file: "數學科.html",
    title: "數學科", en: "Maths",
    descZh: "指數、因式分解、展開等代數練習",
    descEn: "Indices, factorisation, expansion and algebra practice",
    topic: "maths", kind: "科目", kindEn: "Subject",
    icon: "mathsSubject", img: "images/home-maths.jpg", added: "2026-10-28"
  },
  {
    file: "物理科.html",
    title: "物理科", en: "Physics",
    descZh: "單位、公式、計數機技巧與概念詞彙",
    descEn: "Units, formulae, calculator skills and concept vocabulary",
    topic: "physics", kind: "科目", kindEn: "Subject",
    icon: "physicsSubject", img: "images/home-physics.jpg", added: "2026-10-28"
  },
  {
    file: "指數定律練習.html",
    title: "指數定律練習", en: "Laws of Indices",
    descZh: "練習指數運算法則",
    descEn: "Practise the laws of indices",
    topic: "maths", kind: "練習", kindEn: "Practice",
    icon: "indices", img: "images/maths-indices.jpg", added: "2026-10-28"
  },
  {
    file: "因式分解練習.html",
    title: "因式分解練習", en: "Factorization",
    descZh: "練習多項式因式分解",
    descEn: "Practise factorising polynomials",
    topic: "maths", kind: "練習", kindEn: "Practice",
    icon: "factor", img: "images/maths-factorization.jpg", added: "2026-10-28"
  },
  {
    file: "展開練習.html",
    title: "展開練習", en: "Expansion Practice",
    descZh: "練習代數式展開",
    descEn: "Practise expanding algebraic expressions",
    topic: "maths", kind: "練習", kindEn: "Practice",
    icon: "expand", img: "images/maths-expansion.jpg", added: "2026-10-28"
  },
  {
    file: "物理量單位練習.html",
    title: "物理量單位練習", en: "Quantities & Units",
    descZh: "練習物理量與單位配對",
    descEn: "Match physical quantities with their units",
    topic: "physics", kind: "練習", kindEn: "Practice",
    icon: "units", img: "images/physics-units.jpg", added: "2026-10-28"
  },
  {
    file: "物理公式練習.html",
    title: "物理公式練習", en: "Physics Formulae",
    descZh: "練習常用物理公式",
    descEn: "Practise common physics formulae",
    topic: "physics", kind: "練習", kindEn: "Practice",
    icon: "formula", img: "images/physics-formula.jpg", added: "2026-10-28"
  },
  {
    file: "物理計數機技巧練習.html",
    title: "物理計數機技巧練習", en: "Calculator Skills",
    descZh: "練習科學計數機操作技巧",
    descEn: "Practise scientific calculator skills for physics",
    topic: "physics", kind: "練習", kindEn: "Practice",
    icon: "calc", img: "images/physics-calculator.jpg", added: "2026-10-28"
  },
  {
    file: "物理概念詞彙練習.html",
    title: "物理概念詞彙練習", en: "Concept Vocabulary",
    descZh: "練習物理概念中英詞彙",
    descEn: "Practise bilingual physics concept vocabulary",
    topic: "physics", kind: "練習", kindEn: "Practice",
    icon: "vocab", img: "images/physics-vocab.jpg", added: "2026-10-30"
  }
];

const TOPICS = {
  maths:   {en: "Maths", zh: "數學科"},
  physics: {en: "Physics", zh: "物理科"}
};

const ICONS = {
  mathsSubject: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <rect x="10" y="12" width="36" height="32" rx="4" stroke="currentColor" stroke-width="2"/>
    <path d="M18 24h8M18 32h20M18 40h14" stroke="currentColor" stroke-width="2" opacity=".7"/>
    <circle cx="38" cy="24" r="3" fill="currentColor"/></svg>`,
  physicsSubject: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <ellipse cx="28" cy="28" rx="18" ry="8" stroke="currentColor" stroke-width="2" transform="rotate(60 28 28)"/>
    <ellipse cx="28" cy="28" rx="18" ry="8" stroke="currentColor" stroke-width="2" transform="rotate(-60 28 28)"/>
    <ellipse cx="28" cy="28" rx="18" ry="8" stroke="currentColor" stroke-width="2"/>
    <circle cx="28" cy="28" r="3.5" fill="currentColor"/></svg>`,
  indices: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" style="color:var(--tc)">
    <text x="12" y="38" font-size="22" font-weight="700" fill="currentColor" font-family="Lexend,sans-serif">x</text>
    <text x="28" y="22" font-size="14" font-weight="700" fill="currentColor" font-family="Lexend,sans-serif">n</text>
    <path d="M36 40h12M42 34v12" stroke="currentColor" stroke-width="2.2" opacity=".55"/></svg>`,
  factor: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <rect x="8" y="18" width="16" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
    <rect x="32" y="18" width="16" height="20" rx="3" stroke="currentColor" stroke-width="2"/>
    <path d="M26 28h4" stroke="currentColor" stroke-width="2.4"/>
    <circle cx="16" cy="28" r="2.5" fill="currentColor"/><circle cx="40" cy="28" r="2.5" fill="currentColor"/></svg>`,
  expand: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <path d="M14 18v20M42 18v20" stroke="currentColor" stroke-width="2.4"/>
    <path d="M14 18q6 10 0 20M42 18q-6 10 0 20" stroke="currentColor" stroke-width="2"/>
    <path d="M22 28h12" stroke="currentColor" stroke-width="2" opacity=".55"/></svg>`,
  units: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <rect x="12" y="10" width="20" height="36" rx="3" stroke="currentColor" stroke-width="2"/>
    <path d="M16 18h12M16 26h12M16 34h8" stroke="currentColor" stroke-width="1.8" opacity=".7"/>
    <circle cx="40" cy="36" r="8" stroke="currentColor" stroke-width="2"/>
    <path d="M40 30v6l4 3" stroke="currentColor" stroke-width="2"/></svg>`,
  formula: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" style="color:var(--tc)">
    <text x="10" y="34" font-size="18" font-weight="700" fill="currentColor" font-family="Lexend,sans-serif">E=</text>
    <text x="34" y="34" font-size="16" font-weight="700" fill="currentColor" font-family="Lexend,sans-serif">mc</text>
    <text x="48" y="24" font-size="12" font-weight="700" fill="currentColor" font-family="Lexend,sans-serif">2</text></svg>`,
  calc: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <rect x="14" y="8" width="28" height="40" rx="4" stroke="currentColor" stroke-width="2"/>
    <rect x="18" y="12" width="20" height="8" rx="2" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="22" cy="30" r="2.2" fill="currentColor"/><circle cx="28" cy="30" r="2.2" fill="currentColor"/><circle cx="34" cy="30" r="2.2" fill="currentColor"/>
    <circle cx="22" cy="38" r="2.2" fill="currentColor"/><circle cx="28" cy="38" r="2.2" fill="currentColor"/><circle cx="34" cy="38" r="2.2" fill="currentColor"/></svg>`,
  vocab: `<svg viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round" style="color:var(--tc)">
    <path d="M12 14h14a6 6 0 0 1 6 6v22H18a6 6 0 0 0-6 6V14z" stroke="currentColor" stroke-width="2"/>
    <path d="M44 14H30a6 6 0 0 0-6 6v22h14a6 6 0 0 1 6 6V14z" stroke="currentColor" stroke-width="2"/>
    <path d="M20 24h6M20 30h8" stroke="currentColor" stroke-width="1.6" opacity=".65"/></svg>`,
  generic: `<svg viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--tc)">
    <path d="M22 8h12M24 8v14L12 44a4 4 0 0 0 3.5 6h25a4 4 0 0 0 3.5-6L32 22V8"/><path d="M17 36h22" opacity=".5"/></svg>`
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arrow = `<svg class="go" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9,5 16,12 9,19"/></svg>`;

let topic = "all";
try {
  const t = localStorage.getItem("hkdse-vc-topic");
  if (t && (t === "all" || ITEMS.some(s => s.topic === t))) topic = t;
} catch (e) {}

function renderChips(){
  const btn = (k, label, n) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${topic===k}">${label}<span class="n">${n}</span></button>`;
  $("chips").innerHTML =
    btn("all", `全部 <span class="zh">All</span>`, ITEMS.length) +
    btn("maths", `<span class="zh">數學科</span> Maths`, ITEMS.filter(s => s.topic === "maths").length) +
    btn("physics", `<span class="zh">物理科</span> Physics`, ITEMS.filter(s => s.topic === "physics").length);
}

function render(){
  const q = $("q").value.trim().toLowerCase();
  const list = ITEMS
    .filter(s => topic === "all" || s.topic === topic)
    .filter(s => !q || [s.title, s.en, s.descZh, s.descEn, s.kind, s.kindEn, TOPICS[s.topic].en, TOPICS[s.topic].zh].join(" ").toLowerCase().includes(q))
    .sort((a, b) => {
      // subjects first, then by title
      if (a.kind !== b.kind) return a.kind === "科目" ? -1 : 1;
      return a.title.localeCompare(b.title, "zh-Hant");
    });
  $("grid").innerHTML = list.length ? list.map(s => `
    <a class="tile" href="${esc(s.file)}" data-topic="${s.topic}">
      <span class="icon">${s.img ? `<img src="${esc(s.img)}" alt="" loading="lazy">` : (ICONS[s.icon] || ICONS.generic)}</span>
      <span class="body">
        <span class="title">${esc(s.title)}<span class="en">${esc(s.en)}</span></span>
        <span class="desc"><span class="zh">${esc(s.descZh)}</span>${esc(s.descEn)}</span>
        <span class="tags"><span class="tag">${TOPICS[s.topic].zh} · ${TOPICS[s.topic].en}</span><span class="tag kind">${esc(s.kind)} / ${esc(s.kindEn)}</span></span>
      </span>
      ${arrow}
    </a>`).join("")
    : `<div class="empty">搵唔到「${esc($("q").value)}」。試吓其他關鍵字，或揀 <b>全部</b>。<br>No matches — try another word, or choose <b>All</b>.</div>`;
  $("count").textContent = `顯示 ${list.length} / ${ITEMS.length} 項 · Showing ${list.length} of ${ITEMS.length}`;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  topic = b.dataset.k;
  try { localStorage.setItem("hkdse-vc-topic", topic); } catch (e) {}
  [...$("chips").children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  render();
});
$("q").addEventListener("input", render);

renderChips(); render();
</script>
</body>
</html>

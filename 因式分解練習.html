<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>因式分解練習：代數恆等式</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background-color: #f3f4f6;
    }

    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    /* Dropzone slot hover and drag highlight effects */
    .drop-slot {
      transition: all 0.2s ease-in-out;
      min-width: 4rem;
      min-height: 3.5rem;
    }
    .drop-slot.drag-over {
      border-color: #6366f1 !important;
      background-color: #e0e7ff !important;
      transform: scale(1.05);
    }
    .drop-slot.selected-slot {
      ring: 2px;
      ring-color: #6366f1;
      border-color: #4f46e5;
    }

    /* Term bank item styling */
    .term-tile {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: all 0.15s ease-in-out;
    }
    .term-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }
    .term-tile:active {
      transform: translateY(0);
    }
    .term-tile.selected-term {
      border-color: #4f46e5 !important;
      background-color: #e0e7ff !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3) !important;
    }

    /* Card shake animation for error */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Confetti Canvas overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Main Header & Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- App Brand Title -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-extrabold text-xl shadow-md">
          F
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight" data-i18n="app_title">因式分解練習</h1>
          <p class="text-xs text-slate-500 font-medium" data-i18n="app_subtitle">代數恆等式練習</p>
        </div>
      </div>

      <!-- Stats Bar: Level, Progress, Score, Streak, Lang -->
      <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm font-semibold">
        <!-- Level Badge -->
        <div id="level-badge" class="px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 border border-indigo-200">
          第1級
        </div>

        <!-- Question Counter -->
        <div class="px-3 py-1 rounded-full bg-slate-100 text-slate-700 border border-slate-200">
          <span id="question-progress-text">第 1 題／共 16 題</span>
        </div>

        <!-- Streak Counter -->
        <div class="flex items-center space-x-1 px-3 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">
          <span>🔥</span>
          <span id="streak-count">0</span>
        </div>

        <!-- Score Counter -->
        <div class="flex items-center space-x-1 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span>⭐</span>
          <span id="score-count">0</span>
        </div>

        <!-- Restart Button -->
        <button id="btn-restart" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors" data-i18n-title="restart_title" title="重新開始">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>

        <!-- Language Toggle (top-right) -->
        <button id="btn-lang-toggle" type="button" class="px-3 py-1.5 rounded-full bg-slate-800 text-white hover:bg-indigo-700 border border-slate-700 text-xs font-bold shadow-sm transition-colors active:scale-95 min-w-[3.25rem]" title="Switch language">
          EN
        </button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="w-full bg-slate-100 h-1.5">
      <div id="progress-bar-inner" class="bg-gradient-to-r from-indigo-500 to-violet-500 h-1.5 transition-all duration-300 w-0"></div>
    </div>
  </header>

  <!-- Main Interactive Area (centered, no sidebar) -->
  <main class="max-w-3xl mx-auto px-4 py-6 flex-1 w-full flex flex-col space-y-6">

    <section class="flex flex-col space-y-6 w-full">

      <!-- Question Card -->
      <div id="question-card" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 transition-all duration-200">
        <!-- Top Card Tag (Level indicator only, identity hidden per specs) -->
        <div class="flex justify-between items-center mb-4">
          <span id="card-level-tag" class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100">
            第1級
          </span>
          <span class="text-xs text-slate-400 font-medium" data-i18n="factorize_instruction">請完全因式分解以下式子</span>
        </div>

        <!-- Problem Display -->
        <div class="text-center py-6 bg-slate-50 rounded-xl border border-slate-100 mb-6">
          <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold block mb-1" data-i18n="expression_label">式子</span>
          <div id="expression-display" class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-wide font-mono">
            x² - 9
          </div>
        </div>

        <!-- STEP 1: Identity Formula Selection -->
        <div class="space-y-3 mb-6">
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">1</span>
            <h3 class="font-bold text-slate-800 text-sm" data-i18n="step1_title">選擇對應的代數恆等式</h3>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button data-identity="diff_sq" class="identity-btn p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-300 text-left transition-all hover:shadow-sm focus:outline-none">
              <span class="text-xs font-semibold text-slate-400 block mb-1" data-i18n="id_diff_sq">平方差</span>
              <span class="text-sm font-bold font-mono text-slate-800 block">a² - b²</span>
              <span class="text-xs text-slate-500 font-mono block mt-0.5">= (a + b)(a - b)</span>
            </button>

            <button data-identity="perf_sq_add" class="identity-btn p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-300 text-left transition-all hover:shadow-sm focus:outline-none">
              <span class="text-xs font-semibold text-slate-400 block mb-1" data-i18n="id_perf_sq_add">完全平方式 (+)</span>
              <span class="text-sm font-bold font-mono text-slate-800 block">a² + 2ab + b²</span>
              <span class="text-xs text-slate-500 font-mono block mt-0.5">= (a + b)²</span>
            </button>

            <button data-identity="perf_sq_sub" class="identity-btn p-3 rounded-xl border-2 border-slate-200 bg-white hover:border-indigo-300 text-left transition-all hover:shadow-sm focus:outline-none">
              <span class="text-xs font-semibold text-slate-400 block mb-1" data-i18n="id_perf_sq_sub">完全平方式 (−)</span>
              <span class="text-sm font-bold font-mono text-slate-800 block">a² - 2ab + b²</span>
              <span class="text-xs text-slate-500 font-mono block mt-0.5">= (a - b)²</span>
            </button>
          </div>
        </div>

        <!-- STEP 2: Interactive Factorization Dropzones -->
        <div id="step2-container" class="space-y-3 opacity-40 pointer-events-none transition-opacity duration-300">
          <div class="flex items-center space-x-2">
            <span class="w-6 h-6 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">2</span>
            <h3 class="font-bold text-slate-800 text-sm" data-i18n="step2_title">填入各項以完成因式分解</h3>
          </div>

          <!-- Dropzone Container -->
          <div class="p-6 bg-indigo-50/50 rounded-xl border border-indigo-100 flex flex-wrap items-center justify-center gap-2 sm:gap-3 text-lg sm:text-2xl font-bold font-mono text-slate-700 min-h-[100px]" id="dropzone-area">
            <span class="text-slate-400 text-sm font-normal italic" data-i18n="dropzone_placeholder">請先在上方選擇恆等式</span>
          </div>
        </div>
      </div>

      <!-- Auto-Replenishing Term Bank Card -->
      <div id="bank-card" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <h3 class="font-bold text-slate-800 text-sm"><span data-i18n="term_bank">選項庫</span> <span class="text-xs font-normal text-slate-500" data-i18n="term_bank_hint">（拖曳或點按放入）</span></h3>
          </div>
          <button id="btn-clear-slots" class="text-xs font-semibold text-slate-500 hover:text-red-600 transition-colors" data-i18n="clear_slots">
            清空格位
          </button>
        </div>

        <!-- Term Bank Tiles Grid -->
        <div id="term-bank" class="flex flex-wrap gap-2.5 min-h-[60px] items-center p-3 bg-slate-50 rounded-xl border border-slate-200">
          <!-- Dynamically populated tiles -->
        </div>
      </div>

      <!-- Action Control Buttons -->
      <div class="flex items-center justify-between gap-4">
        <button id="btn-hint" class="px-4 py-2.5 rounded-xl border border-amber-300 bg-amber-50 text-amber-800 hover:bg-amber-100 text-xs sm:text-sm font-semibold transition-all flex items-center space-x-1.5 shadow-sm">
          <span>💡</span>
          <span data-i18n="need_hint">需要提示？</span>
        </button>

        <!-- Check Answer Button with Rapid Click Protection -->
        <button id="check-btn" class="px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-sm shadow-md hover:shadow-lg transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed" data-i18n="check_answer">
          檢查答案
        </button>
      </div>

      <!-- Inline Feedback / Hint Message Box -->
      <div id="feedback-toast" class="hidden p-4 rounded-xl text-sm font-medium transition-all duration-200"></div>

    </section>

    <!-- Shown after 10 correct answers (always Chinese) -->
    <div id="hkdse-congrats" class="hidden mt-2 mb-4 text-center px-4 py-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-800 font-extrabold text-lg sm:text-xl shadow-sm">
      恭喜你，祝你HKDSE考試好好好！！
    </div>

  </main>

  <!-- Victory Completion Modal Overlay -->
  <div id="victory-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-slate-100 text-center relative max-h-[90vh] overflow-y-auto">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
        🏆
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2" data-i18n="victory_title">練習完成！</h2>
      <p class="text-slate-500 text-sm mb-6" data-i18n="victory_subtitle">做得好！你已掌握代數恆等式因式分解！</p>

      <!-- Stats Summary Grid -->
      <div class="grid grid-cols-3 gap-3 mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200">
        <div>
          <span class="text-xs text-slate-400 block font-medium" data-i18n="final_score">最終分數</span>
          <span id="final-score" class="text-xl font-extrabold text-indigo-600">0</span>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-medium" data-i18n="max_streak">最高連勝</span>
          <span id="final-streak" class="text-xl font-extrabold text-amber-500">0</span>
        </div>
        <div>
          <span class="text-xs text-slate-400 block font-medium" data-i18n="accuracy">正確率</span>
          <span id="final-accuracy" class="text-xl font-extrabold text-emerald-600">100%</span>
        </div>
      </div>

      <div class="flex justify-center gap-3">
        <button id="btn-modal-restart" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition-all" data-i18n="try_again">
          再試一次
        </button>
      </div>
    </div>
  </div>

  <script>
    // ---- i18n ----
    const LANG_KEY = 'factorization-lab-lang';
    let currentLang = 'zh';

    const I18N = {
      en: {
        page_title: 'Factorization Lab: Algebraic Identities',
        app_title: 'Factorization Lab',
        app_subtitle: 'Algebraic Identities Practice',
        level1: 'Level 1',
        level2: 'Level 2',
        q_of: 'Q {n} of {total}',
        restart_title: 'Restart Quiz',
        lang_switch_to: '中文',
        factorize_instruction: 'Factorize the expression completely',
        expression_label: 'Expression',
        step1_title: 'Select the Matching Algebraic Identity',
        step2_title: 'Fill in the Terms to Complete Factorization',
        id_diff_sq: 'Difference of Squares',
        id_perf_sq_add: 'Perfect Square (+)',
        id_perf_sq_sub: 'Perfect Square (−)',
        dropzone_placeholder: 'Please select an identity above first',
        term_bank: 'Term Bank',
        term_bank_hint: '(Drag or tap term to place)',
        clear_slots: 'Clear Slots',
        need_hint: 'Need a Hint?',
        check_answer: 'Check Answer',
        ref_title: 'Identities Reference',
        ref_diff_sq: '1. Difference of Squares',
        ref_perf_add: '2. Perfect Square (Addition)',
        ref_perf_sub: '3. Perfect Square (Subtraction)',
        example_label: 'Example: ',
        tip_title: 'Pro Strategy Tip',
        tip_body: 'Count the number of terms! Two terms with a minus sign usually means <b>Difference of Squares</b>. Three terms means a <b>Perfect Square</b> polynomial!',
        victory_title: 'Quiz Completed!',
        victory_subtitle: 'Excellent job mastering algebraic identities!',
        final_score: 'Final Score',
        max_streak: 'Max Streak',
        accuracy: 'Accuracy',
        try_again: 'Try Again',
        toast_select_identity: 'Please select an algebraic identity in Step 1 first!',
        toast_fill_slots: 'Please fill in all empty dropzone slots in Step 2!',
        toast_success: '🎉 Excellent! Spot on factorization!',
        toast_wrong_identity: 'Incorrect identity chosen! Check the sign and structure of the expression.',
        toast_wrong_slots: 'Identity is correct, but term placement is wrong. Check square roots!',
        hint_prefix: '💡 Hint: '
      },
      zh: {
        page_title: '因式分解練習：代數恆等式',
        app_title: '因式分解練習',
        app_subtitle: '代數恆等式練習',
        level1: '第1級',
        level2: '第2級',
        q_of: '第 {n} 題／共 {total} 題',
        restart_title: '重新開始',
        lang_switch_to: 'EN',
        factorize_instruction: '請完全因式分解以下式子',
        expression_label: '式子',
        step1_title: '選擇對應的代數恆等式',
        step2_title: '填入各項以完成因式分解',
        id_diff_sq: '平方差',
        id_perf_sq_add: '完全平方式 (+)',
        id_perf_sq_sub: '完全平方式 (−)',
        dropzone_placeholder: '請先在上方選擇恆等式',
        term_bank: '選項庫',
        term_bank_hint: '（拖曳或點按放入）',
        clear_slots: '清空格位',
        need_hint: '需要提示？',
        check_answer: '檢查答案',
        ref_title: '恆等式參考',
        ref_diff_sq: '1. 平方差',
        ref_perf_add: '2. 完全平方式（加）',
        ref_perf_sub: '3. 完全平方式（減）',
        example_label: '例子：',
        tip_title: '解題小貼士',
        tip_body: '先數項數！兩項中間是減號，多數是<b>平方差</b>。三項則多數是<b>完全平方式</b>！',
        victory_title: '練習完成！',
        victory_subtitle: '做得好！你已掌握代數恆等式因式分解！',
        final_score: '最終分數',
        max_streak: '最高連勝',
        accuracy: '正確率',
        try_again: '再試一次',
        toast_select_identity: '請先在步驟 1 選擇代數恆等式！',
        toast_fill_slots: '請在步驟 2 填滿所有空格！',
        toast_success: '🎉 做得好！因式分解完全正確！',
        toast_wrong_identity: '恆等式選錯了！請檢查式子的符號與結構。',
        toast_wrong_slots: '恆等式正確，但項的位置不對。請檢查平方根！',
        hint_prefix: '💡 提示：'
      }
    };

    function t(key) {
      const pack = I18N[currentLang] || I18N.zh;
      return (pack[key] !== undefined) ? pack[key] : ((I18N.en[key] !== undefined) ? I18N.en[key] : key);
    }

    function applyLang() {
      document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
      document.title = t('page_title');

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key) el.textContent = t(key);
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (key) el.innerHTML = t(key);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        const key = el.getAttribute('data-i18n-title');
        if (key) el.setAttribute('title', t(key));
      });

      const langBtn = document.getElementById('btn-lang-toggle');
      if (langBtn) langBtn.textContent = t('lang_switch_to');

      // Dynamic bits without resetting progress
      if (typeof activeQuestions !== 'undefined' && activeQuestions.length) {
        const levelKey = currentQuestionIndex < 12 ? 'level1' : 'level2';
        const levelText = t(levelKey);
        const levelBadge = document.getElementById('level-badge');
        const cardTag = document.getElementById('card-level-tag');
        if (levelBadge) levelBadge.textContent = levelText;
        if (cardTag) cardTag.textContent = levelText;

        const progressEl = document.getElementById('question-progress-text');
        if (progressEl) {
          progressEl.textContent = t('q_of')
            .replace('{n}', String(currentQuestionIndex + 1))
            .replace('{total}', String(activeQuestions.length));
        }

        // Refresh empty dropzone placeholder only if no identity selected yet
        if (!selectedIdentity) {
          const drop = document.getElementById('dropzone-area');
          if (drop) {
            drop.innerHTML = '<span class="text-slate-400 text-sm font-normal italic">' + t('dropzone_placeholder') + '</span>';
          }
        }
      }
    }

    function setLang(lang, persist) {
      currentLang = (lang === 'en') ? 'en' : 'zh';
      if (persist !== false) {
        try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
      }
      applyLang();
    }

    function toggleLang() {
      setLang(currentLang === 'zh' ? 'en' : 'zh');
    }

    function loadSavedLang() {
      let saved = 'zh';
      try {
        const v = localStorage.getItem(LANG_KEY);
        if (v === 'en' || v === 'zh') saved = v;
      } catch (e) {}
      currentLang = saved;
    }

    // Application Global State
    let currentQuestionIndex = 0;
    let score = 0;
    let correctCount = 0;
    let currentStreak = 0;
    let maxStreak = 0;
    let totalAttempts = 0;
    let selectedIdentity = null; // 'diff_sq', 'perf_sq_add', 'perf_sq_sub'
    let currentSlots = []; // Stores strings for current dropzone entries
    let selectedBankTerm = null; // Currently clicked term from term bank
    
    // CRITICAL: Lock flag to prevent rapid click / double submit race conditions
    let isProcessing = false;

    // Master Question Dataset
    // Level 1: 12 Basic Questions
    const LEVEL1_QUESTIONS = [
      { id: 1, expr: "x² - 9", type: "diff_sq", expectedIdentity: "diff_sq", expectedSlots: ["x", "3", "x", "3"], bank: ["x", "3", "9", "6", "x²", "2"], hint_en: "Two squared terms separated by a minus sign. Use a² - b².", hint_zh: "兩項平方中間是減號。用 a² − b²。" },
      { id: 2, expr: "a² - 25", type: "diff_sq", expectedIdentity: "diff_sq", expectedSlots: ["a", "5", "a", "5"], bank: ["a", "5", "25", "10", "a²", "4"], hint_en: "What squared gives 25? Use a² - b² = (a + b)(a - b).", hint_zh: "什麼數的平方是 25？用 a² − b² = (a + b)(a − b)。" },

    function questionHint(q) {
      if (!q) return '';
      if (currentLang === 'zh') return q.hint_zh || q.hint_en || q.hint || '';
      return q.hint_en || q.hint_zh || q.hint || '';

    let activeQuestions = [];

    // Web Audio Synthesizer for SFX
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        if (type === 'correct') {
          // Ascending arpeggio chime
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.25);
          });
        } else if (type === 'error') {
          // Low error tone
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'select') {
          // Soft click blip
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.05);
        }
      } catch (e) {
        console.log("Audio not supported or blocked");
      }
    }

    // Helper to shuffle array in place
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize full session dataset
    function initSession() {
      const shuffledL1 = shuffle(LEVEL1_QUESTIONS);
      const shuffledL2 = shuffle(LEVEL2_QUESTIONS);
      activeQuestions = [...shuffledL1, ...shuffledL2];

      currentQuestionIndex = 0;
      score = 0;
      correctCount = 0;
      currentStreak = 0;
      maxStreak = 0;
      totalAttempts = 0;
      isProcessing = false;

      const congratsEl = document.getElementById('hkdse-congrats');
      if (congratsEl) congratsEl.classList.add('hidden');

      updateStatsUI();
      renderQuestion();
    }

      if (!q) {
        showVictoryScreen();
        return;
      }

      // Hide feedback toast
      const toast = document.getElementById('feedback-toast');
      toast.classList.add('hidden');

      // Update question text and headers
      document.getElementById('expression-display').textContent = q.expr;

      // CRITICAL UI REQUIREMENT: The header display for Level 1 questions MUST ONLY show "Level 1"
      // and Level 2 MUST ONLY show "Level 2". DO NOT disclose identity category names!
      const levelText = currentQuestionIndex < 12 ? t('level1') : t('level2');
      document.getElementById('level-badge').textContent = levelText;
      document.getElementById('card-level-tag').textContent = levelText;
      
      if (currentQuestionIndex >= 12) {

      } else {
        document.getElementById('level-badge').className = "px-3 py-1 rounded-full bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold";
        document.getElementById('card-level-tag').className = "text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100";
      }

      document.getElementById('question-progress-text').textContent = t('q_of')

        .replace('{total}', String(activeQuestions.length));

      // Reset Step 1 & Step 2 state

    // Render Term Bank Tiles
    function renderTermBank(terms) {
      const bankContainer = document.getElementById('term-bank');
      bankContainer.innerHTML = '';

      terms.forEach(term => {
        const tile = document.createElement('div');
        tile.className = 'term-tile px-4 py-2 bg-white border-2 border-slate-200 hover:border-indigo-400 text-slate-800 font-mono font-bold rounded-xl cursor-pointer shadow-sm text-center min-w-[50px] font-mono';
        tile.textContent = term;
        tile.setAttribute('draggable', 'true');
        tile.dataset.term = term;

        // Click to select
        tile.addEventListener('click', () => {
          playSound('select');
          document.querySelectorAll('.term-tile').forEach(t => t.classList.remove('selected-term'));
          if (selectedBankTerm === term) {
            selectedBankTerm = null;
          } else {
            selectedBankTerm = term;
            tile.classList.add('selected-term');
          }
        });

        // HTML5 Drag Start
        tile.addEventListener('dragstart', (e) => {
          playSound('select');
          e.dataTransfer.setData('text/plain', term);
          selectedBankTerm = term;
        });

        bankContainer.appendChild(tile);
      });
    }

      const slotElems = dropArea.querySelectorAll('.drop-slot');
      slotElems.forEach(slotEl => {
        const slotIdx = parseInt(slotEl.dataset.slot);

        // Click slot to place selected term OR clear slot
        slotEl.addEventListener('click', () => {
          playSound('select');
          if (currentSlots[slotIdx]) {
            // Clear slot
            currentSlots[slotIdx] = null;
            updateSlotUI(slotEl, null);
          } else if (selectedBankTerm) {
            // Place selected term
            currentSlots[slotIdx] = selectedBankTerm;
            updateSlotUI(slotEl, selectedBankTerm);
          }
        });

        // HTML5 Drag & Drop listeners
        slotEl.addEventListener('dragover', (e) => {
          e.preventDefault();

            playSound('select');
            currentSlots[slotIdx] = term;
            updateSlotUI(slotEl, term);
          }
        });
      });

    // Update single slot element UI
    function updateSlotUI(slotEl, term) {
      if (term) {
        slotEl.textContent = term;
        slotEl.className = 'drop-slot rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 font-bold px-3 py-1 flex items-center justify-center cursor-pointer shadow-sm';

    // Answer Checking Logic with RAPID CLICK PROTECTION
    function checkAnswer() {
      // CRITICAL: Lock flag check
      if (isProcessing) return;
      
      const q = activeQuestions[currentQuestionIndex];
      const toast = document.getElementById('feedback-toast');

      // Check Step 1: Identity Selection
      if (!selectedIdentity) {
        playSound('error');
        showToast(t('toast_select_identity'), 'error');
        shakeCard();
        return;
      }

      // Check Step 2: Slot completion
      if (currentSlots.includes(null) || currentSlots.length === 0) {
        playSound('error');
        showToast(t('toast_fill_slots'), 'error');
        shakeCard();
        return;
      }

      // LOCK ACTION to prevent double submits / question skipping
      isProcessing = true;
      const checkBtn = document.getElementById('check-btn');
      checkBtn.disabled = true;
      checkBtn.classList.add('opacity-50', 'cursor-not-allowed');

      totalAttempts++;

      // Validate Identity & Slots
      const isIdentityCorrect = (selectedIdentity === q.expectedIdentity);
      
      // Check slot content array matching
      let isSlotsCorrect = true;
      if (currentSlots.length !== q.expectedSlots.length) {
        isSlotsCorrect = false;
      } else {
        for (let i = 0; i < currentSlots.length; i++) {
          if (currentSlots[i] !== q.expectedSlots[i]) {
            isSlotsCorrect = false;
            break;
          }
        }
      }

      if (isIdentityCorrect && isSlotsCorrect) {
        // CORRECT ANSWER!
        playSound('correct');
        score += 10;
        correctCount++;
        currentStreak++;
        if (currentStreak > maxStreak) maxStreak = currentStreak;
        updateStatsUI();

        if (correctCount >= 10) {
          const congratsEl = document.getElementById('hkdse-congrats');
          if (congratsEl) congratsEl.classList.remove('hidden');
        }

        showToast(t('toast_success'), 'success');

        // Wait 1.4 seconds before advancing, guaranteeing no double skips
        setTimeout(() => {
          currentQuestionIndex++;
          renderQuestion();
        }, 1400);

      } else {
        // INCORRECT ANSWER
        playSound('error');
        currentStreak = 0;
        updateStatsUI();

        if (!isIdentityCorrect) {
          showToast(t('toast_wrong_identity'), 'error');
        } else {
          showToast(t('toast_wrong_slots'), 'error');
        }

        shakeCard();

        // Unlock after short delay so student can retry
        setTimeout(() => {
          isProcessing = false;
          checkBtn.disabled = false;
          checkBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }, 600);
      }
    }

    // Lightweight HTML5 Canvas Confetti Effect
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 10 + 10,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: Math.random() * 0.07 + 0.05,
          tiltAngle: 0
        });
      }

      let animationFrame;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
          p.tiltAngle += p.tiltAngleIncremental;
          p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
          p.tilt = Math.sin(p.tiltAngle) * 15;

          ctx.beginPath();
          ctx.lineWidth = p.r;
          ctx.strokeStyle = p.color;
          ctx.moveTo(p.x + p.tilt + p.r, p.y);
          ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
          ctx.stroke();

          if (p.y > canvas.height) {
            particles[i] = {
              x: Math.random() * canvas.width,
              y: -10,
              r: p.r,
              d: p.d,
              color: p.color,
              tilt: p.tilt,
              tiltAngleIncremental: p.tiltAngleIncremental,
              tiltAngle: p.tiltAngle
            };
          }
        });
        animationFrame = requestAnimationFrame(draw);
      }

      draw();
      setTimeout(() => {
        cancelAnimationFrame(animationFrame);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 6000);
    }

          const identityKey = btn.dataset.identity;

          document.querySelectorAll('.identity-btn').forEach(b => {
            b.classList.remove('border-indigo-600', 'bg-indigo-50', 'ring-2', 'ring-indigo-300');
            b.classList.add('border-slate-200', 'bg-white');
          });

          btn.classList.remove('border-slate-200', 'bg-white');
          btn.classList.add('border-indigo-600', 'bg-indigo-50', 'ring-2', 'ring-indigo-300');

          setupDropzone(identityKey);
        });
      });

      // Check Answer Button
      document.getElementById('check-btn').addEventListener('click', checkAnswer);

      // Clear Slots Button
      document.getElementById('btn-clear-slots').addEventListener('click', () => {
        playSound('select');
        if (selectedIdentity) {
          setupDropzone(selectedIdentity);
        }
      });

      // Hint Button
      document.getElementById('btn-hint').addEventListener('click', () => {
        playSound('select');
        const q = activeQuestions[currentQuestionIndex];
        const hintText = questionHint(q);
        if (q && hintText) {
          showToast(t('hint_prefix') + hintText, 'hint');
        }
      });

      // Restart Quiz Buttons
      document.getElementById('btn-restart').addEventListener('click', initSession);
      document.getElementById('btn-modal-restart').addEventListener('click', () => {
        document.getElementById('victory-modal').classList.add('hidden');
        initSession();
      });

      // Language toggle
      document.getElementById('btn-lang-toggle').addEventListener('click', () => {
        playSound('select');
        toggleLang();
      });

      // Apply language first, then start session
      applyLang();
      initSession();

      // Preview helper: ?preview=congrats shows the 10-correct banner without playing
      if (new URLSearchParams(location.search).get('preview') === 'congrats') {
        const el = document.getElementById('hkdse-congrats');
        if (el) el.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>

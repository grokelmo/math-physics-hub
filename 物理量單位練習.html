<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>物理量單位練習</title>
<style>
  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #1a5f7a;
    --primary-dark: #0d3d4f;
    --accent: #57c5b6;
    --accent-soft: #e8f7f5;
    --ok: #2d9a6a;
    --ok-bg: #e6f7ef;
    --bad: #c0392b;
    --bad-bg: #fdecea;
    --hint: #5b6b7a;
    --border: #d0dbe6;
    --chip: #1a5f7a;
    --chip-bg: #e3eef3;
    --slot: #f7fafc;
    --shadow: 0 2px 10px rgba(26, 95, 122, 0.08);
    --radius: 12px;
    --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: linear-gradient(160deg, #e8f1f5 0%, #f5f0e8 100%);
    color: #1a2a33;
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.4;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 10px 12px calc(80px + var(--safe-bottom));
  }
  header {
    text-align: center;
    margin-bottom: 10px;
    padding: 6px 4px 2px;
  }
  header h1 {
    font-size: 1.25rem;
    color: var(--primary-dark);
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .sub {
    font-size: 0.78rem;
    color: var(--hint);
    margin-top: 4px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 12px;
    margin-bottom: 10px;
  }
  .seg {
    display: flex;
    gap: 6px;
    flex: 1;
    min-width: 200px;
  }
  .seg button, .lang-btn, .btn {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--primary-dark);
    border-radius: 10px;
    padding: 8px 12px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    min-height: 42px;
  }
  .seg button.active, .lang-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .lang-pair { display: flex; gap: 6px; }
  .hint-bar {
    font-size: 0.85rem;
    color: var(--hint);
    margin-bottom: 8px;
  }
  .match-list { display: flex; flex-direction: column; gap: 8px; }
  .match-row {
    display: grid;
    grid-template-columns: 1fr minmax(120px, 0.9fr);
    gap: 8px;
    align-items: stretch;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: #fafcfd;
  }
  .match-row.ok {
    background: var(--ok-bg);
    border-color: #a8dfc4;
  }
  .match-row.bad {
    background: var(--bad-bg);
    border-color: #f0b4ad;
  }
  .prompt {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 6px 8px;
    min-height: 52px;
  }
  .prompt .main {
    font-weight: 700;
    font-size: 0.98rem;
    color: var(--primary-dark);
    word-break: break-word;
    line-height: 1.55;
  }
  .frac{
    display:inline-flex;flex-direction:column;align-items:center;
    vertical-align:middle;margin:0 .12em;line-height:1.15;
  }
  .frac .num{
    padding:0 .28em .08em;border-bottom:1.5px solid currentColor;text-align:center;
    white-space:nowrap;
  }
  .frac .den{
    padding:.08em .28em 0;text-align:center;white-space:nowrap;
  }
  .frac .frac{font-size:.92em;margin:0 .04em}
  .prompt .main .frac{font-weight:700}

  .prompt .meta {
    font-size: 0.78rem;
    color: var(--hint);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .drop-slot {
    min-height: 52px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    background: var(--slot);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: border-color .15s, background .15s;
  }
  .drop-slot.drag-over {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .drop-slot.empty::after {
    content: attr(data-placeholder);
    color: #9aabba;
    font-size: 0.8rem;
  }
  .drop-slot:not(.empty)::after { content: none; }
  .pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #eef4f8;
    border-radius: 10px;
    border: 1px solid var(--border);
    min-height: 64px;
    margin-top: 10px;
  }
  .pool-label {
    width: 100%;
    font-size: 0.75rem;
    color: var(--hint);
    font-weight: 600;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 12px;
    min-height: 44px;
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--chip);
    border: 1px solid #b7ced8;
    font-weight: 700;
    font-size: 0.92rem;
    cursor: grab;
    user-select: none;
    touch-action: none;
    max-width: 100%;
    text-align: center;
    word-break: break-word;
  }
  .chip:active, .chip.dragging { cursor: grabbing; opacity: 0.85; transform: scale(1.03); }
  .chip.in-slot {
    width: 100%;
    border-radius: 8px;
    justify-content: center;
  }
  .chip.locked { cursor: default; opacity: 0.95; }
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    opacity: 0.92;
    box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1.2fr;
    gap: 8px;
    margin-top: 12px;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 10px 12px calc(10px + var(--safe-bottom));
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    max-width: 820px;
    margin-left: auto;
    margin-right: auto;
  }
  .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-secondary { background: var(--accent-soft); border-color: #9ed9d0; }
  .btn-ghost { background: #fff; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .feedback {
    margin-top: 10px;
    font-size: 0.92rem;
    min-height: 1.4em;
  }
  .feedback .ok { color: var(--ok); font-weight: 700; }
  .feedback .bad { color: var(--bad); font-weight: 700; }
  .correct-ans {
    display: block;
    font-size: 0.8rem;
    color: var(--hint);
    margin-top: 2px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    text-align: center;
  }
  .stat .n { font-size: 1.35rem; font-weight: 800; color: var(--primary); }
  .stat .l { font-size: 0.75rem; color: var(--hint); }
  .src-note {
    font-size: 0.72rem;
    color: var(--hint);
    text-align: center;
    margin-top: 6px;
  }
  @media (max-width: 560px) {
    .match-row { grid-template-columns: 1fr; }
    .drop-slot { min-height: 48px; }
    header h1 { font-size: 1.1rem; }
    .actions { grid-template-columns: 1fr 1fr 1fr; }
    .btn { font-size: 0.88rem; padding: 10px 6px; }
  }
  @media (min-width: 601px) {
    .wrap { padding: 16px 14px 32px; }
    .actions {
      position: sticky;
      bottom: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-top: 12px;
    }
    header h1 { font-size: 1.45rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">物理量單位練習</h1>
    <div class="sub" id="subtitle">HKDSE 物理 · 拖放配對</div>
  </header>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="mode">
      <button type="button" class="active" data-mode="unit" id="btnModeUnit">單位配對</button>
      <button type="button" data-mode="formula" id="btnModeFormula">公式配對</button>
    </div>
    <div class="lang-pair">
      <button type="button" class="lang-btn active" data-lang="zh" id="btnZh">繁中</button>
      <button type="button" class="lang-btn" data-lang="en" id="btnEn">EN</button>
    </div>
  </div>

  <section class="card">
    <div class="hint-bar" id="hintBar">將右邊單位拖到對應物理量。</div>
    <div class="match-list" id="matchList"></div>
    <div class="pool" id="chipPool">
      <div class="pool-label" id="poolLabel">答案籌碼</div>
    </div>
    <div class="actions" id="actionBar">
      <button type="button" class="btn btn-ghost" id="btnClear">清除</button>
      <button type="button" class="btn btn-secondary" id="btnNew">下一局</button>
      <button type="button" class="btn btn-primary" id="btnSubmit">提交</button>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><div class="n" id="statTried">0</div><div class="l" id="lblTried">本局題數</div></div>
      <div class="stat"><div class="n" id="statCorrect">0</div><div class="l" id="lblCorrect">答對</div></div>
      <div class="stat"><div class="n" id="statRounds">0</div><div class="l" id="lblRounds">局數</div></div>
    </div>
    <div class="src-note" id="srcNote"></div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var BANK = {"source":{"zh":"HKDSE Phy-Formulae Data（剔 E1/E2）＋課程與評估指引（C&A Guide）明示單位","en":"HKDSE Phy-Formulae Data (excl. E1/E2) + C&A Guide explicit units"},"constants":[{"id":"const_1","type":"constant","name":{"zh":"摩爾氣體常數","en":"molar gas constant"},"symbol":"R","formula":"R = 8.31 J mol−1 K−1","unit":"J mol⁻¹ K⁻¹","unit_raw":"J mol−1 K−1"},{"id":"const_2","type":"constant","name":{"zh":"阿佛加德羅常數","en":"Avogadro constant"},"symbol":"N_A","formula":"N_A = 6.02 × 10²³ mol⁻¹","unit":"mol⁻¹","unit_raw":"mol−1"},{"id":"const_3","type":"constant","name":{"zh":"重力加速度","en":"acceleration due to gravity"},"symbol":"g","formula":"g = 9.81 m s−2","unit":"m s⁻²","unit_raw":"m s−2"},{"id":"const_4","type":"constant","name":{"zh":"萬有引力常數","en":"universal gravitational constant"},"symbol":"G","formula":"G = 6.67 × 10⁻¹¹ N m² kg⁻²","unit":"N m² kg⁻²","unit_raw":"N m2 kg−2"},{"id":"const_5","type":"constant","name":{"zh":"在真空中光的速率","en":"speed of light in vacuum"},"symbol":"c","formula":"c = 3.00 × 10⁸ m s⁻¹","unit":"m s⁻¹","unit_raw":"m s−1"},{"id":"const_6","type":"constant","name":{"zh":"電子電荷","en":"charge of electron"},"symbol":"q_e","formula":"q_e = 1.60 × 10⁻¹⁹ C","unit":"C","unit_raw":"C"},{"id":"const_7","type":"constant","name":{"zh":"電子靜止質量","en":"electron rest mass"},"symbol":"m_e","formula":"m_e = 9.11 × 10⁻³¹ kg","unit":"kg","unit_raw":"kg"},{"id":"const_8","type":"constant","name":{"zh":"真空電容率","en":"permittivity of free space"},"symbol":"ε₀","formula":"ε₀ = 8.85 × 10⁻¹² C² N⁻¹ m⁻²","unit":"C² N⁻¹ m⁻²","unit_raw":"C2 N−1 m−2"},{"id":"const_9","type":"constant","name":{"zh":"真空磁導率","en":"permeability of free space"},"symbol":"μ₀","formula":"μ₀ = 4π × 10⁻⁷ H m⁻¹","unit":"H m⁻¹","unit_raw":"H m−1"},{"id":"qty_force","type":"quantity","source_tag":"C&A Guide compulsory (Force and Motion)","name":{"zh":"力","en":"force"},"symbol":"F","formula":"use newton as a unit of force","unit":"N","unit_raw":"N"},{"id":"qty_temp_C","type":"quantity","source_tag":"C&A Guide compulsory (Heat and Gases)","name":{"zh":"溫度（攝氏）","en":"temperature (degree Celsius)"},"symbol":"t","formula":"define and use degree Celsius as a unit of temperature","unit":"°C","unit_raw":"degree Celsius"},{"id":"qty_temp_K","type":"quantity","source_tag":"C&A Guide compulsory (Heat and Gases)","name":{"zh":"溫度（開爾文）","en":"temperature (kelvin)"},"symbol":"T","formula":"use kelvin as a unit of temperature","unit":"K","unit_raw":"K"},{"id":"qty_dB","type":"quantity","source_tag":"C&A Guide compulsory (Wave Motion — sound)","name":{"zh":"聲強級","en":"sound intensity level"},"symbol":"L","formula":"represent sound intensity level using the unit decibel","unit":"dB","unit_raw":"dB"},{"id":"qty_kWh","type":"quantity","source_tag":"C&A Guide compulsory (Electricity and Magnetism)","name":{"zh":"電能","en":"electrical energy"},"symbol":"E","formula":"use kilowatt-hour (kW h) as a unit of electrical energy","unit":"kW h","unit_raw":"kW h"},{"id":"qty_Wb","type":"quantity","source_tag":"C&A Guide compulsory (Electricity and Magnetism)","name":{"zh":"磁通量","en":"magnetic flux"},"symbol":"Φ","formula":"define magnetic flux Φ = BA cosθ and weber (Wb) as a unit of magnetic flux","unit":"Wb","unit_raw":"Wb"},{"id":"qty_Sv","type":"quantity","source_tag":"C&A Guide compulsory (Radioactivity and Nuclear Energy)","name":{"zh":"輻射等效劑量","en":"radiation equivalent dose"},"symbol":"H","formula":"represent radiation equivalent dose using the unit sievert (Sv)","unit":"Sv","unit_raw":"Sv"},{"id":"qty_lm","type":"quantity","source_tag":"C&A Guide elective E3 (Energy and Use of Energy)","name":{"zh":"光通量","en":"luminous flux"},"symbol":"Φ","formula":"use lumen as a unit of luminous flux","unit":"lm","unit_raw":"lm"},{"id":"qty_lx","type":"quantity","source_tag":"C&A Guide elective E3 (Energy and Use of Energy)","name":{"zh":"照明度","en":"illuminance"},"symbol":"E","formula":"use lux as a unit of illuminance","unit":"lx","unit_raw":"lx"},{"id":"qty_dioptre","type":"quantity","source_tag":"C&A Guide elective E4 (Medical Physics)","name":{"zh":"透鏡焦度","en":"power of a lens"},"symbol":"P","formula":"use dioptre as a unit of power of a lens","unit":"D","unit_raw":"dioptre"}],"formulae":[{"id":"A1","formula":"E = mcΔT","name":{"zh":"加熱和冷卻時的能量轉移","en":"energy transfer during heating and cooling"}},{"id":"A2","formula":"E = lΔm","name":{"zh":"物態變化時的能量轉移","en":"energy transfer during change of state"}},{"id":"A3","formula":"pV = nRT","name":{"zh":"理想氣體物態方程","en":"equation of state for an ideal gas"}},{"id":"A4","formula":"pV = (1/3)Nmc̄²","name":{"zh":"分子運動論方程","en":"kinetic theory equation"}},{"id":"A5","formula":"E_K = (3/2)(RT/N_A)","name":{"zh":"氣體分子動能","en":"molecular kinetic energy"}},{"id":"B1","formula":"F = m(Δv/Δt) = Δp/Δt","name":{"zh":"力","en":"force"}},{"id":"B2","formula":"moment = F × d","name":{"zh":"力矩","en":"moment of a force"}},{"id":"B3","formula":"E_P = mgh","name":{"zh":"重力勢能","en":"gravitational potential energy"}},{"id":"B4","formula":"E_K = (1/2)mv²","name":{"zh":"動能","en":"kinetic energy"}},{"id":"B5","formula":"P = Fv","name":{"zh":"機械功率","en":"mechanical power"}},{"id":"B6","formula":"a = v²/r = ω²r","name":{"zh":"向心加速度","en":"centripetal acceleration"}},{"id":"B7","formula":"F = Gm₁m₂/r²","name":{"zh":"牛頓萬有引力定律","en":"Newton's law of gravitation"}},{"id":"C1","formula":"Δy = λD/a","name":{"zh":"雙縫干涉條紋間距","en":"fringe separation in double-slit interference"}},{"id":"C2","formula":"d sinθ = nλ","name":{"zh":"衍射光柵方程","en":"diffraction grating equation"}},{"id":"C3","formula":"1/u + 1/v = 1/f","name":{"zh":"單塊透鏡方程","en":"equation for a single lens"}},{"id":"D1","formula":"F = Q₁Q₂/(4πε₀r²)","name":{"zh":"庫倫定律","en":"Coulomb's law"}},{"id":"D2","formula":"E = Q/(4πε₀r²)","name":{"zh":"點電荷的電場強度","en":"electric field strength due to a point charge"}},{"id":"D3","formula":"E = V/d","name":{"zh":"平行板間的電場（數值）","en":"electric field between parallel plates (numerically)"}},{"id":"D4","formula":"R = ρℓ/A","name":{"zh":"電阻和電阻率","en":"resistance and resistivity"}},{"id":"D5","formula":"R = R₁ + R₂","name":{"zh":"串聯電阻器","en":"resistors in series"}},{"id":"D6","formula":"1/R = 1/R₁ + 1/R₂","name":{"zh":"並聯電阻器","en":"resistors in parallel"}},{"id":"D7","formula":"P = IV = I²R","name":{"zh":"電路中的功率","en":"power in a circuit"}},{"id":"D8","formula":"F = BQv sinθ","name":{"zh":"磁場對運動電荷的作用力","en":"force on a moving charge in a magnetic field"}},{"id":"D9","formula":"F = BIl sinθ","name":{"zh":"磁場對載流導體的作用力","en":"force on a current-carrying conductor in a magnetic field"}},{"id":"D10","formula":"B = μ₀I/(2πr)","name":{"zh":"長直導線所產生的磁場","en":"magnetic field due to a long straight wire"}},{"id":"D11","formula":"B = μ₀NI/ℓ","name":{"zh":"螺線管中的磁場","en":"magnetic field inside a long solenoid"}},{"id":"D12","formula":"ε = N(ΔΦ/Δt)","name":{"zh":"感生電動勢","en":"induced e.m.f."}},{"id":"D13","formula":"V_s/V_p ≈ N_s/N_p","name":{"zh":"變壓器副電壓與原電壓之比","en":"ratio of secondary voltage to primary voltage in a transformer"}},{"id":"M1","formula":"v = u + at","name":{"zh":"勻加速運動（速度）","en":"uniformly accelerated motion (velocity)"}},{"id":"M2","formula":"s = ut + (1/2)at²","name":{"zh":"勻加速運動（位移）","en":"uniformly accelerated motion (displacement)"}},{"id":"M3","formula":"v² = u² + 2as","name":{"zh":"勻加速運動（無時間）","en":"uniformly accelerated motion (without time)"}}],"scope_note":{"zh":"單位題：公式表 Data 9 個常數＋C&A Guide 明示單位（必修＋E3/E4）。已排除 E1 天文學、E2 原子世界（AU/ly/pc/σ/u/h；eV／原子質量單位等）。公式題：31 條（剔衰變／半衰期／放射強度／質能）。","en":"Units: 9 Formulae Data constants + C&A Guide explicit units (compulsory + E3/E4). Excludes E1/E2 (AU/ly/pc/σ/u/h; eV / atomic mass unit). Formulae: 31 (excl. decay / half-life / activity / mass–energy)."}};

  function refillUnitDeck() {
    // Prefer one item per distinct unit first, then any leftovers — exhaust all before reshuffle
    // Mutate in place so takeFromDeck keeps the same array reference.
    var byUnit = {};
    BANK.constants.forEach(function (c) {
      if (!c.unit) return;
      if (!byUnit[c.unit]) byUnit[c.unit] = [];
      byUnit[c.unit].push(c);
    });
    var primary = [];
    var leftover = [];
    Object.keys(byUnit).forEach(function (u) {
      var group = shuffle(byUnit[u]);
      primary.push(group[0]);
      for (var i = 1; i < group.length; i++) leftover.push(group[i]);
    });
    var next = shuffle(primary).concat(shuffle(leftover));
    unitDeck.length = 0;
    for (var i = 0; i < next.length; i++) unitDeck.push(next[i]);
  }

    var next = shuffle(BANK.formulae.slice());
    formulaDeck.length = 0;
    for (var i = 0; i < next.length; i++) formulaDeck.push(next[i]);
  }

  function takeFromDeck(deck, n, refill) {
    var out = [];
    while (out.length < n) {
      if (!deck.length) refill();
      if (!deck.length) break;
      out.push(deck.pop());
    }
    return out;
  }


  var matchList = document.getElementById("matchList");
  var chipPool = document.getElementById("chipPool");
  var feedback = document.getElementById("feedback");


  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function frac(numHtml, denHtml) {
    return '<span class="frac"><span class="num">' + numHtml + '</span><span class="den">' + denHtml + '</span></span>';
  }
  /** Convert common HKDSE linear formula strings to stacked-fraction HTML. */
  function formulaToHtml(str) {
    if (!str) return "";
    var s = String(str);
    // Exact / high-priority multi-token patterns first
    var map = [
      ["1/u + 1/v = 1/f", frac("1","u") + " + " + frac("1","v") + " = " + frac("1","f")],
      ["1/R = 1/R₁ + 1/R₂", frac("1","R") + " = " + frac("1","R₁") + " + " + frac("1","R₂")],
      ["E_K = (3/2)(RT/N_A)", "E_K = " + frac("3","2") + "(" + frac("RT","N_A") + ")"],
      ["E_K = (1/2)mv²", "E_K = " + frac("1","2") + "mv²"],
      ["pV = (1/3)Nmc̄²", "pV = " + frac("1","3") + "Nmc̄²"],
      ["s = ut + (1/2)at²", "s = ut + " + frac("1","2") + "at²"],
      ["F = m(Δv/Δt) = Δp/Δt", "F = m(" + frac("Δv","Δt") + ") = " + frac("Δp","Δt")],
      ["F = Q₁Q₂/(4πε₀r²)", "F = " + frac("Q₁Q₂","4πε₀r²")],
      ["E = Q/(4πε₀r²)", "E = " + frac("Q","4πε₀r²")],
      ["B = μ₀I/(2πr)", "B = " + frac("μ₀I","2πr")],
      ["B = μ₀NI/ℓ", "B = " + frac("μ₀NI","ℓ")],
      ["ε = N(ΔΦ/Δt)", "ε = N(" + frac("ΔΦ","Δt") + ")"],
      ["V_s/V_p ≈ N_s/N_p", frac("V_s","V_p") + " ≈ " + frac("N_s","N_p")],
      ["a = v²/r = ω²r", "a = " + frac("v²","r") + " = ω²r"],
      ["F = Gm₁m₂/r²", "F = " + frac("Gm₁m₂","r²")],
      ["Δy = λD/a", "Δy = " + frac("λD","a")],
      ["E = V/d", "E = " + frac("V","d")],
      ["R = ρℓ/A", "R = " + frac("ρℓ","A")]
    ];
    for (var i = 0; i < map.length; i++) {
      if (s === map[i][0]) return map[i][1];
    }
    // Generic fallbacks for residual patterns (safe order)
    s = esc(s);
    // Restore nothing — we escaped; for fallback rebuild from raw again
    s = String(str);
    // Apply smaller replacements on a working copy (no HTML yet)
    function applyOnce(input, pattern, replacer) {
      return input.replace(pattern, replacer);
    }
    // Parenthesized simple fractions
    s = s.replace(/\((\d)\/(\d)\)/g, function (_, a, b) { return frac(a, b); });
    // 1/u style singles already handled by exact map; leftover:
    s = s.replace(/\b1\/([A-Za-z₀₁₂₃₄₅₆₇₈₉ΦελμΔθωρ_]+)/g, function (_, den) {
      return frac("1", den);
    });
    // X/Y where both sides are symbol-ish (no spaces)
    // Avoid double-processing already-frac HTML by only running on raw if no .frac yet
    if (s.indexOf('class="frac"') < 0) {
      s = s.replace(/([A-Za-z₀₁₂₃₄₅₆₇₈₉ΦελμΔθωρ_][A-Za-z0-9₀₁₂₃₄₅₆₇₈₉ΦελμΔθωρ_²³⁻]*)\/([A-Za-z0-9₀₁₂₃₄₅₆₇₈₉ΦελμΔθωρ_²³⁻πℓ]+)/g, function (m, num, den) {
        return frac(num, den);
      });
    }
    return s;
  }
  function setFormulaPrompt(el, formulaStr) {
    el.innerHTML = formulaToHtml(formulaStr);
  }

  function t() { return UI[lang]; }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function applyLang() {
    var u = t();
    document.getElementById("title").textContent = u.title;
    document.getElementById("subtitle").textContent = u.subtitle;
    document.getElementById("btnModeUnit").textContent = u.modeUnit;
    document.getElementById("btnModeFormula").textContent = u.modeFormula;
    document.getElementById("hintBar").textContent = mode === "unit" ? u.hintUnit : u.hintFormula;
    document.getElementById("poolLabel").textContent = u.pool;
    document.getElementById("btnClear").textContent = u.clear;
    document.getElementById("btnNew").textContent = u.next;
    document.getElementById("btnSubmit").textContent = u.submit;
    document.getElementById("lblTried").textContent = u.tried;
    document.getElementById("lblCorrect").textContent = u.correct;
    document.getElementById("lblRounds").textContent = u.rounds;
    document.getElementById("srcNote").textContent = u.sourcePrefix + BANK.source[lang];
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll(".lang-btn").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });
    // refresh prompts / placeholders if round exists
    if (roundItems.length) refreshTextsKeepAnswers();
  }

  function refreshTextsKeepAnswers() {
    var u = t();
    document.getElementById("hintBar").textContent = mode === "unit" ? u.hintUnit : u.hintFormula;
    document.querySelectorAll(".drop-slot").forEach(function (s) {
      s.setAttribute("data-placeholder", u.slot);
    });
    roundItems.forEach(function (item, idx) {
      var row = matchList.children[idx];
      if (!row) return;
      var rebuilt = buildItemDisplay(item);
      if (mode === "formula") setFormulaPrompt(row.querySelector(".prompt .main"), rebuilt.promptMain);
      else row.querySelector(".prompt .main").textContent = rebuilt.promptMain;
      row.querySelector(".prompt .meta").textContent = rebuilt.promptMeta;
      var chip = row.querySelector(".drop-slot .chip");
      if (chip && mode === "formula") {
        // answer chips are names — update language
        var ansItem = findFormulaById(item.id);
        if (ansItem) chip.textContent = ansItem.name[lang];
      }
      if (chip && mode === "unit") {
        chip.textContent = item.answer;
      }
      var ca = row.querySelector(".correct-ans");
      if (ca) {
        var ansText = mode === "unit" ? item.answer : (findFormulaById(item.id).name[lang]);
        ca.textContent = u.showAns + ansText;
      }
    });
    // pool chips for formula mode
    if (mode === "formula") {
      chipPool.querySelectorAll(".chip").forEach(function (chip) {
        var id = chip.getAttribute("data-id");
        var f = findFormulaById(id);
        if (f) chip.textContent = f.name[lang];
      });
    }
  }

  function findFormulaById(id) {
    for (var i = 0; i < BANK.formulae.length; i++) {
      if (BANK.formulae[i].id === id) return BANK.formulae[i];
    }
    return null;
  }

  function buildItemDisplay(item) {
    if (mode === "unit") {
      var c = null;
      for (var i = 0; i < BANK.constants.length; i++) {
        if (BANK.constants[i].id === item.id) { c = BANK.constants[i]; break; }
      }
      return {
        promptMain: c.name[lang],
        promptMeta: c.symbol,
        answer: c.unit
      };
    } else {
      var f = findFormulaById(item.id);
      return {
        promptMain: f.formula,
        promptMeta: f.id,
        answer: f.name[lang]
      };
    }
  }

  function pickUnitRound() {
    var chosen = takeFromDeck(unitDeck, roundSize(), refillUnitDeck);
    return chosen.map(function (c) {
      return { id: c.id, answer: c.unit, answerKey: c.unit };
    });
  }

  function pickFormulaRound() {
    var list = takeFromDeck(formulaDeck, roundSize(), refillFormulaDeck);
    return list.map(function (f) {
      return { id: f.id, answerKey: f.id };
    });
  }

  function clearPoolKeepLabel() {
    var label = document.getElementById("poolLabel");
    chipPool.innerHTML = "";
    chipPool.appendChild(label);
  }

  function makeChip(text, id) {
    var el = document.createElement("div");
    el.className = "chip";
    el.textContent = text;
    el.setAttribute("draggable", "true");
    el.setAttribute("data-id", id);
    bindChipDnD(el);
    return el;
  }

  function newRound() {
    submitted = false;
    selectedChip = null;
    feedback.innerHTML = "";
    document.getElementById("btnSubmit").disabled = false;
    roundItems = mode === "unit" ? pickUnitRound() : pickFormulaRound();
    matchList.innerHTML = "";
    clearPoolKeepLabel();

    var u = t();
    roundItems.forEach(function (item, idx) {
      var disp = buildItemDisplay(item);
      item.promptMain = disp.promptMain;
      item.promptMeta = disp.promptMeta;
      item.answer = disp.answer;

      var row = document.createElement("div");
      row.className = "match-row";
      row.setAttribute("data-idx", String(idx));

      var prompt = document.createElement("div");
      prompt.className = "prompt";
      prompt.innerHTML = '<div class="main"></div><div class="meta"></div>';
      if (mode === "formula") setFormulaPrompt(prompt.querySelector(".main"), disp.promptMain);
      else prompt.querySelector(".main").textContent = disp.promptMain;
      prompt.querySelector(".meta").textContent = disp.promptMeta;

      var slot = document.createElement("div");
      slot.className = "drop-slot empty";
      slot.setAttribute("data-placeholder", u.slot);
      slot.setAttribute("data-idx", String(idx));
      bindSlot(slot);

      row.appendChild(prompt);
      row.appendChild(slot);
      matchList.appendChild(row);
    });

    var chips = roundItems.map(function (item) {
      if (mode === "unit") return makeChip(item.answer, item.id + "::" + item.answer);
      return makeChip(item.answer, item.id);
    });
    shuffle(chips).forEach(function (c) { chipPool.appendChild(c); });

    document.getElementById("statTried").textContent = String(roundItems.length);
    document.getElementById("statCorrect").textContent = "—";
  }

  function returnChipToPool(chip) {
    chip.classList.remove("in-slot", "locked");
    chip.setAttribute("draggable", "true");
    chipPool.appendChild(chip);
  }

  function placeChipInSlot(chip, slot) {
    if (submitted) return;
    // if slot has chip, return it
    var existing = slot.querySelector(".chip");
    if (existing) returnChipToPool(existing);
    chip.classList.add("in-slot");
    slot.classList.remove("empty");
    slot.appendChild(chip);
    selectedChip = null;
    document.querySelectorAll(".chip").forEach(function (c) { c.style.outline = ""; });
  }

  function bindSlot(slot) {
    slot.addEventListener("dragover", function (e) {
      if (submitted) return;
      e.preventDefault();
      slot.classList.add("drag-over");
    });
    slot.addEventListener("dragleave", function () { slot.classList.remove("drag-over"); });
    slot.addEventListener("drop", function (e) {
      e.preventDefault();
      slot.classList.remove("drag-over");
      if (submitted) return;
      var id = e.dataTransfer.getData("text/plain");
      var chip = document.querySelector('.chip[data-id="' + cssEscape(id) + '"]');
      if (!chip) {
        // fallback: find dragging
        chip = document.querySelector(".chip.dragging");
      }
      if (chip) placeChipInSlot(chip, slot);
    });
    slot.addEventListener("click", function () {
      if (submitted) return;
      if (selectedChip) {
        placeChipInSlot(selectedChip, slot);
      } else {
        var existing = slot.querySelector(".chip");
        if (existing) {
          slot.classList.add("empty");
          returnChipToPool(existing);
        }
      }
    });
  }

  function cssEscape(s) {
    if (window.CSS && CSS.escape) return CSS.escape(s);
    return String(s).replace(/"/g, '\\"');
  }

  var dragChip = null;
  var touchGhost = null;

  function bindChipDnD(el) {
    el.addEventListener("dragstart", function (e) {
      if (submitted || el.classList.contains("locked")) { e.preventDefault(); return; }
      dragChip = el;
      el.classList.add("dragging");
      e.dataTransfer.setData("text/plain", el.getAttribute("data-id"));
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragend", function () {
      el.classList.remove("dragging");
      dragChip = null;
      document.querySelectorAll(".drop-slot").forEach(function (s) { s.classList.remove("drag-over"); });
    });

    el.addEventListener("touchstart", function (e) {
      if (submitted || el.classList.contains("locked")) return;
      if (e.touches.length !== 1) return;
      dragChip = el;
      el.classList.add("dragging");
      var tch = e.touches[0];
      touchGhost = el.cloneNode(true);
      touchGhost.className = "chip drag-ghost";
      touchGhost.style.left = tch.clientX + "px";
      touchGhost.style.top = tch.clientY + "px";
      document.body.appendChild(touchGhost);
    }, { passive: true });

    el.addEventListener("touchmove", function (e) {
      if (!dragChip || !touchGhost) return;
      var tch = e.touches[0];
      touchGhost.style.left = tch.clientX + "px";
      touchGhost.style.top = tch.clientY + "px";
      e.preventDefault();
      var target = document.elementFromPoint(tch.clientX, tch.clientY);
      document.querySelectorAll(".drop-slot").forEach(function (s) { s.classList.remove("drag-over"); });
      var slot = target && target.closest ? target.closest(".drop-slot") : null;
      if (slot) slot.classList.add("drag-over");
    }, { passive: false });

    el.addEventListener("touchend", function (e) {
      if (!dragChip) return;
      var tch = e.changedTouches[0];
      var target = document.elementFromPoint(tch.clientX, tch.clientY);
      var slot = target && target.closest ? target.closest(".drop-slot") : null;
      if (slot && !submitted) placeChipInSlot(dragChip, slot);
      if (touchGhost) { touchGhost.remove(); touchGhost = null; }
      dragChip.classList.remove("dragging");
      dragChip = null;
      document.querySelectorAll(".drop-slot").forEach(function (s) { s.classList.remove("drag-over"); });
    });

    el.addEventListener("click", function (e) {
      if (submitted || el.classList.contains("locked")) return;
      e.stopPropagation();
      if (selectedChip === el) {
        selectedChip = null;
        el.style.outline = "";
        return;
      }
      document.querySelectorAll(".chip").forEach(function (c) { c.style.outline = ""; });
      selectedChip = el;
      el.style.outline = "2px solid " + getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    });
  }

  function clearAnswers() {
    if (submitted) return;
    matchList.querySelectorAll(".drop-slot").forEach(function (slot) {
      var chip = slot.querySelector(".chip");
      if (chip) {
        slot.classList.add("empty");
        returnChipToPool(chip);
      }
    });
    feedback.innerHTML = "";
  }

  function submit() {
    if (submitted) return;
    var slots = matchList.querySelectorAll(".drop-slot");
    var filled = 0;
    slots.forEach(function (s) { if (s.querySelector(".chip")) filled++; });
    if (filled < roundItems.length) {
      feedback.innerHTML = '<span class="bad">' + t().needAll + "</span>";
      return;
    }
    submitted = true;
    var ok = 0;
    var u = t();
    roundItems.forEach(function (item, idx) {
      var row = matchList.children[idx];
      var slot = row.querySelector(".drop-slot");
      var chip = slot.querySelector(".chip");
      var correct = false;
      if (mode === "unit") {
        correct = chip && chip.textContent === item.answerKey;
      } else {
        correct = chip && chip.getAttribute("data-id") === item.answerKey;
      }
      row.classList.remove("ok", "bad");
      row.classList.add(correct ? "ok" : "bad");
      if (chip) {
        chip.classList.add("locked");
        chip.removeAttribute("draggable");
      }
      if (!correct) {
        var ca = document.createElement("span");
        ca.className = "correct-ans";
        var ansText = mode === "unit" ? item.answerKey : findFormulaById(item.id).name[lang];
        ca.textContent = u.showAns + ansText;
        row.querySelector(".prompt").appendChild(ca);
      } else {
        ok++;
      }
    });
    stats.correct += ok;
    stats.rounds += 1;
    document.getElementById("statCorrect").textContent = String(ok);
    document.getElementById("statRounds").textContent = String(stats.rounds);
    feedback.innerHTML = '<span class="' + (ok === roundItems.length ? "ok" : "bad") + '">' +
      u.result(ok, roundItems.length) + "</span>";
    document.getElementById("btnSubmit").disabled = true;
    selectedChip = null;
  }

  // Mode / lang buttons
  document.getElementById("btnModeUnit").addEventListener("click", function () {
    mode = "unit";
    document.getElementById("btnModeUnit").classList.add("active");
    document.getElementById("btnModeFormula").classList.remove("active");
    newRound();
    applyLang();
  });
  document.getElementById("btnModeFormula").addEventListener("click", function () {
    mode = "formula";
    document.getElementById("btnModeFormula").classList.add("active");
    document.getElementById("btnModeUnit").classList.remove("active");
    newRound();
    applyLang();
  });
  document.getElementById("btnZh").addEventListener("click", function () {
    lang = "zh";
    applyLang();
  });
  document.getElementById("btnEn").addEventListener("click", function () {
    lang = "en";
    applyLang();
  });
  document.getElementById("btnClear").addEventListener("click", clearAnswers);
  document.getElementById("btnNew").addEventListener("click", function () {
    newRound();
    applyLang();
  });
  document.getElementById("btnSubmit").addEventListener("click", submit);

  applyLang();
  newRound();
})();
</script>
</body>
</html>

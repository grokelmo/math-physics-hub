<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>物理公式練習</title>
<style>
:root{
  --bg:#f0f4f8;--card:#ffffff;--primary:#1a5f7a;--primary-dark:#0d3d4f;
  --accent:#57c5b6;--accent-soft:#e8f7f5;--ok:#2d9a6a;--ok-bg:#e6f7ef;
  --bad:#c0392b;--bad-bg:#fdecea;--hint:#5b6b7a;--border:#d0dbe6;
  --slot:#f7fafc;
  --shadow:0 2px 10px rgba(26,95,122,.08);--radius:12px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font);
  background:linear-gradient(160deg,#e8f1f5 0%,#f5f0e8 100%);
  color:#1a2a33;min-height:100vh;min-height:100dvh;line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:720px;margin:0 auto;padding:10px 12px calc(88px + var(--safe-bottom))}
header{text-align:center;margin-bottom:8px;padding:6px 4px 2px}
header h1{font-size:1.35rem;color:var(--primary-dark);font-weight:700;letter-spacing:.04em}
.sub{font-size:.78rem;color:var(--hint);margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:12px;margin-bottom:10px}
.lang-pair{display:flex;gap:6px}.toolbar .lang-pair + .lang-pair{margin-left:2px}
.lang-btn,.btn{
  border:1px solid var(--border);background:#fff;color:var(--primary-dark);
  border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;min-height:42px;
}
.lang-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.q-box{
  background:linear-gradient(135deg,#f7fbfd,#eef6f4);border:1px dashed var(--border);
  border-radius:10px;padding:16px 14px;min-height:96px;
}
.q-tag{font-size:.7rem;color:#8a9aa8;margin-bottom:4px}
.q-text{font-size:1.1rem;color:var(--primary-dark);font-weight:600;line-height:1.7;word-break:break-word}
.q-ask{font-size:.82rem;color:var(--hint);margin-top:8px}
.hint-box{
  display:none;margin-top:8px;padding:8px 10px;border-radius:8px;
  background:var(--accent-soft);border:1px solid #b8ddd6;font-size:.82rem;color:var(--primary-dark);
}
.hint-box.show{display:block}
.hint-box .hint-k{font-weight:700;color:var(--hint);margin-right:.25em}
.hint-box .hint-f{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700}
.hint-box .hint-prompt{font-weight:700;color:var(--hint);display:block;margin-bottom:6px;font-size:.78rem}
.formula-opts{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.fopt{
  display:block;width:100%;text-align:left;border:1.5px solid #9bc9c0;background:#fff;
  border-radius:8px;padding:8px 10px;font:inherit;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.92rem;font-weight:700;color:var(--primary-dark);cursor:pointer;min-height:40px;
  transition:background .15s,border-color .15s,opacity .15s;
}
.fopt:hover:not(:disabled){background:#f0faf8;border-color:var(--accent)}
.fopt:disabled{cursor:default;opacity:.95}
.fopt.ok,.fopt.selected.ok{background:var(--ok-bg);border-color:#2d9a6a;color:#1e6b45}
.fopt.bad{background:var(--bad-bg);border-color:#e0a39c;color:#8b2e24;text-decoration:line-through;opacity:.75}
.fopt.locked{pointer-events:none}
.hint-confirm{margin-top:8px;font-size:.8rem;color:var(--primary-dark)}
.hint-confirm .hint-f{font-weight:700}
.frac{
  display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:middle;margin:0 .12em;line-height:1.15;
}
.frac .num{
  padding:0 .28em .08em;border-bottom:1.5px solid currentColor;text-align:center;
  white-space:nowrap;
}
.frac .den{
  padding:.08em .28em 0;text-align:center;white-space:nowrap;
}
.frac .frac{font-size:.92em;margin:0 .04em}
.sqrt{
  display:inline-flex;align-items:stretch;vertical-align:middle;
  margin:0 .08em;line-height:1.15;
}
.sqrt-sym{
  display:flex;align-items:flex-start;justify-content:flex-end;
  font-size:1.95em;font-weight:600;line-height:.92;
  padding:0;margin:0 -.22em 0 0;align-self:stretch;
  letter-spacing:-.08em;
  transform:scaleY(1.18);transform-origin:right top;
}
.sqrt-body{
  border-top:2.25px solid currentColor;
  padding:.14em .34em .1em .02em;
  margin-left:0;
  display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px;
}
.fopt .frac,.hint-f .frac,.fb-sol .frac{font-family:inherit}
.fopt{line-height:1.55}

.lang-btn.hint-used{opacity:.85;border-style:dashed}
.answer-display{
  width:100%;min-height:68px;border:2px solid var(--border);border-radius:10px;
  background:var(--slot);padding:12px 14px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:1.4rem;font-weight:700;color:var(--primary-dark);text-align:right;outline:none;
}
.answer-display:focus{border-color:var(--accent);background:#fff}
.unit-hint{font-size:.75rem;color:var(--hint);text-align:right;margin-top:4px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.kbtn{
  min-height:46px;border:1px solid var(--border);border-radius:10px;background:#fff;
  color:var(--primary-dark);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;
}
.kbtn:active{transform:scale(.97);background:var(--accent-soft)}
.kbtn.fn{background:#eef2f5;color:var(--hint);font-size:.82rem}
.kbtn.ee{font-size:.78rem;letter-spacing:-.02em}
.kbtn.wide{grid-column:span 2}
.actions{
  display:flex;gap:8px;margin-top:10px;position:sticky;bottom:calc(8px + var(--safe-bottom));
  z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:8px;border-radius:12px;border:1px solid var(--border);box-shadow:0 -2px 12px rgba(26,95,122,.1);
}
.btn{flex:1;min-height:48px;border:none;border-radius:10px;padding:12px 10px;font-size:.95rem;font-weight:700;transition:transform .1s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-ghost{background:#eef2f5;color:var(--hint);flex:.7}
.feedback{display:none;border-radius:10px;padding:10px 12px;margin-top:10px;animation:fadeIn .25s ease}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);border:1px solid #a8dfc0;color:#1e6b45}
.feedback.bad{background:var(--bad-bg);border:1px solid #f0b8b2;color:#8b2e24}
.feedback .fb-title{font-weight:700;font-size:1rem;margin-bottom:4px}
.feedback .fb-body{font-size:.85rem;line-height:1.5}
.feedback .fb-ans{
  margin-top:6px;padding:6px 8px;background:rgba(255,255,255,.7);border-radius:8px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;font-weight:600;text-align:center;
}
.feedback .fb-sol{margin-top:6px;font-size:.8rem;opacity:.95;line-height:1.65}
.btn-new-glow{
  background:linear-gradient(135deg,#1a5f7a,#57c5b6)!important;color:#fff!important;
  border:none!important;box-shadow:0 0 0 3px rgba(87,197,182,.35),0 6px 18px rgba(26,95,122,.28);
  animation:newPulse 1.1s ease-in-out infinite;font-size:1.05rem!important;flex:1.35!important;
}
@keyframes newPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(87,197,182,.35),0 6px 18px rgba(26,95,122,.28)}
  50%{transform:scale(1.04);box-shadow:0 0 0 6px rgba(87,197,182,.2),0 8px 22px rgba(26,95,122,.35)}
}
.celebrate-layer{
  pointer-events:none;position:fixed;inset:0;z-index:9999;overflow:hidden;
}
.celebrate-burst{
  position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
  font-size:2.4rem;font-weight:800;color:var(--ok);
  text-shadow:0 2px 12px rgba(45,154,106,.35);
  animation:burstPop .9s ease-out forwards;
  white-space:nowrap;
}
@keyframes burstPop{
  0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  70%{opacity:1;transform:translate(-50%,-55%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-70%) scale(.95)}
}
.confetti{
  position:absolute;width:8px;height:12px;border-radius:2px;top:-12px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(105vh) rotate(720deg);opacity:0}
}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.stats{display:flex;justify-content:space-around;text-align:center;gap:6px}
.stat .n{font-size:1.25rem;font-weight:700;color:var(--primary-dark)}
.stat .l{font-size:.68rem;color:var(--hint)}
.sup{font-size:.65em;vertical-align:super;line-height:0}
@media (max-width:600px){
  .wrap{padding:8px 10px calc(92px + var(--safe-bottom))}
  .card{padding:10px;margin-bottom:8px}
  header h1{font-size:1.15rem}
  .actions{position:fixed;left:10px;right:10px;bottom:calc(6px + var(--safe-bottom));margin-top:0}
  .kbtn{min-height:44px}
}
@media (max-width:400px){
  .wrap{padding:6px 8px calc(90px + var(--safe-bottom))}
  header h1{font-size:1.05rem}
  .kbtn{min-height:42px;font-size:.95rem}
  .btn{min-height:46px;font-size:.9rem;padding:10px 6px}
}
@media (min-width:601px){
  .wrap{padding:16px 14px 32px}
  .card{padding:14px 16px;margin-bottom:12px}
  header{margin-bottom:14px;padding:12px 8px 4px}
  header h1{font-size:1.5rem}
  .actions{position:sticky;bottom:12px}
}

    /* hub back button */
    a.hub-back{
      position:fixed;
      top:max(0.65rem, env(safe-area-inset-top, 0px));
      left:max(0.65rem, env(safe-area-inset-left, 0px));
      z-index:99999;
      width:2.6rem;height:2.6rem;
      border-radius:999px;
      background:#0d5c63;
      color:#fff !important;
      display:flex;align-items:center;justify-content:center;
      text-decoration:none !important;
      font-size:1.35rem;line-height:1;font-weight:700;
      box-shadow:0 2px 10px rgba(13,92,99,.28);
      -webkit-tap-highlight-color:transparent;
    }
    a.hub-back:hover{background:#0a4a50;color:#fff !important;}
    a.hub-back:active{transform:scale(.96);}

</style>
</head>
<body>
<a class="hub-back" href="物理科.html" aria-label="返回上一頁" title="返回上一頁">←</a>

<div class="wrap">
  <header>
    <h1 id="title">物理公式練習</h1>
    <div class="sub" id="subtitle">HKDSE · 代入公式計算</div>
  </header>

  <div class="toolbar">
    <div class="lang-pair">
      <button type="button" class="lang-btn active" id="btnZh" data-lang="zh">繁中</button>
      <button type="button" class="lang-btn" id="btnEn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" id="btnHint">提示</button>
    </div>
    <div class="lang-pair" id="levelPair">
      <button type="button" class="lang-btn active" id="btnL1" data-level="1">程度1</button>
      <button type="button" class="lang-btn" id="btnL2" data-level="2">程度2</button>
      <button type="button" class="lang-btn" id="btnL3" data-level="3">程度3</button>
    </div>
  </div>

  <section class="card">
    <div class="q-box">
      <div class="q-tag" id="qTag"></div>
      <div class="q-text" id="qText">—</div>
      <div class="q-ask" id="qAsk"></div>
      <div class="hint-box" id="hintBox" aria-live="polite"></div>
    </div>
  </section>

  <section class="card">
    <input type="text" class="answer-display" id="answerInput" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="answer">
    <div class="unit-hint" id="unitHint"></div>
    <div class="keypad" id="keypad">
      <button type="button" class="kbtn" data-k="7">7</button>
      <button type="button" class="kbtn" data-k="8">8</button>
      <button type="button" class="kbtn" data-k="9">9</button>
      <button type="button" class="kbtn fn" data-k="BS">⌫</button>
      <button type="button" class="kbtn" data-k="4">4</button>
      <button type="button" class="kbtn" data-k="5">5</button>
      <button type="button" class="kbtn" data-k="6">6</button>
      <button type="button" class="kbtn fn" data-k="C">C</button>
      <button type="button" class="kbtn" data-k="1">1</button>
      <button type="button" class="kbtn" data-k="2">2</button>
      <button type="button" class="kbtn" data-k="3">3</button>
      <button type="button" class="kbtn fn" data-k="-">−</button>
      <button type="button" class="kbtn" data-k="0">0</button>
      <button type="button" class="kbtn" data-k=".">.</button>
      <button type="button" class="kbtn ee wide" data-k="EE">×10^</button>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-ghost" id="btnClear">清除</button>
      <button type="button" class="btn btn-secondary" id="btnNew">新題</button>
      <button type="button" class="btn btn-primary" id="btnSubmit">提交</button>
    </div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><div class="n" id="statTried">0</div><div class="l" id="lblTried">作答</div></div>
      <div class="stat"><div class="n" id="statCorrect">0</div><div class="l" id="lblCorrect">答對</div></div>
      <div class="stat"><div class="n" id="statStreak">0</div><div class="l" id="lblStreak">連對</div></div>
    </div>
  </section>
</div>

<script>
(function () {
  "use strict";

  var G = 6.67e-11, g = 9.81, Rgas = 8.31, cLight = 3.00e8, MU0 = 4 * Math.PI * 1e-7, LN2 = Math.LN2;

  var UI = {
    zh: {
      title: "物理公式練習",
      subtitle: "HKDSE · 代入公式計算",
      ask: "請代入正確公式，計算數值答案（單位已標示）。",
      clear: "清除", newQ: "新題", submit: "提交",
      tried: "作答", correct: "答對", streak: "連對",
      ok: "正確！", bad: "未正確",
      ansLabel: "正確答案", solLabel: "解題",
      unitPrefix: "單位：",
      hint: "提示",
      hintLabel: "選擇正確公式：",
      hintConfirm: "應用公式：",
      hintShown: "已顯示提示",
      formulaPickOk: "✓ 正確公式",
      practiceTag: "練習題",
      level1: "程度1",
      level2: "程度2",
      level3: "程度3",
      levelPrefix: "程度"
    },
    en: {
      title: "Formula Practice",
      subtitle: "HKDSE · Substitute into formulae",
      ask: "Use the correct formula and enter the numerical answer (unit shown).",
      clear: "Clear", newQ: "New", submit: "Submit",
      tried: "Tried", correct: "Correct", streak: "Streak",
      ok: "Correct!", bad: "Not quite",
      ansLabel: "Answer", solLabel: "Solution",
      unitPrefix: "Unit: ",
      hint: "Hint",
      hintLabel: "Choose the correct formula:",
      hintConfirm: "Use formula:",
      hintShown: "Hint shown",
      formulaPickOk: "✓ Correct formula",
      practiceTag: "Practice",
      level1: "Level 1",
      level2: "Level 2",
      level3: "Level 3",
      levelPrefix: "Level"
    }
  };

function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function randStep(min, max, step) {
    var n = Math.round((max - min) / step);
    return +(min + randInt(0, n) * step).toFixed(10);
  }
  function randDec(min, max, dp) {
    var x = min + Math.random() * (max - min);
    var p = Math.pow(10, dp);
    return Math.round(x * p) / p;
  }
  function randSf(min, max, sf) {
    var x = min + Math.random() * (max - min);
    return roundSf(x, sf);
  }
  function shuffle(a) {
    var x = a.slice();
    for (var i = x.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = x[i]; x[i] = x[j]; x[j] = t;
    }
    return x;
  }
  function roundSf(n, sf) {
    if (!isFinite(n) || n === 0) return 0;
    var d = Math.ceil(Math.log10(Math.abs(n)));
    var p = Math.pow(10, sf - d);
    return Math.round(n * p) / p;
  }
  function fmtSci(n) {
    if (!isFinite(n)) return String(n);
    var a = Math.abs(n);
    if (a !== 0 && (a >= 1e4 || a < 1e-2)) {
      var exp = Math.floor(Math.log10(a));
      var m = n / Math.pow(10, exp);
      return roundSf(m, 3).toPrecision(3).replace(/\.?0+$/, "").replace(/\.$/, "") + "×10^" + exp;
    }
    var s = roundSf(n, 3);
    var t = Number(s.toPrecision(3));
    return String(t);
  }
  function fmtDisp(n) {
    if (!isFinite(n)) return String(n);
    var a = Math.abs(n);
    if (a !== 0 && (a >= 1e4 || a < 1e-2)) return fmtSci(n);
    var s = String(n);
    if (s.indexOf("e") >= 0 || s.indexOf("E") >= 0) return fmtSci(n);
    if (s.indexOf(".") >= 0) s = s.replace(/(\.\d*?[1-9])0+$/, "$1").replace(/\.0+$/, "").replace(/\.$/, "");
    return s;
  }
  function parseAnswer(raw) {
    if (!raw) return NaN;
    var s = String(raw).trim().replace(/\s+/g, "").replace(/×/g, "x").replace(/−/g, "-").replace(/X/g, "x");
    s = s.replace(/x10\^?/i, "e").replace(/EE/i, "e").replace(/\*\*10\^?/i, "e");
    if (/e$/i.test(s) || /e[+\-]?$/i.test(s)) return NaN;
    var v = Number(s);
    return v;
  }
  function answersMatch(user, correct) {
    if (!isFinite(user) || !isFinite(correct)) return false;
    if (correct === 0) return Math.abs(user) < 1e-12;
    var rel = Math.abs(user - correct) / Math.abs(correct);
    if (rel <= 0.005) return true;
    var u3 = roundSf(user, 3), c3 = roundSf(correct, 3);
    if (u3 === c3) return true;
    var ue = Number(user.toPrecision(3)), ce = Number(correct.toPrecision(3));
    return ue === ce;
  }


  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function frac(numHtml, denHtml) {
    return '<span class="frac"><span class="num">' + numHtml + '</span><span class="den">' + denHtml + '</span></span>';
  }
  function sqrt(innerHtml) {
    return '<span class="sqrt"><span class="sqrt-sym" aria-hidden="true">√</span><span class="sqrt-body">' + innerHtml + '</span></span>';
  }

  var PREF_R = [5, 10, 15, 20, 22, 33, 47, 50, 68, 100, 150, 200];

  var ALL_FORMULAS = [
    { id: "A1", display: "E = mcΔT" },
    { id: "A2", display: "E = ℓΔm" },
    { id: "A3", display: "pV = nRT" },
    { id: "B3", display: "PE = mgh" },
    { id: "B4", display: "KE = ½mv²" },
    { id: "B5", display: "P = Fv" },
    { id: "B6", display: "a = " + frac("v²", "r") },
    { id: "B7", display: "F = " + frac("Gm₁m₂", "r²") },
    { id: "K1", display: "v = u + at" },
    { id: "K2", display: "s = ut + ½at²" },
    { id: "K3", display: "v² = u² + 2as" },
    { id: "D3", display: "E = " + frac("V", "d") },
    { id: "D4", display: "R = " + frac("ρℓ", "A") },
    { id: "D5", display: "R = R₁ + R₂" },
    { id: "D6", display: frac("1", "R") + " = " + frac("1", "R₁") + " + " + frac("1", "R₂") },
    { id: "D7", display: "P = IV = I²R" },
    { id: "D9", display: "F = BIl sinθ" },
    { id: "D10", display: "B = " + frac("μ₀I", "2πr") },
    { id: "D11", display: "B = " + frac("μ₀NI", "ℓ") },
    { id: "D13", display: frac("Vs", "Vp") + " ≈ " + frac("Ns", "Np") },
    { id: "E2", display: "t½ = " + frac("ln2", "k") },
    { id: "E3", display: "A = kN" },

  function refillQueue() {
    var idxs = [];
    for (var i = 0; i < TEMPLATES.length; i++) {
      if ((TEMPLATES[i].level || 1) === state.level) idxs.push(i);
    }
    state.queue = shuffle(idxs);
  }

  function nextQuestion() {
    if (!state.queue.length) refillQueue();
    var idx = state.queue.pop();
    var tpl = TEMPLATES[idx];
    var built = tpl.build();
    var fp = tpl.id + "|" + roundSf(built.answer, 4);
    var tries = 0;
    while (state.recentFingerprints.indexOf(fp) >= 0 && tries < 2) {
      built = tpl.build();
      fp = tpl.id + "|" + roundSf(built.answer, 4);
      tries++;
    }
    state.recentFingerprints.push(fp);
    if (state.recentFingerprints.length > 15) state.recentFingerprints.shift();
    state.current = {
      tpl: tpl,
      built: built,
      formulaOptions: null,
      formulaPickedId: null,
      formulaPickCorrect: false,
      formulaWrongIds: []
    };
    state.submitted = false;
    state.answerRaw = "";
    state.hintShown = false;
    el.answerInput.value = "";
    el.answerInput.disabled = false;
    el.feedback.className = "feedback";
    el.feedback.innerHTML = "";
    el.btnSubmit.disabled = false;
    setNewEmphasis(false);
    el.hintBox.className = "hint-box";
    el.hintBox.innerHTML = "";
    renderAll();
  }

    el.btnL3.textContent = u.level3;
    el.btnL1.classList.toggle("active", state.level === 1);
    el.btnL2.classList.toggle("active", state.level === 2);
    el.btnL3.classList.toggle("active", state.level === 3);
    document.documentElement.lang = state.lang === "zh" ? "zh-Hant" : "en";
    updateHintPanel();
  }

  function ensureFormulaOptions() {
    if (!state.current) return;
    if (state.current.formulaOptions && state.current.formulaOptions.length) return;
    var tpl = state.current.tpl;
    state.current.formulaOptions = buildFormulaOptions(tpl.formulaId);
  }

  function updateHintPanel() {
    var u = UI[state.lang];
    if (!state.current || !state.hintShown) {
      el.hintBox.className = "hint-box";
      el.hintBox.innerHTML = "";
      return;
    }
    ensureFormulaOptions();
    var cur = state.current;
    var tpl = cur.tpl;
    var opts = cur.formulaOptions || [];
    var correctSet = correctFormulaIds(tpl);
    var locked = !!cur.formulaPickCorrect;
    var html = "<span class='hint-prompt'>" + u.hintLabel + "</span><div class='formula-opts'>";
    for (var i = 0; i < opts.length; i++) {
      var o = opts[i];
      var cls = "fopt";
      var isCorrectOpt = correctSet.indexOf(o.id) >= 0;
      var wasWrong = cur.formulaWrongIds.indexOf(o.id) >= 0;
      if (locked && isCorrectOpt) cls += " ok selected";
      else if (wasWrong) cls += " bad";
      if (locked) cls += " locked";
      var dis = locked || wasWrong ? " disabled" : "";
      html += "<button type='button' class='" + cls + "' data-fid='" + o.id + "'" + dis + ">" + o.display + "</button>";
    }
    html += "</div>";
    if (locked) {
      var displays = [];
      for (var j = 0; j < correctSet.length; j++) {
        var ff = FORMULA_MAP[correctSet[j]];
        if (ff) displays.push(ff.display);
      }
      var name = tpl.name[state.lang];
      html += "<div class='hint-confirm'><span class='hint-k'>" + u.hintConfirm + "</span>" +
        "<span class='hint-f'>" + displays.join("；") + "</span> — " + name +
        " <span class='hint-k'>" + u.formulaPickOk + "</span></div>";
    }
    el.hintBox.className = "hint-box show";
    el.hintBox.innerHTML = html;
  }

  function onFormulaPick(fid) {
    if (!state.current || !state.hintShown || state.current.formulaPickCorrect) return;
    var cur = state.current;
    var correctSet = correctFormulaIds(cur.tpl);
    if (correctSet.indexOf(fid) >= 0) {
      cur.formulaPickedId = fid;
      cur.formulaPickCorrect = true;
    } else {
      if (cur.formulaWrongIds.indexOf(fid) < 0) cur.formulaWrongIds.push(fid);
      cur.formulaPickedId = fid;
    }
    updateHintPanel();
  }

  function showHint() {
    if (!state.current) return;
    state.hintShown = true;
    ensureFormulaOptions();
    var u = UI[state.lang];
    el.btnHint.textContent = u.hintShown;
    el.btnHint.classList.add("hint-used");
    updateHintPanel();
  }

  function renderQuestion() {
    if (!state.current) return;
    var c = state.current;
    var u = UI[state.lang];
    var lvlLabel = state.lang === "zh" ? (u.levelPrefix + state.level) : (u.levelPrefix + " " + state.level);
    var topic = c.tpl.name[state.lang];
    el.qTag.textContent = lvlLabel + " · " + topic;
    el.qText.textContent = state.lang === "zh" ? c.built.textZh : c.built.textEn;
    var unit = state.lang === "zh" ? c.built.unitZh : c.built.unitEn;
    el.unitHint.textContent = u.unitPrefix + unit;
    updateHintPanel();
  }

  function renderStats() {
    el.statTried.textContent = String(state.tried);
    el.statCorrect.textContent = String(state.correct);
    el.statStreak.textContent = String(state.streak);
  }

  function renderAll() {
    applyLangUI();
    renderQuestion();
    renderStats();
  }

  function setAnswer(s) {
    state.answerRaw = s;
    el.answerInput.value = s;
  }

  function appendKey(k) {
    if (state.submitted) return;
    var cur = state.answerRaw || "";
    if (k === "BS") {
      setAnswer(cur.slice(0, -1));
      return;
    }
    if (k === "C") {
      setAnswer("");
      return;
    }
    if (k === "EE") {
      if (/e/i.test(cur) || /×10\^/.test(cur)) return;
      if (!cur || cur === "-" || cur === ".") return;
      setAnswer(cur + "×10^");
      return;
    }
    if (k === "-") {
      if (cur.indexOf("×10^") >= 0) {
        var parts = cur.split("×10^");
        if (parts[1] === "") setAnswer(parts[0] + "×10^-");
        return;
      }
      if (cur === "") setAnswer("-");
      return;
    }
    if (k === ".") {
      if (cur.indexOf("×10^") >= 0) {
        var p2 = cur.split("×10^")[1] || "";
        if (p2.indexOf(".") >= 0) return;
        setAnswer(cur + ".");
        return;
      }
      if (cur.indexOf(".") >= 0) return;
      setAnswer((cur || "0") + ".");
      return;
    }
    setAnswer(cur + k);
  }

  function submit() {
    if (!state.current || state.submitted) return;
    var built = state.current.built;
    var user = parseAnswer(state.answerRaw || el.answerInput.value);
    var ok = answersMatch(user, built.answer);
    state.submitted = true;
    state.tried += 1;
    if (ok) {
      state.correct += 1;
      state.streak += 1;
    } else {
      state.streak = 0;
    }
    var u = UI[state.lang];
    var unit = state.lang === "zh" ? built.unitZh : built.unitEn;
    var sol = state.lang === "zh" ? built.solutionZh : built.solutionEn;
    el.feedback.className = "feedback show " + (ok ? "ok" : "bad");
    el.feedback.innerHTML =
      "<div class='fb-title'>" + (ok ? u.ok : u.bad) + "</div>" +
      "<div class='fb-body'>" + u.ansLabel + "</div>" +
      "<div class='fb-ans'>" + fmtSci(built.answer) + " " + unit + "</div>" +
      "<div class='fb-sol'><strong>" + u.solLabel + "</strong><br>" + String(sol).replace(/\n/g, "<br>") + "</div>";
    el.answerInput.disabled = true;
    el.btnSubmit.disabled = true;
    setNewEmphasis(true);
    if (ok) celebrateCorrect();
    renderQuestion();
    renderStats();
  }

  function setNewEmphasis(on) {
    if (on) {
      el.btnNew.classList.add("btn-new-glow");
      el.btnNew.classList.remove("btn-secondary");
    } else {
      el.btnNew.classList.remove("btn-new-glow");
      if (!el.btnNew.classList.contains("btn-secondary")) el.btnNew.classList.add("btn-secondary");
    }
  }

  function celebrateCorrect() {
    var layer = document.createElement("div");
    layer.className = "celebrate-layer";
    var msgsZh = ["做得好！", "太棒了！", "繼續加油！", "正確！👍"];
    var msgsEn = ["Well done!", "Great!", "Keep going!", "Correct! 👍"];
    var msgs = state.lang === "zh" ? msgsZh : msgsEn;
    var burst = document.createElement("div");
    burst.className = "celebrate-burst";
    burst.textContent = msgs[Math.floor(Math.random() * msgs.length)];
    layer.appendChild(burst);
    var colors = ["#57c5b6", "#1a5f7a", "#2d9a6a", "#f4a261", "#e9c46a", "#e76f51"];
    for (var i = 0; i < 28; i++) {
      var c = document.createElement("span");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "%";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.4 + Math.random() * 1.4) + "s";
      c.style.animationDelay = (Math.random() * 0.35) + "s";
      c.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
      layer.appendChild(c);
    }
    document.body.appendChild(layer);
    setTimeout(function () {
      if (layer.parentNode) layer.parentNode.removeChild(layer);
    }, 2800);
  }

  document.getElementById("keypad").addEventListener("click", function (e) {
    var t = e.target.closest("[data-k]");
    if (!t) return;
    appendKey(t.getAttribute("data-k"));
  });

  el.answerInput.addEventListener("input", function () {
    if (state.submitted) return;
    state.answerRaw = el.answerInput.value;
  });

  el.btnClear.addEventListener("click", function () {
    if (state.submitted) return;
    setAnswer("");
    el.answerInput.focus();
  });
  el.btnNew.addEventListener("click", function () { nextQuestion(); });
  el.btnSubmit.addEventListener("click", submit);

  el.btnHint.addEventListener("click", function () { showHint(); });

  el.hintBox.addEventListener("click", function (e) {
    var t = e.target.closest("[data-fid]");
    if (!t || t.disabled) return;
    onFormulaPick(t.getAttribute("data-fid"));
  });

  el.btnZh.addEventListener("click", function () {
    state.lang = "zh";
    renderAll();
  });
  el.btnEn.addEventListener("click", function () {
    state.lang = "en";
    renderAll();
  });

  function setLevel(lv) {
    if (state.level === lv) return;
    state.level = lv;
    state.queue = [];
    state.recentFingerprints = [];
    refillQueue();
    nextQuestion();
  }
  el.btnL1.addEventListener("click", function () { setLevel(1); });
  el.btnL2.addEventListener("click", function () { setLevel(2); });
  el.btnL3.addEventListener("click", function () { setLevel(3); });

  el.answerInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      submit();
    }
  });

  refillQueue();
  nextQuestion();
})();
</script>
</body>
</html>
